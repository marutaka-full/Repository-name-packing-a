  } else if (a === 'register-product-change') {
    state._registerBuf.main_product_id = e.currentTarget.value;
    // 品目を変えたら規格は選び直し。規格が1つの品目はそれを自動で選ぶ
    const _sps = specsOf(state._registerBuf.main_product_id);
    state._registerBuf.main_spec_id = (_sps.length === 1) ? _sps[0].id : '';
    render();
  } else if (a === 'register-quantity-change') {
    state._registerBuf.quantity = e.currentTarget.value;
    render();
  } else if (a === 'register-spec-change') {
    state._registerBuf.main_spec_id = e.currentTarget.value;
    render();
  } else if (a === 'register-sub-toggle') {
    const taskId = e.currentTarget.dataset.taskId;
    if (e.currentTarget.checked) {
      state._registerBuf.sub_tasks[taskId] = state._registerBuf.sub_tasks[taskId] || '';
    } else {
      delete state._registerBuf.sub_tasks[taskId];
    }
    render();
  } else if (a === 'register-sub-duration') {
    const taskId = e.currentTarget.dataset.taskId;
    state._registerBuf.sub_tasks[taskId] = e.currentTarget.value;
    // input イベントなので再renderしない（フォーカス維持）
  } else if (a === 'save-work-register') {
    // 入力中の sub_tasks 値を収集
    document.querySelectorAll('input[data-action="register-sub-duration"]').forEach(el => {
      const taskId = el.dataset.taskId;
      state._registerBuf.sub_tasks[taskId] = el.value;
    });
    const buf = state._registerBuf;
    if (!buf.main_task_id || !buf.main_product_id || !buf.quantity) { alert('主作業・品目・数量は必須です'); return; }
    if (specsOf(buf.main_product_id).length > 0 && !buf.main_spec_id) { alert('規格を選んでください'); return; }
    const emp = state.employees.find(em => em.id === state.current_employee_id);
    const today = todayStr();
    // 最後のWORK_STARTを取得
    const todayPunches = state.punches
      .filter(p => p.employee_id === emp.id && isOnDate(p.timestamp, today))
      .sort((a2, b2) => String(a2.timestamp || '').localeCompare(String(b2.timestamp || '')));
    let workStartPunch = null;
    for (let i = todayPunches.length - 1; i >= 0; i--) {
      if (todayPunches[i].type === 'WORK_START') { workStartPunch = todayPunches[i]; break; }
      if (['WORK_END', 'BREAK', 'END'].includes(todayPunches[i].type)) break;
    }
    if (!workStartPunch) { alert('作業開始の打刻がありません'); return; }
    // WORK_END打刻
    // 【2026-08-08 修正】ペア作業のときは、開始したときと同じ session_id を必ず付ける。
    // 付けずに終わるとセッションが閉じず、本人が「作業中」のまま抜けられなくなっていた。
    // 休憩・退勤ボタンは以前から session_id を付けて checkSessionEnding も呼んでいたが、
    // 出来高登録からの作業終了だけが抜けていた。
    const now = new Date().toISOString();
    const endSessionId = workStartPunch.session_id || null;
    await punch('WORK_END', null, endSessionId);
    await checkSessionEnding();
    // 単価取得
    const price = findWorkPrice(buf.main_task_id, buf.main_product_id, buf.main_spec_id);
    const unitPrice = price ? price.unit_price : 0;
    // 【2026-08-12 追加】包材費も記録した瞬間の値を焼き付ける。
    // 単価だけ焼き付けて包材費を焼かないと、包材を改定したとき過去の採算が動く。
    const material = findWorkMaterial(buf.main_task_id, buf.main_product_id, buf.main_spec_id);
    const materialCost = material ? (material.material_cost || 0) : 0;
    const task = state.work_tasks.find(t => t.id === buf.main_task_id);
    // 【2026-08-12 追加】何人が何分たずさわったかを復元する
    const wmembers = buildWorkMembers(endSessionId, emp.id, workStartPunch.timestamp, now);
    const totalPersonMinutes = wmembers.reduce((a2, m) => a2 + (m.minutes || 0), 0);
    // sub_tasks 整形
    const subTasksArr = [];
    for (const tid of Object.keys(buf.sub_tasks)) {
      const min = parseInt(buf.sub_tasks[tid], 10);
      if (min && min > 0) subTasksArr.push({ task_id: tid, duration_min: min });
    }
    // work_records に追加
    const record = {
      id: 'WR-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8),
      employee_id: emp.id,
      work_started_at: workStartPunch.timestamp,
      work_ended_at: now,
      log_completed_at: new Date().toISOString(),
      register_entered_at: state._registerEnteredAt,
      main_task_id: buf.main_task_id,
      main_product_id: buf.main_product_id,
      // 【2026-08-16 v2.3】規格。規格を持たない品目のときは空
      main_spec_id: buf.main_spec_id || '',
      main_spec_label: buf.main_spec_id ? specLabel(buf.main_product_id, buf.main_spec_id) : '',
      quantity: parseFloat(buf.quantity),
      unit: task ? task.unit : '',
      unit_price: unitPrice,
      material_cost: materialCost,
      sub_tasks: subTasksArr,
      // 【2026-08-12 修正】以前はここが常に null で、ペア作業だと何人でやったか分からなかった
      session_id: endSessionId,
      members: wmembers,
      total_person_minutes: totalPersonMinutes,
      registered_by: emp.id,
      location: emp.location,
    };
    state.work_records.push(record);
    await saveData(STORAGE_KEYS.WORK_RECORDS, state.work_records);
    state._registerBuf = null;
    state._registerEnteredAt = null;
    state.screen = 'personal';
    render();
  } else if (a === 'go-reports') {
    state._reportTab = 'wage';
    state._reportDate = new Date();
    state._reportYM = currentYM();
    state.screen = 'reports';
    render();
  } else if (a === 'report-tab') {
    state._reportTab = e.currentTarget.dataset.tab;
    render();
  } else if (a === 'volume-view') {
    state._volumeView = e.currentTarget.dataset.view;
    render();
  } else if (a === 'monthly-view') {
    state._monthlyView = e.currentTarget.dataset.view;
    render();
  } else if (a === 'ship-task-change') {
    if (!state._shipBuf) state._shipBuf = {};
    state._shipBuf.task_id = e.currentTarget.value;
    render();
  } else if (a === 'ship-product-change') {
    if (!state._shipBuf) state._shipBuf = {};
    state._shipBuf.product_id = e.currentTarget.value;
    render();
  } else if (a === 'ship-input') {
    if (!state._shipBuf) state._shipBuf = {};
    const field = e.currentTarget.dataset.field;
    state._shipBuf[field] = e.currentTarget.value;
    render();
  } else if (a === 'report-month-prev') {
    const ym = state._reportYM;
    let m = ym.month - 1, y = ym.year;
    if (m < 1) { m = 12; y--; }
    state._reportYM = { year: y, month: m };
    render();
  } else if (a === 'report-month-next') {
    const ym = state._reportYM;
    let m = ym.month + 1, y = ym.year;
    if (m > 12) { m = 1; y++; }
    state._reportYM = { year: y, month: m };
    render();
  } else if (a === 'report-month-current') {
    state._reportYM = currentYM();
    render();
  } else if (a === 'report-month-change') {
    const v = e.currentTarget.value;
    if (v) {
      const [y, m] = v.split('-').map(Number);
      state._reportYM = { year: y, month: m };
      render();
    }
  } else if (a === 'print-monthly') {
    window.print();
  } else if (a === 'export-monthly-csv') {
    exportMonthlyCSV();
  } else if (a === 'report-day-prev') {
    state._reportDate = addDays(state._reportDate, -1);
    render();
  } else if (a === 'report-day-next') {
    state._reportDate = addDays(state._reportDate, 1);
    render();
  } else if (a === 'report-day-today') {
    state._reportDate = new Date();
    render();
  } else if (a === 'report-date-change') {
    const v = e.currentTarget.value;
    if (v) { state._reportDate = parseISODate(v); render(); }
  } else if (a === 'go-shift-overview') {
    state._shiftMode = 'day';
    state._shiftDate = new Date();
    state.screen = 'shift_overview';
    render();
  } else if (a === 'shift-mode') {
    state._shiftMode = e.currentTarget.dataset.mode;
    render();
  } else if (a === 'shift-day-prev') {
    state._shiftDate = addDays(state._shiftDate, -1);
    render();
  } else if (a === 'shift-day-next') {
    state._shiftDate = addDays(state._shiftDate, 1);
    render();
  } else if (a === 'shift-day-today') {
    state._shiftDate = new Date();
    render();
  } else if (a === 'shift-week-prev') {
    state._shiftDate = addDays(state._shiftDate, -7);
    render();
  } else if (a === 'shift-week-next') {
    state._shiftDate = addDays(state._shiftDate, 7);
    render();
  } else if (a === 'shift-week-today') {
    state._shiftDate = new Date();
    render();
  } else if (a === 'shift-month-prev') {
    const d = new Date(state._shiftDate);
    d.setDate(1);
    d.setMonth(d.getMonth() - 1);
    state._shiftDate = d;
    render();
  } else if (a === 'shift-month-next') {
    const d = new Date(state._shiftDate);
    d.setDate(1);
    d.setMonth(d.getMonth() + 1);
    state._shiftDate = d;
    render();
  } else if (a === 'shift-month-today') {
    state._shiftDate = new Date();
    render();
  } else if (a === 'shift-date-change') {
    const val = e.currentTarget.value;
    if (val) {
      state._shiftDate = parseISODate(val);
      render();
    }
  } else if (a === 'go-daily-plan') {
    state.screen = 'daily_plan_list';
    render();
  } else if (a === 'back-daily-plan-list') {
    state._patternBuf = null;
    state._patternBufEmpId = null;
    state._editingPatternEmpId = null;
    state._dailyPlanEmpId = null;
    state.screen = 'daily_plan_list';
    render();
  } else if (a === 'edit-pattern') {
    state._editingPatternEmpId = e.currentTarget.dataset.empId;
    state._patternBuf = null;  // 再ロード
    state.screen = 'pattern_edit';
    render();
  } else if (a === 'pattern-set-off') {
    // ボタン操作前に、入力中の時刻を_patternBufへ回収（保険）
    document.querySelectorAll('.pattern-time').forEach(el => {
      const d = el.dataset.day;
      const f = el.dataset.field;
      if (state._patternBuf[d]) state._patternBuf[d][f] = el.value;
    });
    const day = e.currentTarget.dataset.day;
    state._patternBuf[day] = null;
    render();
  } else if (a === 'pattern-set-work') {
    // ボタン操作前に、入力中の時刻を_patternBufへ回収（保険）
    document.querySelectorAll('.pattern-time').forEach(el => {
      const d = el.dataset.day;
      const f = el.dataset.field;
      if (state._patternBuf[d]) state._patternBuf[d][f] = el.value;
    });
    const day = e.currentTarget.dataset.day;
    // 既に時刻が入っていればそれを保持、無ければデフォルト
    if (!state._patternBuf[day]) {
      state._patternBuf[day] = { start: '09:00', end: '17:00' };
    }
    render();
  } else if (a === 'pattern-time-change') {
    // 時刻入力の変更を即座に_patternBufへ反映（render()しない＝入力・フォーカス維持）
    const day = e.currentTarget.dataset.day;
    const field = e.currentTarget.dataset.field;
    if (state._patternBuf[day]) state._patternBuf[day][field] = e.currentTarget.value;
  } else if (a === 'save-pattern') {
    // 入力中の時刻も収集
    document.querySelectorAll('.pattern-time').forEach(el => {
      const day = el.dataset.day;
      const field = el.dataset.field;
      if (state._patternBuf[day]) state._patternBuf[day][field] = el.value;
    });
    const empId = state._editingPatternEmpId;
    const existing = getPattern(empId);
    const now = new Date().toISOString();
    if (existing) {
      existing.pattern = state._patternBuf;
      existing.updated_at = now;
    } else {
      state.work_patterns.push({
        id: 'PT-' + empId,
        employee_id: empId,
        pattern: state._patternBuf,
        updated_at: now,
      });
    }
    await saveData(STORAGE_KEYS.WORK_PATTERNS, state.work_patterns);
    state._patternBuf = null;
    state._patternBufEmpId = null;
    state._editingPatternEmpId = null;
    state.screen = 'daily_plan_list';
    render();
  } else if (a === 'delete-pattern') {
    if (!confirm('標準パターンを削除しますか？月別計画は影響を受けません。')) return;
    const empId = state._editingPatternEmpId;
    state.work_patterns = state.work_patterns.filter(p => p.employee_id !== empId);
    await saveData(STORAGE_KEYS.WORK_PATTERNS, state.work_patterns);
    state._patternBuf = null;
    state._editingPatternEmpId = null;
    state.screen = 'daily_plan_list';
    render();
  } else if (a === 'open-daily-plan') {
    state._dailyPlanEmpId = e.currentTarget.dataset.empId;
    state._dailyPlanYM = currentYM();
    state.screen = 'daily_plan_month';
    render();
  } else if (a === 'change-dpm-ym') {
    const val = e.currentTarget.value;
    const [y, m] = val.split('-').map(Number);
    state._dailyPlanYM = { year: y, month: m };
    render();
  } else if (a === 'apply-pattern') {
    const empId = state._dailyPlanEmpId;
    const { year, month } = state._dailyPlanYM;
    const pattern = getPattern(empId);
    if (!pattern) { alert('標準パターンが未登録です'); return; }
    const lastDay = new Date(year, month, 0).getDate();
    const days = {};
    for (let d = 1; d <= lastDay; d++) {
      const dow = new Date(year, month - 1, d).getDay();
      const key = WEEKDAY_KEYS[dow];
      const dayPattern = pattern.pattern[key];
      if (dayPattern && dayPattern.start && dayPattern.end) {
        days[d] = { start: dayPattern.start, end: dayPattern.end };
      } else {
        days[d] = null;  // 休
      }
    }
    const existing = getDailyPlan(empId, year, month);
    const now = new Date().toISOString();
    if (existing) {
      if (!confirm('既存の月別計画にパターンを再適用します。個別修正は上書きされます。よろしいですか？')) return;
      existing.days = days;
      existing.pattern_applied_at = now;
      existing.updated_at = now;
    } else {
      state.daily_plans.push({
        id: `DP-${year}-${month}-${empId}`,
        employee_id: empId, year, month,
        days,
        pattern_applied_at: now,
        updated_at: now,
      });
    }
    await saveData(STORAGE_KEYS.DAILY_PLANS, state.daily_plans);
    render();
  } else if (a === 'clear-all-days') {
    if (!confirm('この月の計画を全てクリアしますか？')) return;
    const empId = state._dailyPlanEmpId;
    const { year, month } = state._dailyPlanYM;
    state.daily_plans = state.daily_plans.filter(dp => 
      !(dp.employee_id === empId && dp.year === year && dp.month === month)
    );
    await saveData(STORAGE_KEYS.DAILY_PLANS, state.daily_plans);
    render();
  } else if (a === 'edit-day') {
    state._editingDay = parseInt(e.currentTarget.dataset.day, 10);
    state.screen = 'day_edit';
    render();
  } else if (a === 'back-to-month-plan') {
    state._editingDay = null;
    state.screen = 'daily_plan_month';
    render();
  } else if (a === 'save-day') {
    const empId = state._dailyPlanEmpId;
    const { year, month } = state._dailyPlanYM;
    const dayNum = state._editingDay;
    const start = document.getElementById('day-start').value;
    const endVal = document.getElementById('day-end').value;
    if (!start || !endVal) { alert('始業・終業の両方を入力してください'); return; }
    if (parseTimeStr(start) >= parseTimeStr(endVal)) { alert('終業は始業より後の時刻にしてください'); return; }
    let dp = getDailyPlan(empId, year, month);
    const now = new Date().toISOString();
    if (!dp) {
      dp = { id: `DP-${year}-${month}-${empId}`, employee_id: empId, year, month, days: {}, updated_at: now };
      state.daily_plans.push(dp);
    }
    dp.days[dayNum] = { start, end: endVal };
    dp.updated_at = now;
    await saveData(STORAGE_KEYS.DAILY_PLANS, state.daily_plans);
    state._editingDay = null;
    state.screen = 'daily_plan_month';
    render();
  } else if (a === 'set-day-off') {
    const empId = state._dailyPlanEmpId;
    const { year, month } = state._dailyPlanYM;
    const dayNum = state._editingDay;
    let dp = getDailyPlan(empId, year, month);
    const now = new Date().toISOString();
    if (!dp) {
      dp = { id: `DP-${year}-${month}-${empId}`, employee_id: empId, year, month, days: {}, updated_at: now };
      state.daily_plans.push(dp);
    }
    dp.days[dayNum] = null;
    dp.updated_at = now;
    await saveData(STORAGE_KEYS.DAILY_PLANS, state.daily_plans);
    state._editingDay = null;
    state.screen = 'daily_plan_month';
    render();
  } else if (a === 'clear-day') {
    const empId = state._dailyPlanEmpId;
    const { year, month } = state._dailyPlanYM;
    const dayNum = state._editingDay;
    let dp = getDailyPlan(empId, year, month);
    if (dp && dp.days[dayNum] !== undefined) {
      delete dp.days[dayNum];
      dp.updated_at = new Date().toISOString();
      await saveData(STORAGE_KEYS.DAILY_PLANS, state.daily_plans);
    }
    state._editingDay = null;
    state.screen = 'daily_plan_month';
    render();
  } else if (a === 'delete-emp') {
    if (confirm(`従業員 ${id} を削除しますか？打刻履歴は保持されます。`)) {
      state.employees = state.employees.filter(emp => emp.id !== id);
      await saveData(STORAGE_KEYS.EMPLOYEES, state.employees);
      render();
    }
  } else if (a === 'add-emp') {
    const newId = document.getElementById('new-emp-id').value.trim();
    const newName = document.getElementById('new-emp-name').value.trim();
    const newEmoji = document.getElementById('new-emp-emoji').value.trim() || '👤';
    const newRate = parseInt(document.getElementById('new-emp-rate').value || '1000', 10);
    if (!newId || !newName) { alert('IDと氏名は必須です'); return; }
    if (state.employees.find(emp => emp.id === newId)) { alert('そのIDは既に存在します'); return; }
    state.employees.push({ id: newId, name: newName, emoji: newEmoji, hourly_rate: newRate, location: currentSite() });
    await saveData(STORAGE_KEYS.EMPLOYEES, state.employees);
    render();
  }
}

// ===========================================
// 時計
// ===========================================

// =========================================================
// 自動更新の案内（2026-08-08 追加）
// サーバー上のHTMLの先頭だけを読みに行き、版数が自分より新しければ画面上部に帯を出す。
// 通信できないときは黙って何もしない。打刻の邪魔は一切しない。
// =========================================================
const APP_VERSION = 'v2.1';
const UPDATE_CHECK_INTERVAL_MS = 5 * 60 * 1000;    // 5分おきに確認
//   先頭4KBだけ読むので回線の負担は小さい。
//   30分だと「上げたのに変わらない」時間が長すぎたため短くした（2026-08-16）。
const UPDATE_FIRST_CHECK_MS = 1500;                // 起動1.5秒後に1回目

// =========================================================
// 【2026-08-16 v2.3】安全なときは自動で新しい版に切り替える
//
// ★なぜ入れたか
//   ホーム画面のショートカット（アイコン）は、ふつうのブラウザとは
//   別の控えを持つ。そのため帯を出しても、現場が押さないと古いままだった。
//   実際に v2.3 を上げたのに v2.1 のままの端末があった（2026-08-16）。
//
// ★切り替えてよい場面だけに限る
//   誰も出勤していない（全員が退勤済み・未出勤）
//   ＋ 誰も作業中でない
//   ＋ ペアの確認待ちがいない
//   ＋ 出来高の入力中でない
//   このときだけ、黙って開き直す。朝いちばんや昼休みに自然に入れ替わる。
//
// ★切り替えてはいけない場面
//   誰かが働いている最中に画面が飛ぶと、打刻の途中や入力中の数字が消える。
//   そのときは帯を出すだけにして、手が空いたときに押してもらう。
// =========================================================
const AUTO_RELOAD_KEY = 'auto_reload_at';   // 直前に自動で開き直した時刻（繰り返し防止）
// ★1分。10分では版を続けて上げたときに切り替わらなかった（2026-08-16）
const AUTO_RELOAD_COOLDOWN_MS = 60 * 1000;

// いま自動で開き直してよいか
function canAutoReload() {
  try {
    // 入力の途中なら触らない
    if (state._registerBuf) return false;
    if (state._declTarget) return false;
    if (state.screen && ['pending_wait', 'pair_select', 'pair_respond', 'mismatch_alert',
                         'work_select', 'day_edit', 'punch_fix'].includes(state.screen)) return false;
    // 誰かがペアの確認待ちなら触らない
    if ((state.pending_sessions || []).length > 0) return false;
    if ((state.active_sessions || []).length > 0) return false;
    // 誰かが出勤中・作業中・休憩中なら触らない
    for (const emp of (state.employees || [])) {
      const st = getEmployeeStatus(emp.id);
      if (!st) continue;
      if (['working', 'waiting', 'matched', 'pending', 'invited', 'break', 'idle'].includes(st.status)) return false;
    }
    // 短い間に何度も開き直さない
    const last = Number(localStorage.getItem(nsKey(AUTO_RELOAD_KEY)) || 0);
    if (last && (Date.now() - last) < AUTO_RELOAD_COOLDOWN_MS) return false;
    return true;
  } catch (e) {
    return false;   // 判断できないときは触らない
  }
}

function cleanAppUrl() {
  return location.href.split('#')[0].split('?')[0];
}

async function checkForUpdate() {
  try {
    // ファイルを直接開いている場合やClaude.ai内では確認しない
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    if (typeof fetch !== 'function') return;
    const url = cleanAppUrl() + '?_check=' + Date.now();
    // 先頭4KBだけ要求する。版数は<head>の先頭にあるので、これで足りる。
    // 全部で550KBほどあるので、毎回まるごと落とすと現場の回線に負担がかかる。
    //
    // ★【2026-08-16 v2.3】Range に頼りきらない
    //   サーバーが範囲指定を断ると 416 が返り、以前は res.ok が false になって
    //   黙って諦めていた。そのため新しい版が出ても帯が出ない端末があった。
    //   範囲指定でうまくいかなければ、ふつうに全部取り直す。
    let text = '';
    try {
      const res = await fetch(url, { cache: 'no-store', headers: { 'Range': 'bytes=0-4095' } });
      if (res.ok || res.status === 206) text = await res.text();
    } catch (e) { /* 範囲指定が通らない環境。下でやり直す */ }
    if (!/name="app-version"/.test(text)) {
      const res2 = await fetch(url, { cache: 'no-store' });
      if (!res2.ok) return;
      text = await res2.text();
    }
    const m = text.match(/name="app-version" content="([^"]+)"/);
    if (!m) return;
    if (m[1] !== APP_VERSION) {
      showUpdateBar(m[1]);
      // 【2026-08-16 v2.3】誰も働いていないときだけ、黙って開き直す
      if (canAutoReload()) {
        try { localStorage.setItem(nsKey(AUTO_RELOAD_KEY), String(Date.now())); } catch (e) {}
        console.log('[ファス] 新しい版 ' + m[1] + ' に自動で切り替えます');
        reloadForUpdate();
      }
    }
  } catch (e) {
    // 圏外・回線不調など。次の確認まで何もしない。
  }
}

// =========================================================
// 【2026-08-16 v2.5】押せばその場で確認する
//
// 定期の確認は5分おきだが、版を上げた直後に確かめたいことがある。
// このボタンを押すと、すぐ見に行き、新しければその場で開き直す。
// ブラウザの Ctrl+Shift+R を毎回押さなくて済むようにするため。
// =========================================================
async function checkForUpdateNow() {
  const btn = document.getElementById('check-update-btn');
  if (btn) { btn.disabled = true; btn.textContent = '確認しています…'; }
  try {
    if (location.protocol !== 'http:' && location.protocol !== 'https:') {
      alert('この開き方では確認できません（インターネット経由で開いてください）'); return;
    }
    const url = cleanAppUrl() + '?_check=' + Date.now();
    let text = '';
    try {
      const res = await fetch(url, { cache: 'no-store', headers: { 'Range': 'bytes=0-4095' } });
      if (res.ok || res.status === 206) text = await res.text();
    } catch (e) {}
    if (!/name="app-version"/.test(text)) {
      const res2 = await fetch(url, { cache: 'no-store' });
      if (!res2.ok) { alert('サーバーに問い合わせできませんでした（' + res2.status + '）'); return; }
      text = await res2.text();
    }
    const m = text.match(/name="app-version" content="([^"]+)"/);
    if (!m) { alert('版数を読み取れませんでした'); return; }
    if (m[1] === APP_VERSION) {
      alert('最新です（' + APP_VERSION + '）');
      return;
    }
    if (confirm('新しい版 ' + m[1] + ' があります。\nいま開き直しますか？\n\n（打刻や入力の途中でなければ安全です）')) {
      reloadForUpdate();
    } else {
      showUpdateBar(m[1]);
    }
  } catch (e) {
    alert('確認できませんでした：' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🔄 更新を確認'; }
  }
}

function showUpdateBar(newVer) {
  const bar = document.getElementById('update-bar');
  if (!bar) return;
  const verEl = document.getElementById('update-bar-ver');
  if (verEl && newVer) {
    verEl.textContent = newVer;
    const wrap = document.getElementById('update-bar-ver-wrap');
    if (wrap) wrap.style.display = '';
  }
  bar.style.display = 'block';
}

// ブラウザが手元の控えを見せないよう、URLに時刻を付けて開き直す。
// ブックマークそのものは変わらないので、次に開くときは元のURLに戻る。
function reloadForUpdate() {
  location.replace(cleanAppUrl() + '?v=' + Date.now());
}

function updateClock() {
  const d = new Date();
  const wd = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
  const str = `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} (${wd}) ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const clockEl = document.getElementById('clock');
  if (clockEl) clockEl.textContent = str;
}

// ===========================================
// 初期化
// ===========================================

async function bootstrap() {
  // URLハッシュ #reset で味采の保存分だけリセット（他アプリには触れない）
  if (location.hash === '#reset') {
    clearAppData();
    location.hash = '';
    location.reload();
    return;
  }
  // 新年度スタートの一度きりの初期化。既定値を入れる前に実行する。
  runNewYearResetOnce();

  // 【2026-08-12 追加】名札を付ける前のデータが残っていないか確認する。
  // 初期値を作ってしまうと「消えた」ように見えるので、作る前に聞く。
  const lg = shouldAskLegacy();
  if (lg) {
    renderLegacyAsk(lg);
    // ★【2026-08-24 修正】ここで attachHandlers() を呼んでいなかったため、
    //   「取り込む」「このまま新しく始める」を押しても何も起きなかった。
    //   受け口（legacy-import / legacy-skip）は用意してあったが、つながっていなかった。
    //   v2.0 でこの画面を作ったときからの不具合。本番で1週間気づかなかった。
    attachHandlers();
    return;
  }

  try {
    await initializeData();
    state.employees = await loadData(STORAGE_KEYS.EMPLOYEES, []);
    state.work_items = await loadData(STORAGE_KEYS.WORK_ITEMS, []);
    state.punches = await loadData(STORAGE_KEYS.PUNCHES, []);
    state.pending_sessions = await loadData(STORAGE_KEYS.PENDING_SESSIONS, []);
    state.active_sessions = await loadData(STORAGE_KEYS.ACTIVE_SESSIONS, []);
    state.work_plans = await loadData(STORAGE_KEYS.WORK_PLANS, []);
    state.work_patterns = await loadData(STORAGE_KEYS.WORK_PATTERNS, []);
    state.daily_plans = await loadData(STORAGE_KEYS.DAILY_PLANS, []);
    // v0.6 マスタ
    state.work_tasks = await loadData(STORAGE_KEYS.WORK_TASKS, []);
    state.work_products = await loadData(STORAGE_KEYS.WORK_PRODUCTS, []);
    state.work_prices = await loadData(STORAGE_KEYS.WORK_PRICES, []);
    state.work_materials = await loadData(STORAGE_KEYS.WORK_MATERIALS, []);
    state.work_records = await loadData(STORAGE_KEYS.WORK_RECORDS, []);
    state.app_settings = await loadData(STORAGE_KEYS.APP_SETTINGS, DEFAULT_APP_SETTINGS);
    // v0.7 勤務計画変更
    state.change_requests = await loadData(STORAGE_KEYS.CHANGE_REQUESTS, []);
    // 【2026-08-16 v2.1】新勤怠
    state.work_adjustments = await loadData(STORAGE_KEYS.WORK_ADJUSTMENTS, []);
    state.leaves = await loadData(STORAGE_KEYS.LEAVES, []);
    state.leave_grants = await loadData(STORAGE_KEYS.LEAVE_GRANTS, []);
    state.month_closes = await loadData(STORAGE_KEYS.MONTH_CLOSES, []);
    state.change_history = await loadData(STORAGE_KEYS.CHANGE_HISTORY, []);
    state.employee_notifications = await loadData(STORAGE_KEYS.EMPLOYEE_NOTIFICATIONS, []);
    state.labor_plan = await loadData(STORAGE_KEYS.LABOR_PLAN, []);
    state.punch_edits = await loadData(STORAGE_KEYS.PUNCH_EDITS, []);
    state.ajisai_prices = await loadData(STORAGE_KEYS.AJISAI_PRICES, []);
    // 味采版：拠点マスタと、この端末の拠点
    state.sites = await loadData(STORAGE_KEYS.SITES, []);
    if (!Array.isArray(state.sites) || state.sites.length === 0) {
      state.sites = JSON.parse(JSON.stringify(DEFAULT_SITES));
      await saveData(STORAGE_KEYS.SITES, state.sites);
    }
    state.device_site = await loadData(STORAGE_KEYS.DEVICE_SITE, null);
    state.admin_pin = await loadData(STORAGE_KEYS.ADMIN_PIN, DEFAULT_ADMIN_PIN);
    // データ整合性チェック：マスタが空または不正なら DEFAULT で再初期化
    if (!Array.isArray(state.employees)) {
      state.employees = [];
      await saveData(STORAGE_KEYS.EMPLOYEES, state.employees);
    }
    if (!Array.isArray(state.work_tasks) || state.work_tasks.length === 0) {
      state.work_tasks = JSON.parse(JSON.stringify(DEFAULT_WORK_TASKS));
      await saveData(STORAGE_KEYS.WORK_TASKS, state.work_tasks);
    }
    if (!Array.isArray(state.work_products) || state.work_products.length === 0) {
      state.work_products = JSON.parse(JSON.stringify(DEFAULT_WORK_PRODUCTS));
      await saveData(STORAGE_KEYS.WORK_PRODUCTS, state.work_products);
    }
    // ─────────────────────────────────────────────────────────
    // 品目の配布（2026-08-05／11品目）
    // 本部がHTMLを差し替えると、各拠点の端末が次に開いたときここが一度だけ走る。
    // 足りない品目とその単価・包材費を足すだけで、既存の品目名・単価・打刻・作業記録には触れない。
    // 同じ名前の品目がすでにあれば何もしない。IDが埋まっていれば空き番号を採る。
    // ─────────────────────────────────────────────────────────
    const seedVer = await loadData(STORAGE_KEYS.PRODUCT_SEED, 1);
    if (seedVer < PRODUCT_SEED_VERSION) {
      const added = [];
      const usedIds = new Set(state.work_products.map(p => p.id));
      const usedNames = new Set(state.work_products.map(p => p.name));
      const taskIds = new Set(state.work_tasks.map(t => t.id));
      for (const dp of DEFAULT_WORK_PRODUCTS) {
        if (!PRODUCT_SEED_V2_NAMES.includes(dp.name)) continue;  // 今回の11件だけを対象にする
        if (usedNames.has(dp.name)) continue;                    // すでにあるものは触らない
        let id = dp.id;
        if (usedIds.has(id)) {
          let max = 0;
          for (const u of usedIds) { const n = parseInt(String(u).replace(/^P/, ''), 10); if (n > max) max = n; }
          id = 'P' + String(max + 1).padStart(2, '0');
        }
        state.work_products.push({ id, name: dp.name, emoji: dp.emoji });
        usedIds.add(id); usedNames.add(dp.name);
        added.push({ newId: id, seedId: dp.id, name: dp.name });
      }
      if (added.length > 0) {
        for (const a of added) {
          // 単価・包材費は、その品目に1件も入っていないときだけ足す。すでに消えている作業の分は入れない。
          if (!state.work_prices.some(x => x.product_id === a.newId)) {
            for (const sp of DEFAULT_WORK_PRICES) {
              if (sp.product_id === a.seedId && taskIds.has(sp.task_id)) {
                state.work_prices.push({ ...sp, product_id: a.newId });
              }
            }
          }
          if (!state.work_materials.some(x => x.product_id === a.newId)) {
            for (const sm of DEFAULT_WORK_MATERIALS) {
              if (sm.product_id === a.seedId && taskIds.has(sm.task_id)) {
                state.work_materials.push({ ...sm, product_id: a.newId });
              }
            }
          }
        }
        await saveData(STORAGE_KEYS.WORK_PRODUCTS, state.work_products);
        await saveData(STORAGE_KEYS.WORK_PRICES, state.work_prices);
        await saveData(STORAGE_KEYS.WORK_MATERIALS, state.work_materials);
        state._seedNotice = added.map(a => a.name);
      }
      await saveData(STORAGE_KEYS.PRODUCT_SEED, PRODUCT_SEED_VERSION);
    }
    // 【2026-08-08 追加】旧版で「作業終了しても作業中のまま」になった端末を、
    // 開いた時点で自動的に直す。閉じ損ねたペアのセッションをここで閉じる。
    await checkSessionEnding();
    render();
  } catch (e) {
    console.error('Bootstrap error:', e);
    // エラー画面を表示してリセット案内
    document.body.innerHTML = `
      <div style="padding:40px; max-width:600px; margin:0 auto; font-family:sans-serif;">
        <h2 style="color:#c62828;">⚠️ データ読み込みエラー</h2>
        <p>保存データに問題があります。エラー内容：</p>
        <pre style="background:#ffebee; padding:14px; border-radius:6px; overflow:auto;">${(e && e.message) || e}</pre>
        <p>下のボタンで全データをリセットして再起動できます。<br>
        <strong>※ 従業員マスタや単価マスタなど全てのデータが初期値に戻ります。</strong></p>
        <button onclick="clearAppData(); location.hash=''; location.reload();" 
          style="padding:14px 28px; background:#c62828; color:white; border:none; border-radius:8px; font-size:1.1rem; cursor:pointer; font-weight:bold;">
          🔄 リセットして再起動
        </button>
      </div>
    `;
    return;
  }
  updateClock();
  setInterval(updateClock, 1000);
  // 自動更新の確認：起動30秒後に1回、そのあとは30分おき
  setTimeout(checkForUpdate, UPDATE_FIRST_CHECK_MS);
  setInterval(checkForUpdate, UPDATE_CHECK_INTERVAL_MS);
  // pending タイムアウト＆ペンディング画面の自動更新
  setInterval(async () => {
    await checkTimeouts();
    await checkSessionEnding();  // 【2026-08-08 追加】閉じ損ねたセッションを毎秒拾って閉じる
    // pending_wait画面の場合、毎秒タイマー更新
    if (state.screen === 'pending_wait') render();
  }, 1000);
  // 全体定期更新
  setInterval(() => {
    if (state.screen === 'personal' || state.screen === 'admin' || state.screen === 'home') {
      render();
    }
  }, 60000);
}

bootstrap();
</script>
