// 月間 作業×単価診断
function renderMonthlyTaskDiagnosis(ym) {
  // 該当月の work_records を取得
  const lastDay = new Date(ym.year, ym.month, 0).getDate();
  const startStr = `${ym.year}-${String(ym.month).padStart(2,'0')}-01`;
  const endStr = `${ym.year}-${String(ym.month).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  const records = state.work_records.filter(r => 
    r.work_started_at && localDateStr(r.work_started_at) >= startStr && localDateStr(r.work_started_at) <= endStr
  );
  if (records.length === 0) {
    return `<div class="empty-message" style="padding:30px;">この月の作業記録はありません</div>`;
  }
  // 作業×品目別に集計
  const byKey = {};
  for (const r of records) {
    const key = `${r.main_task_id}__${r.main_product_id}__${r.main_spec_id || ''}`;
    if (!byKey[key]) {
      byKey[key] = {
        task_id: r.main_task_id, product_id: r.main_product_id,
        spec_id: r.main_spec_id || '',
        unit: r.unit, unit_price: r.unit_price,
        quantity: 0, count: 0, totalMinutes: 0, totalLaborCost: 0,
        emp_ids: new Set(),
      };
    }
    const cost = calcRecordCost(r);
    byKey[key].quantity += r.quantity || 0;
    byKey[key].count += 1;
    byKey[key].totalMinutes += cost.minutes;
    byKey[key].totalLaborCost += cost.laborCost;
    byKey[key].emp_ids.add(r.employee_id);
  }
  const aggs = Object.values(byKey).map(a => {
    const revenue = (a.unit_price || 0) * a.quantity;
    const profit = revenue - a.totalLaborCost;
    const breakEvenPrice = a.quantity > 0 ? Math.ceil(a.totalLaborCost / a.quantity) : 0;
    const perHour = a.totalMinutes > 0 ? Math.round(a.quantity / (a.totalMinutes / 60) * 10) / 10 : 0;
    const profitRate = revenue > 0 ? (profit / revenue * 100) : (a.totalLaborCost > 0 ? -100 : 0);
    let verdict, verdictBg;
    if (a.unit_price === 0) { verdict = '⚠️ 単価未設定'; verdictBg = '#fff3e0'; }
    else if (profitRate >= 30) { verdict = '🚀 高利益'; verdictBg = '#c8e6c9'; }
    else if (profitRate >= 10) { verdict = '👍 良好'; verdictBg = '#e8f5e9'; }
    else if (profitRate >= 0) { verdict = '➖ トントン'; verdictBg = '#fffde7'; }
    else if (profitRate >= -30) { verdict = '⚠️ 要改善'; verdictBg = '#fff3e0'; }
    else { verdict = '🔴 赤字'; verdictBg = '#ffebee'; }
    return { ...a, revenue, emp_count: a.emp_ids.size, profit, profitRate, breakEvenPrice, perHour, verdict, verdictBg };
  }).sort((a, b) => b.profit - a.profit);
  
  // 月間合計
  const totalRevenue = aggs.reduce((s, a) => s + a.revenue, 0);
  const totalLaborCost = aggs.reduce((s, a) => s + a.totalLaborCost, 0);
  const totalProfit = totalRevenue - totalLaborCost;
  const profitColor = totalProfit >= 0 ? 'var(--green)' : 'var(--red)';
  const profitSign = totalProfit >= 0 ? '+' : '';
  
  let html = `<div style="margin-bottom:12px; padding:10px 14px; background:#e8f4ee; border-radius:8px; font-size:0.9rem;">
    🌳 ${ym.year}年${ym.month}月の作業×品目別 単価診断（${aggs.length}組合せ）<br>
    <span style="font-size:0.85rem; color:#555;">どの作業の単価が儲かっていて、どこが赤字か。月間データなのでより信頼性の高い判断ができます。</span>
  </div>`;
  html += `<table class="shift-day-table" style="font-size:0.88rem;">
    <thead><tr>
      <th>作業</th><th>品目</th>
      <th style="text-align:right;">作業者</th>
      <th style="text-align:right;">数量</th>
      <th style="text-align:right;">時間</th>
      <th style="text-align:right;">平均速度</th>
      <th style="text-align:right;">現在単価</th>
      <th style="text-align:right; background:#fff3e0;">人件費</th>
      <th style="text-align:right; background:#e8f4ee;">売上</th>
      <th style="text-align:right; background:#e8eaf6;">差益</th>
      <th style="text-align:center; background:#fff8e1;">損益分岐<br>単価</th>
      <th style="text-align:center;">判定</th>
    </tr></thead><tbody>`;
  for (const a of aggs) {
    const task = state.work_tasks.find(t => t.id === a.task_id);
    const product = state.work_products.find(p => p.id === a.product_id);
    const pColor = a.profit >= 0 ? 'var(--green)' : 'var(--red)';
    const pSign = a.profit >= 0 ? '+' : '';
    const priceGap = a.unit_price > 0 ? a.unit_price - a.breakEvenPrice : 0;
    const priceGapLabel = a.unit_price > 0 
      ? (priceGap >= 0 ? `<span style="color:var(--green); font-size:0.75rem;">＋${priceGap}円</span>` : `<span style="color:var(--red); font-size:0.75rem;">${priceGap}円</span>`)
      : '';
    html += `<tr style="background:${a.verdictBg};">
      <td><strong>${task ? `${task.icon} ${task.name}` : a.task_id}</strong></td>
      <td>${product ? `${product.emoji} ${product.name}` : a.product_id}</td>
      <td style="text-align:right;">${a.emp_count}名</td>
      <td style="text-align:right; font-weight:bold;">${a.quantity.toLocaleString()}${a.unit||''}</td>
      <td style="text-align:right; color:#666;">${formatHMin(a.totalMinutes)}</td>
      <td style="text-align:right; color:#444;">${a.perHour}${a.unit||''}/h</td>
      <td style="text-align:right;">${a.unit_price > 0 ? a.unit_price.toLocaleString()+'円' : '<span style="color:var(--orange);">未設定</span>'}</td>
      <td style="text-align:right; font-weight:bold; color:var(--orange);">${a.totalLaborCost.toLocaleString()}円</td>
      <td style="text-align:right; font-weight:bold; color:var(--green);">${a.revenue.toLocaleString()}円</td>
      <td style="text-align:right; font-weight:bold; color:${pColor};">${pSign}${a.profit.toLocaleString()}円<br><span style="font-size:0.72rem; font-weight:normal;">(${a.profitRate.toFixed(0)}%)</span></td>
      <td style="text-align:center;"><strong>${a.breakEvenPrice}円</strong>${priceGapLabel ? '<br>'+priceGapLabel : ''}</td>
      <td style="text-align:center; font-weight:bold; font-size:0.85rem;">${a.verdict}</td>
    </tr>`;
  }
  html += `</tbody>
  <tfoot><tr style="background:#fff8e0; font-weight:bold;">
    <td colspan="7" style="text-align:right;">月間合計</td>
    <td style="text-align:right; color:var(--orange);">${totalLaborCost.toLocaleString()}円</td>
    <td style="text-align:right; color:var(--green);">${totalRevenue.toLocaleString()}円</td>
    <td style="text-align:right; color:${profitColor};">${profitSign}${totalProfit.toLocaleString()}円</td>
    <td colspan="2"></td>
  </tr></tfoot></table>
  
  <div style="margin-top:14px; padding:12px 14px; background:#f5f5f5; border-radius:8px; font-size:0.88rem;">
    <div style="font-weight:bold; margin-bottom:6px;">💡 月度末の改善判断</div>
    <div style="line-height:1.7;">
      🔴 <strong>赤字の作業</strong>：単価交渉・作業見直し・機械化のターゲット<br>
      ⚠️ <strong>要改善の作業</strong>：来月までに改善策を検討<br>
      🚀 <strong>高利益の作業</strong>：受注量を増やせれば全体の利益が大きくなる
    </div>
  </div>`;
  return html;
}

// 月間 人を比較
function renderMonthlyCompare(ym) {
  const lastDay = new Date(ym.year, ym.month, 0).getDate();
  const startStr = `${ym.year}-${String(ym.month).padStart(2,'0')}-01`;
  const endStr = `${ym.year}-${String(ym.month).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  const records = state.work_records.filter(r => 
    r.work_started_at && localDateStr(r.work_started_at) >= startStr && localDateStr(r.work_started_at) <= endStr
  );
  if (records.length === 0) {
    return `<div class="empty-message" style="padding:30px;">この月の作業記録はありません</div>`;
  }
  // 作業×品目ごとに人別集計
  const byKey = {};
  for (const r of records) {
    const key = `${r.main_task_id}__${r.main_product_id}__${r.main_spec_id || ''}`;
    if (!byKey[key]) byKey[key] = [];
    byKey[key].push(r);
  }
  const compareGroups = [];
  for (const key of Object.keys(byKey)) {
    const empIds = new Set(byKey[key].map(r => r.employee_id));
    if (empIds.size >= 2) {
      compareGroups.push({ key, records: byKey[key] });
    }
  }
  
  if (compareGroups.length === 0) {
    return `<div class="empty-message" style="padding:30px;">
      🤝 この月は同じ作業を <strong>2人以上</strong> が行った組合せがありません
    </div>`;
  }
  
  let html = `<div style="margin-bottom:12px; padding:10px 14px; background:#e8f4ee; border-radius:8px; font-size:0.9rem;">
    🏆 ${ym.year}年${ym.month}月は <strong>${compareGroups.length}組</strong> の作業で複数人が実施。月間の生産速度を比較します。<br>
    <span style="font-size:0.85rem; color:#555;">月間データなのでサンプル数が多く、客観的な評価ができます。</span>
  </div>`;
  
  for (const grp of compareGroups) {
    const sampleRec = grp.records[0];
    const task = state.work_tasks.find(t => t.id === sampleRec.main_task_id);
    const product = state.work_products.find(p => p.id === sampleRec.main_product_id);
    const byEmp = {};
    for (const r of grp.records) {
      if (!byEmp[r.employee_id]) byEmp[r.employee_id] = { quantity: 0, totalMinutes: 0, totalLaborCost: 0, count: 0, dayCount: new Set() };
      const cost = calcRecordCost(r);
      byEmp[r.employee_id].quantity += r.quantity || 0;
      byEmp[r.employee_id].totalMinutes += cost.minutes;
      byEmp[r.employee_id].totalLaborCost += cost.laborCost;
      byEmp[r.employee_id].count += 1;
      byEmp[r.employee_id].dayCount.add(r.work_started_at.split('T')[0]);
    }
    const empStats = Object.keys(byEmp).map(empId => {
      const b = byEmp[empId];
      const perHour = b.totalMinutes > 0 ? Math.round(b.quantity / (b.totalMinutes / 60) * 10) / 10 : 0;
      return { empId, ...b, perHour, dayCount: b.dayCount.size };
    }).sort((a, b) => b.perHour - a.perHour);
    const maxSpeed = empStats[0].perHour;
    const minSpeed = empStats[empStats.length - 1].perHour;
    const avgSpeed = empStats.reduce((s, x) => s + x.perHour, 0) / empStats.length;
    
    html += `
      <div style="background:white; border:1px solid #e0e0e0; border-radius:8px; padding:14px; margin-bottom:12px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid #f0f0f0; flex-wrap:wrap;">
          <div>
            <div style="font-size:1.1rem; font-weight:bold;">${task ? task.icon : ''} ${task ? task.name : ''} × ${product ? product.emoji : ''} ${product ? product.name : ''}</div>
            <div style="font-size:0.85rem; color:#666;">${empStats.length}名 ／ 単価 ${sampleRec.unit_price || '未設定'}円/${sampleRec.unit||''} ／ 月間 ${grp.records.length}件</div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:0.75rem; color:#888;">速度差</div>
            <div style="font-size:1.05rem; font-weight:bold; color:${maxSpeed > minSpeed * 1.5 ? 'var(--red)' : '#444'};">
              ${(maxSpeed - minSpeed).toFixed(1)} ${sampleRec.unit||''}/h
              <span style="font-size:0.85rem; color:#888;">（平均 ${avgSpeed.toFixed(1)}）</span>
            </div>
          </div>
        </div>
        <table style="width:100%; font-size:0.9rem;">
          <thead><tr style="background:#fafafa;">
            <th style="padding:6px 8px; text-align:left;">順位</th>
            <th style="padding:6px 8px; text-align:left;">名前</th>
            <th style="padding:6px 8px; text-align:right;">実施日数</th>
            <th style="padding:6px 8px; text-align:right;">数量計</th>
            <th style="padding:6px 8px; text-align:right;">時間計</th>
            <th style="padding:6px 8px; text-align:right;">平均速度</th>
            <th style="padding:6px 8px; text-align:right;">平均比</th>
            <th style="padding:6px 8px; text-align:center;">評価</th>
          </tr></thead><tbody>`;
    empStats.forEach((es, idx) => {
      const emp = state.employees.find(e => e.id === es.empId);
      const ratio = avgSpeed > 0 ? (es.perHour / avgSpeed * 100) : 100;
      let badge = '', badgeColor = '';
      if (idx === 0 && empStats.length >= 2) { badge = '🏆 最速'; badgeColor = '#c8e6c9'; }
      else if (idx === empStats.length - 1 && empStats.length >= 2) { badge = '🐌 最遅'; badgeColor = '#ffebee'; }
      else { badge = '─'; badgeColor = '#fafafa'; }
      html += `<tr>
        <td style="padding:6px 8px; font-weight:bold;">${idx + 1}位</td>
        <td style="padding:6px 8px;">${emp ? `${emp.emoji} ${emp.name}` : es.empId}</td>
        <td style="padding:6px 8px; text-align:right;">${es.dayCount}日</td>
        <td style="padding:6px 8px; text-align:right; font-weight:bold;">${es.quantity.toLocaleString()}${sampleRec.unit||''}</td>
        <td style="padding:6px 8px; text-align:right; color:#666;">${formatHMin(es.totalMinutes)}</td>
        <td style="padding:6px 8px; text-align:right; font-weight:bold;">${es.perHour}${sampleRec.unit||''}/h</td>
        <td style="padding:6px 8px; text-align:right; color:${ratio >= 110 ? 'var(--green)' : ratio >= 90 ? '#444' : 'var(--red)'};">${ratio.toFixed(0)}%</td>
        <td style="padding:6px 8px; text-align:center; background:${badgeColor}; border-radius:4px; font-weight:bold; font-size:0.85rem;">${badge}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
    if (maxSpeed > minSpeed * 1.3) {
      html += `<div style="margin-top:10px; padding:8px 12px; background:#fff8e1; border-radius:6px; font-size:0.85rem;">
        💡 最速と最遅で <strong>${((maxSpeed/minSpeed - 1) * 100).toFixed(0)}%</strong> の差があります。
        速い人のやり方を共有・標準化することで全体の生産性が向上できる可能性があります。
      </div>`;
    }
    html += `</div>`;
  }
  
  html += `<div style="margin-top:14px; padding:12px 14px; background:#f5f5f5; border-radius:8px; font-size:0.88rem;">
    <div style="font-weight:bold; margin-bottom:6px;">💡 月間データの活かし方</div>
    <div style="line-height:1.7;">
      🏆 <strong>最速の人</strong>：何が違うのかを共有・標準化のターゲット<br>
      🐌 <strong>最遅の人</strong>：指導・配置転換・別作業への適性検討<br>
      📊 <strong>平均比</strong>：個人の評価・昇給判断の客観指標
    </div>
  </div>`;
  return html;
}



function renderWorkRegister() {
  const emp = state.employees.find(e => e.id === state.current_employee_id);
  if (!emp) { state.screen = 'home'; return ''; }
  
  // 直近のWORK_STARTから経過時間を計算
  const today = todayStr();
  const todayPunches = state.punches
    .filter(p => p.employee_id === emp.id && isOnDate(p.timestamp, today))
    .sort((a, b) => String(a.timestamp || '').localeCompare(String(b.timestamp || '')));
  // 最後のWORK_STARTを探す
  let workStartPunch = null;
  for (let i = todayPunches.length - 1; i >= 0; i--) {
    if (todayPunches[i].type === 'WORK_START') {
      workStartPunch = todayPunches[i];
      break;
    }
    if (['WORK_END', 'BREAK', 'END'].includes(todayPunches[i].type)) break;
  }
  if (!workStartPunch) {
    return `<div class="card"><h2>⚠️ 作業中ではありません</h2>
      <div class="empty-message">作業開始の打刻がないため登録できません。</div>
      <div style="text-align:center; margin-top:14px;">
        <button class="nav-btn" data-action="back-personal">← 個人画面へ戻る</button>
      </div></div>`;
  }
  const startTime = new Date(workStartPunch.timestamp);
  const now = new Date();
  const elapsedMin = Math.floor((now - startTime) / 60000);
  
  // 登録画面に入った時刻を記録（登録時間計測用）
  if (!state._registerEnteredAt) {
    state._registerEnteredAt = now.toISOString();
  }
  
  // バッファ初期化
  if (!state._registerBuf) {
    state._registerBuf = {
      main_task_id: '',
      main_product_id: '',
      main_spec_id: '',
      quantity: '',
      sub_tasks: {},  // { 'TG01': 10, 'TG05': 15 } 形式
    };
  }
  const buf = state._registerBuf;
  
  const parentTasks = state.work_tasks.filter(t => t.type === 'parent');
  const globalTasks = state.work_tasks.filter(t => t.type === 'global');
  const products = state.work_products;
  
  // 選択された作業の単位
  const selectedTask = buf.main_task_id ? state.work_tasks.find(t => t.id === buf.main_task_id) : null;
  const unit = selectedTask ? selectedTask.unit : '';
  
  // 単価が設定されているか
  let priceInfo = '';
  if (buf.main_task_id && buf.main_product_id) {
    const price = findWorkPrice(buf.main_task_id, buf.main_product_id, buf.main_spec_id);
    if (price) {
      priceInfo = `<span style="color:var(--green); font-weight:bold;">単価 ${price.unit_price}円/${price.unit}</span>`;
      if (buf.quantity) {
        const total = price.unit_price * Number(buf.quantity);
        priceInfo += ` ／ 売上 <strong style="color:var(--green); font-size:1.1rem;">${total.toLocaleString()}円</strong>`;
      }
    } else {
      priceInfo = '<span style="color:var(--orange);">⚠️ 単価未設定（後で集計に反映）</span>';
    }
  }
  
  const faceHtml = emp.photo 
    ? `<img src="${emp.photo}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;" alt=""/>`
    : `<span style="font-size:2rem;">${emp.emoji}</span>`;
  
  let html = `
    <div class="card">
      <h2>📝 作業の登録</h2>
      <div style="background:var(--green-bg); padding:12px 14px; border-radius:8px; margin-bottom:14px; display:flex; gap:14px; align-items:center;">
        ${faceHtml}
        <div>
          <div style="font-size:1.05rem; font-weight:bold;">${emp.name}さん</div>
          <div style="font-size:0.85rem; color:#555;">
            作業開始 ${formatTime(workStartPunch.timestamp)} ／ 経過 <strong>${formatMinutes(elapsedMin)}</strong>
          </div>
        </div>
      </div>
      
      <div class="emp-form">
        <div class="form-row">
          <label class="form-label">🌳 主作業（親）</label>
          <select id="reg-task" data-action="register-task-change">
            <option value="">-- 選択してください --</option>
  `;
  // 手作業をグループ化
  html += `<optgroup label="🟨 手作業">`;
  for (const t of parentTasks.filter(t => t.category === '手作業')) {
    const sel = (t.id === buf.main_task_id) ? ' selected' : '';
    html += `<option value="${t.id}"${sel}>${t.icon} ${t.name}（${t.unit}単位）</option>`;
  }
  html += `</optgroup><optgroup label="🤖 マシン作業">`;
  for (const t of parentTasks.filter(t => t.category === 'マシン作業')) {
    const sel = (t.id === buf.main_task_id) ? ' selected' : '';
    const status = t.machine_status === '将来' ? ' [将来]' : '';
    html += `<option value="${t.id}"${sel}>${t.icon} ${t.name}（${t.unit}単位）${status}</option>`;
  }
  html += `</optgroup></select>
        </div>
        <div class="form-row">
          <label class="form-label">🥬 品目</label>
          <select id="reg-product" data-action="register-product-change">
            <option value="">-- 選択してください --</option>
  `;
  for (const p of products) {
    const sel = (p.id === buf.main_product_id) ? ' selected' : '';
    const nspec = Array.isArray(p.specs) ? p.specs.length : 0;
    html += `<option value="${p.id}"${sel}>${p.emoji} ${p.name}${nspec ? `（${nspec}規格）` : ''}</option>`;
  }
  html += `</select>
        </div>
  `;
  // 【2026-08-16 v2.3】規格。規格を持つ品目を選んだときだけ出す
  const regSpecs = specsOf(buf.main_product_id);
  if (regSpecs.length > 0) {
    html += `
        <div class="form-row">
          <label class="form-label">📏 規格</label>
          <select id="reg-spec" data-action="register-spec-change">
            <option value="">-- 選択してください --</option>`;
    for (const sp of regSpecs) {
      const sel = (sp.id === buf.main_spec_id) ? ' selected' : '';
      html += `<option value="${sp.id}"${sel}>${sp.label}（目安 ${sp.sec}秒）</option>`;
    }
    html += `</select>
          <div class="form-hint">規格でかかる時間が変わるため、単価も変わります</div>
        </div>`;
  }
  html += `
        <div class="form-row">
          <label class="form-label">📊 数量${unit ? `（${unit}）` : ''}</label>
          <input type="number" id="reg-quantity" value="${buf.quantity}" placeholder="例：80" min="0" step="1" data-action="register-quantity-change" />
          ${priceInfo ? `<div class="form-hint">${priceInfo}</div>` : ''}
        </div>
        
        <div class="form-row">
          <label class="form-label">🌍 全体寄与作業（任意・含まれていれば選択）</label>
          <div class="form-hint" style="margin-bottom:8px;">この作業時間に含まれていた間接作業を選んで分数を入力してください</div>
          <div style="display:flex; flex-direction:column; gap:6px;">
  `;
  for (const g of globalTasks) {
    const val = buf.sub_tasks[g.id];
    const isChecked = (val !== undefined);
    html += `<div style="display:flex; align-items:center; gap:10px; padding:6px 10px; background:${isChecked ? '#e8f4ee' : '#fafafa'}; border-radius:6px; border:1px solid ${isChecked ? 'var(--green-light)' : '#e0e0e0'};">
      <input type="checkbox" id="reg-sub-${g.id}" data-action="register-sub-toggle" data-task-id="${g.id}" ${isChecked ? 'checked' : ''} style="width:18px; height:18px;" />
      <label for="reg-sub-${g.id}" style="flex:1; cursor:pointer; margin:0;">${g.icon} ${g.name}</label>
      ${isChecked 
        ? `<input type="number" data-action="register-sub-duration" data-task-id="${g.id}" value="${val}" min="0" step="1" style="width:70px;" placeholder="分" /> 分`
        : '<span style="color:#bbb; font-size:0.85rem;">未選択</span>'}
    </div>`;
  }
  html += `</div>
        </div>
        
        <div class="form-actions" style="margin-top:18px;">
          <button class="primary-btn" data-action="save-work-register" ${!buf.main_task_id || !buf.main_product_id || !buf.quantity || (regSpecs.length > 0 && !buf.main_spec_id) ? 'disabled' : ''}>
            ✅ 登録して終了
          </button>
          <button class="nav-btn" data-action="cancel-work-register">作業に戻る</button>
        </div>
        <div class="form-hint">
          💡 登録に要した時間も自動計測されています（操作の習熟度指標）<br>
          💡 必須：主作業・品目・数量
        </div>
      </div>
    </div>
  `;
  return html;
}



const TASK_TYPE_LABELS = {
  parent: { label: '親作業', icon: '🌳', desc: '出来高×単価で売上発生' },
  global: { label: '全体寄与', icon: '🌍', desc: '当日差益から配賦' },
};

const TASK_CATEGORY_COLORS = {
  '手作業':    { bg: '#fff9c4', border: '#d9b347' },
  'マシン作業': { bg: '#e3f2fd', border: '#2b7bbe' },
  '全体寄与':   { bg: '#e8f4ee', border: '#1d9e75' },
};

function renderTasksMaster() {
  if (!state._tasksFilter) state._tasksFilter = 'all';
  const filter = state._tasksFilter;
  let filteredTasks = state.work_tasks;
  if (filter === 'hand') filteredTasks = state.work_tasks.filter(t => t.category === '手作業');
  else if (filter === 'machine') filteredTasks = state.work_tasks.filter(t => t.category === 'マシン作業');
  else if (filter === 'global') filteredTasks = state.work_tasks.filter(t => t.category === '全体寄与');
  
  // 統計
  const stats = {
    total: state.work_tasks.length,
    hand: state.work_tasks.filter(t => t.category === '手作業').length,
    machine: state.work_tasks.filter(t => t.category === 'マシン作業').length,
    global: state.work_tasks.filter(t => t.category === '全体寄与').length,
    products: state.work_products.length,
    prices: state.work_prices.length,
  };
  
  let html = `
    <div class="nav-row">
      <button class="nav-btn" data-action="back-admin">← 管理画面へ戻る</button>
    </div>
    <div class="card admin-section">
      <h2>⚙️ 作業マスタ</h2>
      <div class="form-hint" style="margin-bottom:14px;">
        💡 親作業（出来高あり）と全体寄与作業（当日差益から配賦）を管理します。
        単価は <button class="nav-btn" data-action="go-prices-master" style="padding:4px 10px; font-size:0.85rem; background:#fff3e0; color:var(--orange); border-color:var(--orange);">💰 単価マスタ</button>、
        包材費は <button class="nav-btn" data-action="go-materials-master" style="padding:4px 10px; font-size:0.85rem; background:#e3f2fd; color:var(--blue); border-color:var(--blue);">📦 包材費マスタ</button>
        で設定。
      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-bottom:14px;">
        <div style="background:#fff9c4; padding:10px; border-radius:6px;">
          <div style="font-size:0.8rem; color:#888;">🟨 手作業</div>
          <div style="font-size:1.3rem; font-weight:bold;">${stats.hand}個</div>
        </div>
        <div style="background:#e3f2fd; padding:10px; border-radius:6px;">
          <div style="font-size:0.8rem; color:#888;">🤖 マシン作業</div>
          <div style="font-size:1.3rem; font-weight:bold;">${stats.machine}個</div>
        </div>
        <div style="background:#e8f4ee; padding:10px; border-radius:6px;">
          <div style="font-size:0.8rem; color:#888;">🌍 全体寄与</div>
          <div style="font-size:1.3rem; font-weight:bold;">${stats.global}個</div>
        </div>
        <div style="background:#fafafa; padding:10px; border-radius:6px;">
          <div style="font-size:0.8rem; color:#888;">🥬 品目数</div>
          <div style="font-size:1.3rem; font-weight:bold;">${stats.products}個</div>
        </div>
        <div style="background:#fafafa; padding:10px; border-radius:6px;">
          <div style="font-size:0.8rem; color:#888;">💰 単価設定済</div>
          <div style="font-size:1.3rem; font-weight:bold;">${stats.prices}件</div>
        </div>
      </div>
      <div class="shift-tabs">
        <button class="shift-tab${filter === 'all' ? ' active' : ''}" data-action="tasks-filter" data-filter="all">全て (${stats.total})</button>
        <button class="shift-tab${filter === 'hand' ? ' active' : ''}" data-action="tasks-filter" data-filter="hand">🟨 手作業 (${stats.hand})</button>
        <button class="shift-tab${filter === 'machine' ? ' active' : ''}" data-action="tasks-filter" data-filter="machine">🤖 マシン (${stats.machine})</button>
        <button class="shift-tab${filter === 'global' ? ' active' : ''}" data-action="tasks-filter" data-filter="global">🌍 全体寄与 (${stats.global})</button>
      </div>
      <table>
        <thead><tr><th>ID</th><th>アイコン</th><th>名称</th><th>分類</th><th>タイプ</th><th>単位</th><th>状態</th><th>操作</th></tr></thead>
        <tbody>
  `;
  for (const t of filteredTasks) {
    const tt = TASK_TYPE_LABELS[t.type];
    const cc = TASK_CATEGORY_COLORS[t.category];
    const statusLabel = t.machine_status 
      ? `<select class="task-input" data-task-id="${t.id}" data-field="machine_status" style="font-size:0.8rem;">
           <option value="実機" ${t.machine_status === '実機' ? 'selected' : ''}>✅ 実機</option>
           <option value="将来" ${t.machine_status === '将来' ? 'selected' : ''}>🔵 将来</option>
         </select>`
      : '-';
    html += `<tr style="background:${cc.bg};">
      <td style="font-family:monospace; font-size:0.85rem;">${t.id}</td>
      <td style="text-align:center;"><input type="text" class="task-input" data-task-id="${t.id}" data-field="icon" value="${t.icon}" style="width:44px; text-align:center; font-size:1.2rem; padding:3px;" /></td>
      <td><input type="text" class="task-input" data-task-id="${t.id}" data-field="name" value="${t.name}" style="width:100%; min-width:120px; padding:4px;" /></td>
      <td><span style="display:inline-block; padding:2px 8px; border-radius:10px; background:white; border:1px solid ${cc.border}; font-size:0.8rem;">${t.category}</span></td>
      <td>${tt.icon} ${tt.label}</td>
      <td><input type="text" class="task-input" data-task-id="${t.id}" data-field="unit" value="${t.unit}" style="width:60px; padding:4px;" /></td>
      <td>${statusLabel}</td>
      <td><button class="nav-btn" data-action="delete-task" data-task-id="${t.id}" style="padding:3px 8px; font-size:0.8rem; color:var(--red); border-color:var(--red);">削除</button></td>
    </tr>`;
  }
  if (filteredTasks.length === 0) {
    html += `<tr><td colspan="8" class="empty-message">該当する作業がありません</td></tr>`;
  }
  html += `</tbody></table>
      <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center;">
        <button class="primary-btn" data-action="save-tasks">作業の変更を保存</button>
        <span class="form-hint">※ 名称・アイコン・単位を直したら必ず保存してください。分類とタイプは後から変えられません（削除して作り直し）。</span>
      </div>
      <div style="margin-top:16px; padding:14px; background:#f4f6f9; border-radius:8px;">
        <strong style="font-size:0.95rem;">＋ 作業を追加</strong>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px;">
          <input type="text" id="new-task-icon" placeholder="🔪" style="width:56px; text-align:center; font-size:1.2rem; padding:6px;" />
          <input type="text" id="new-task-name" placeholder="作業名（例：袋詰め）" style="min-width:180px; padding:6px;" />
          <select id="new-task-category" style="padding:6px;">
            <option value="手作業">🟨 手作業（出来高あり）</option>
            <option value="マシン作業">🤖 マシン作業（出来高あり）</option>
            <option value="全体寄与">🌍 全体寄与（出来高なし）</option>
          </select>
          <input type="text" id="new-task-unit" placeholder="単位（袋・kg・箱）" style="width:150px; padding:6px;" />
          <button class="primary-btn" data-action="add-task">追加する</button>
        </div>
      </div>
    </div>
    
    <div class="card admin-section">
      <h2>🥬 品目マスタ（${stats.products}個）</h2>
      <div class="form-hint" style="margin-bottom:12px;">
        拠点で実際に扱う品目に入れ替えてください。単価・包材費が入っている品目は削除できません（先に単価マスタで0にしてください）。
      </div>
      <table>
        <thead><tr><th>ID</th><th>アイコン</th><th>品目名</th><th>単価設定</th><th>操作</th></tr></thead>
        <tbody>
  `;
  for (const p of state.work_products) {
    const priceCount = state.work_prices.filter(x => x.product_id === p.id).length;
    html += `<tr>
      <td style="font-family:monospace; font-size:0.85rem;">${p.id}</td>
      <td style="text-align:center;"><input type="text" class="product-input" data-product-id="${p.id}" data-field="emoji" value="${p.emoji}" style="width:44px; text-align:center; font-size:1.2rem; padding:3px;" /></td>
      <td><input type="text" class="product-input" data-product-id="${p.id}" data-field="name" value="${p.name}" style="width:100%; min-width:120px; padding:4px;" /></td>
      <td style="text-align:center; font-size:0.85rem; color:${priceCount ? '#1d9e75' : '#bbb'};">${priceCount ? priceCount + '件' : '未設定'}</td>
      <td><button class="nav-btn" data-action="delete-product" data-product-id="${p.id}" style="padding:3px 8px; font-size:0.8rem; color:var(--red); border-color:var(--red);">削除</button></td>
    </tr>`;
  }
  if (state.work_products.length === 0) {
    html += `<tr><td colspan="5" class="empty-message">品目がありません。下から追加してください。</td></tr>`;
  }
  html += `</tbody></table>
      <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center;">
        <button class="primary-btn" data-action="save-products">品目の変更を保存</button>
      </div>
      <div style="margin-top:16px; padding:14px; background:#f4f6f9; border-radius:8px;">
        <strong style="font-size:0.95rem;">＋ 品目を追加</strong>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px;">
          <input type="text" id="new-product-emoji" placeholder="🥬" style="width:56px; text-align:center; font-size:1.2rem; padding:6px;" />
          <input type="text" id="new-product-name" placeholder="品目名（例：ミニトマト）" style="min-width:180px; padding:6px;" />
          <button class="primary-btn" data-action="add-product">追加する</button>
        </div>
      </div>
    </div>
  `;
  return html;
}

function renderAjisaiPrices() {
  const rows = (state.ajisai_prices && state.ajisai_prices.length) ? state.ajisai_prices : DEFAULT_AJISAI_PRICES;
  const meta = AJISAI_PRICES_META;
  const totalN = rows.reduce((s, r) => s + (Number(r.n) || 0), 0);
  let html = `
    <div class="nav-row">
      <button class="nav-btn" data-action="back-admin">← 管理画面へ戻る</button>
    </div>
    <div class="card admin-section">
      <h2>🏷 確定単価（参照表）</h2>
      <div class="form-hint" style="margin-bottom:12px; line-height:1.7;">
        算定式：<strong>${meta.formula}</strong><br>
        出所：${meta.source}<br>
        <span style="color:#888;">基準日 ${meta.asof}／${meta.note}</span><br>
        <span style="color:#888;">※この表は<strong>作業実績から逆算した参考値</strong>です。単価を決めるときの参考にしてください。既存の「単価マスタ（作業×品目）」とは別管理で、出荷単価計算には連動しません。</span>
      </div>
      <table style="width:100%; border-collapse:collapse; font-size:0.92rem;">
        <thead>
          <tr style="background:#fff8e1;">
            <th style="padding:8px 6px; text-align:left; border-bottom:2px solid #d9b347;">区分</th>
            <th style="padding:8px 6px; text-align:left; border-bottom:2px solid #d9b347;">作業カテゴリ／品目</th>
            <th style="padding:8px 6px; text-align:right; border-bottom:2px solid #d9b347;">確定単価</th>
            <th style="padding:8px 6px; text-align:center; border-bottom:2px solid #d9b347;">単位</th>
            <th style="padding:8px 6px; text-align:right; border-bottom:2px solid #d9b347;">採用平均</th>
            <th style="padding:8px 6px; text-align:right; border-bottom:2px solid #d9b347;">n</th>
            <th style="padding:8px 6px; text-align:left; border-bottom:2px solid #d9b347;">備考</th>
          </tr>
        </thead>
        <tbody>
  `;
  for (const r of rows) {
    html += `
          <tr style="border-bottom:1px solid #eee;">
            <td style="padding:7px 6px; font-weight:bold; color:#d9b347;">${r.cat}</td>
            <td style="padding:7px 6px;">${r.name}</td>
            <td style="padding:7px 6px; text-align:right; font-weight:bold; color:var(--green); font-size:1.05rem;">${r.price}円</td>
            <td style="padding:7px 6px; text-align:center; color:#777;">${r.unit}</td>
            <td style="padding:7px 6px; text-align:right; color:#888;">${r.avg}</td>
            <td style="padding:7px 6px; text-align:right; color:#888;">${r.n}</td>
            <td style="padding:7px 6px; font-size:0.82rem; color:#666;">${r.note || ''}</td>
          </tr>
    `;
  }
  html += `
        </tbody>
      </table>
      <div class="form-hint" style="margin-top:12px; color:#888;">
        全${rows.length}カテゴリ／採用実績 計${totalN}件。要確認34行は保留（習熟後に再測定し採用へ移行可）。n=1暫定品目は次回サンプル追加で確定化。
      </div>
    </div>
  `;
  return html;
}

function renderPricesMaster() {
  // 単価マスタ：作業×品目の交差表
  // 親作業のみ対象（全体寄与は対象外）
  const parentTasks = state.work_tasks.filter(t => t.type === 'parent');
  const products = state.work_products;
  
  // 編集中の単価バッファ
  if (!state._pricesBuf) {
    // 既存単価から復元
    const buf = {};
    for (const p of state.work_prices) {
      const key = `${p.task_id}__${p.product_id}`;
      buf[key] = p.unit_price;
    }
    state._pricesBuf = buf;
  }
  const buf = state._pricesBuf;
  
  // 統計
  const totalCells = parentTasks.length * products.length;
  const filledCells = Object.values(buf).filter(v => v && v > 0).length;
  
  let html = `
    <div class="nav-row">
      <button class="nav-btn" data-action="back-tasks-master">← 作業マスタへ戻る</button>
    </div>
    <div class="card admin-section">
      <h2>💰 単価マスタ（作業×品目）</h2>
      <div class="form-hint" style="margin-bottom:14px;">
        💡 親作業ごとに、品目別の単価を設定します。設定された単価は出来高計算に使われます。<br>
        空欄のセルは「単価未設定」で、出来高入力時に警告が出ます。
      </div>
      <div style="display:flex; gap:14px; margin-bottom:14px; flex-wrap:wrap;">
        <div style="background:var(--green-bg); padding:10px 14px; border-radius:6px;">
          📊 設定済み：<strong>${filledCells} / ${totalCells} 件</strong>
        </div>
        <button class="primary-btn" data-action="save-prices">変更を保存</button>
        <button class="nav-btn" data-action="load-sample-prices" style="background:#fff3e0; color:var(--orange); border-color:var(--orange);">💡 空欄をたたき台で埋める</button>
      </div>
      <div style="overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid #e0e0e0; border-radius:6px;">
      <table class="prices-table" style="border-collapse:collapse; min-width:100%;">
        <thead>
          <tr>
            <th class="sticky-col" style="background:var(--green-bg); min-width:160px;">作業 ＼ 品目</th>
  `;
  for (const p of products) {
    html += `<th style="background:var(--green-bg); padding:8px 4px; min-width:80px; font-size:0.85rem;">${p.emoji}<br>${p.name}</th>`;
  }
  html += `</tr></thead><tbody>`;
  for (const t of parentTasks) {
    html += `<tr>
      <td class="sticky-col" style="background:white; padding:8px; font-size:0.9rem; border-right:2px solid #e0e0e0;">
        ${t.icon} <strong>${t.name}</strong><br>
        <span style="font-size:0.75rem; color:#888;">(${t.unit}単位)</span>
      </td>
    `;
    for (const p of products) {
      const key = `${t.id}__${p.id}`;
      const value = buf[key] || '';
      const placeholder = '-';
      html += `<td style="padding:4px; border:1px solid #f0f0f0;">
        <input type="number" class="price-input" 
          data-task-id="${t.id}" data-product-id="${p.id}" 
          value="${value}" 
          placeholder="${placeholder}" 
          style="width:60px; padding:4px; text-align:right; border:1px solid #ddd; border-radius:3px; font-size:0.85rem;"
          min="0" step="1" />
      </td>`;
    }
    html += `</tr>`;
  }
  html += `</tbody></table></div>
      <div class="form-hint" style="margin-top:10px;">
        💡 単位は作業ごとに固定（袋・kg・パック等）。数字だけ入力してください。<br>
        💡 「変更を保存」を押すまでデータは保存されません。
      </div>
    </div>
  `;
  return html;
}

function renderMaterialsMaster() {

    const buf = {};
    for (const m of state.work_materials) {

    state._materialsBuf = buf;

// 拠点マスタ（各拠点のパッケージセンター）
function renderSitesMaster() {
  let html = `
    <div class="nav-row">
      <button class="nav-btn" data-action="go-app-settings">← 設定へ戻る</button>
    </div>
    <div class="card admin-section">
      <h2>📍 拠点マスタ</h2>
      <div class="form-hint" style="margin-bottom:14px;">
        パッケージセンターのある拠点を登録します。従業員の所属と、この端末の拠点の選択肢になります。<br>
        拠点名を変えると、その拠点に所属する従業員の表示もまとめて追従します。
      </div>
      <table>
        <thead><tr><th>ID</th><th>拠点名</th><th>所属人数</th><th>操作</th></tr></thead>
        <tbody>
  `;
  for (const st of state.sites) {
    const cnt = state.employees.filter(e => e.location === st.name).length;
    const isHere = currentSite() === st.name;
    html += `<tr${isHere ? ' style="background:var(--green-bg);"' : ''}>
      <td style="font-family:monospace; font-size:0.85rem;">${st.id}</td>
      <td><input type="text" class="site-input" data-site-id="${st.id}" value="${st.name}" style="width:100%; min-width:160px; padding:5px;" />${isHere ? '<div style="font-size:0.75rem; color:var(--green); font-weight:bold; margin-top:3px;">📍 この端末の拠点</div>' : ''}</td>
      <td style="text-align:center;">${cnt}名</td>
      <td><button class="nav-btn" data-action="delete-site" data-site-id="${st.id}" style="padding:3px 8px; font-size:0.8rem; color:var(--red); border-color:var(--red);">削除</button></td>
    </tr>`;
  }
  html += `</tbody></table>
      <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;">
        <button class="primary-btn" data-action="save-sites">拠点名の変更を保存</button>
      </div>
      <div style="margin-top:16px; padding:14px; background:#f4f6f9; border-radius:8px;">
        <strong style="font-size:0.95rem;">＋ 拠点を追加</strong>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px;">
          <input type="text" id="new-site-name" placeholder="拠点名（例：川口）" style="min-width:200px; padding:6px;" />
          <button class="primary-btn" data-action="add-site">追加する</button>
        </div>
      </div>
    </div>
  `;
  return html;
}

当日の親作業売上 = Σ（出来高 × 単価）
当日の人件費   = Σ（実労働時間 × 時給）
当日差益       = 売上 − 人件費

全体寄与プール = 当日差益 × 配賦率（${rate.toFixed(1)}%）
全体寄与時間合計 = Σ（全員の全体寄与作業時間）
1時間あたり配賦 = プール ÷ 全体寄与時間合計

個人の配賦額 = 配賦/時間 × その人の全体寄与時間
個人の生産性指標 = （親作業売上 + 配賦額） ÷ 全労働時間</pre>

function exportMonthlyCSV() {
  const ym = state._reportYM;
  const activeEmps = employeesHere();
  const allSummaries = activeEmps.map(emp => {
    const labor = calcMonthlyLaborSummary(emp.id, ym.year, ym.month);
    const volume = calcMonthlyVolumeSum(emp.id, ym.year, ym.month);
    return { emp, ...labor, ...volume, profit: volume.totalRevenue - labor.totalWage };
  }).filter(x => x.workDays > 0 || x.recordCount > 0);
  allSummaries.sort((a, b) => String(a.emp.id || '').localeCompare(String(b.emp.id || '')));
  
  const lines = [];
  lines.push(`一次人件費・差益レポート`);
  lines.push(`対象月,${ym.year}年${ym.month}月`);
  lines.push(`出力日,${formatYMD(new Date())}`);
  lines.push('');
  lines.push('NO,氏名,出勤日数,投入人時(分),投入人時(h:m),時給単価(円),投入時給=人件費(円),出来高=売上(円),月間差益(円),備考');
  let totalDays = 0, totalNetMin = 0, totalWage = 0, totalRevenue = 0;
  for (const x of allSummaries) {
    const emp = x.emp;
    const plan = state.work_plans.find(wp => wp.employee_id === emp.id && wp.year === ym.year && wp.month === ym.month);
    const contractH = plan ? (plan.contract_hours || 0) : 0;
    const actualH = x.totalNetMin / 60;
    let memo = '';
    if (contractH > 0) {
      const diff = actualH - contractH;
      if (diff > 0) memo = `契約${contractH}h／+${diff.toFixed(1)}h`;
      else if (diff < 0) memo = `契約${contractH}h／${diff.toFixed(1)}h`;
      else memo = `契約${contractH}h／達成`;
    }
    if (x.hourlyRate === 0) memo += (memo ? '・' : '') + '時給未設定';
    if (x.unpricedCount > 0) memo += (memo ? '・' : '') + `単価未設定${x.unpricedCount}件`;
    if (plan && plan.notes) memo += (memo ? ' ' : '') + plan.notes;
    
    const fields = [
      emp.id,
      `"${emp.name}"`,
      `${x.workDays}日`,
      x.totalNetMin,
      formatHMin(x.totalNetMin),
      x.hourlyRate,
      x.totalWage,
      x.totalRevenue,
      x.profit,
      `"${memo}"`,
    ];
    lines.push(fields.join(','));
    totalDays += x.workDays;
    totalNetMin += x.totalNetMin;
    totalWage += x.totalWage;
    totalRevenue += x.totalRevenue;
  }
  const totalProfit = totalRevenue - totalWage;
  const profitRate = totalRevenue > 0 ? (totalProfit / totalRevenue * 100).toFixed(1) : '0.0';
  lines.push('');
  lines.push(`合計,${allSummaries.length}名,${totalDays}日,${totalNetMin},${formatHMin(totalNetMin)},,${totalWage},${totalRevenue},${totalProfit},利益率${profitRate}%`);
  lines.push('');
  lines.push('計算根拠');
  lines.push('"投入時給（人件費） = 実労働時間（拘束時間−休憩時間） × 時給単価"');
  lines.push('"出来高（売上） = 各作業の数量 × 作業×品目別単価"');
  lines.push('"月間差益 = 出来高 − 投入時給（人件費）"');
  lines.push('"休憩時間：労基法準拠（実労働6時間超で45分以上、8時間45分超で60分以上）"');
  lines.push('"提出先：本部 ／ 作成：センター"');
  
  const csv = '\ufeff' + lines.join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `一次人件費差益_${ym.year}年${String(ym.month).padStart(2,'0')}月.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function nextEmpId() {
  // 既存IDから次の番号を計算
  let maxN = 0;
  for (const e of state.employees) {
    const m = (e.id || '').match(/^E(\d+)$/);
    if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
  }
  return 'E' + String(maxN + 1).padStart(3, '0');
}

// 日別勤務計画（標準パターン＋月別計画）
// ===========================================

// 時刻 "HH:MM" を分数に変換
function parseTimeStr(timeStr) {
  if (!timeStr) return 0;
  const [h, m] = timeStr.split(':').map(Number);
  return h * 60 + (m || 0);
}
// 分数を "HH:MM" に
function formatTimeStr(minutes) {
  const h = Math.floor(minutes / 60);
  const m = minutes % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}
// 労基法準拠の自動休憩計算
function calcLaborMinutes(start, end) {
  if (!start || !end) return { grossMin: 0, breakMin: 0, netMin: 0 };
  const grossMin = parseTimeStr(end) - parseTimeStr(start);
  if (grossMin <= 0) return { grossMin: 0, breakMin: 0, netMin: 0 };
  let breakMin = 0;
  // 労基法：実労働が6時間を超えたら45分、8時間を超えたら60分の休憩が要る。
  // 拘束6h00mちょうどなら休憩不要（実労働6h00m）。6h01mになると実労働が6hを超えるため45分が必要になり、
  // 結果として実労働は5h16mに落ちる。この段差は法定休憩そのものの性質であって計算の誤りではない。
  // 同様に拘束8h45mまでは45分で足り（実労働8h00m）、8h46mからは60分が要る。
  if (grossMin > 8 * 60 + 45) breakMin = 60;
  else if (grossMin > 6 * 60) breakMin = 45;
  return { grossMin, breakMin, netMin: grossMin - breakMin };
}
function formatHMin(min) {
  const h = Math.floor(min / 60);
  const m = min % 60;
  if (m === 0) return `${h}h`;
  return `${h}h${m}m`;
}

const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];
const WEEKDAY_KEYS = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];

function getPattern(empId) {
  return state.work_patterns.find(p => p.employee_id === empId);
}
function getDailyPlan(empId, year, month) {
  return state.daily_plans.find(dp => dp.employee_id === empId && dp.year === year && dp.month === month);
}

// ★【2026-08-24 修正】日別計画に入っていない日を、曜日別の標準パターンで補う。
//
//   打刻の判定（getPlannedTimes）は前から「日別計画 → 無ければ標準パターン」で
//   見ていたのに、勤務計画変更（即変更）の画面だけが日別計画しか見ていなかった。
//   そのため「標準パターンだけ登録して月別計画に適用していない人」は
//   カレンダーが全部空白になり、日付を押しても本当に何も起きなかった。
//   （押せないセルには data-action すら付かないため、完全な無反応に見える）
//
//   ・日別計画に入っている日は一切触らない（手で直した値・休日指定を守る）
//   ・標準パターンで休みの日は「未設定」のままにする（勝手に休日にしない）
//   ・補った日には _from:'pattern' の印を付ける
//
//   ★この関数は「勤務計画変更」の画面だけで使う。
//     日別勤務計画（renderDailyPlanMonth）は「パターンを適用」で実体化させる
//     画面なので、補ってしまうと適用済みに見えてしまう。触らないこと。
function effectiveDays(empId, year, month) {
  const dailyPlan = getDailyPlan(empId, year, month);
  const base = (dailyPlan && dailyPlan.days) || {};
  const out = {};
  const lastDay = new Date(year, month, 0).getDate();
  const pt = (state.work_patterns || []).find(x => x.employee_id === empId);
  for (let d = 1; d <= lastDay; d++) {
    if (Object.prototype.hasOwnProperty.call(base, d)) { out[d] = base[d]; continue; }
    if (Object.prototype.hasOwnProperty.call(base, String(d))) { out[d] = base[String(d)]; continue; }
    if (!pt || !pt.pattern) continue;
    const key = WEEKDAY_KEYS[new Date(year, month - 1, d).getDay()];
    const w = pt.pattern[key];
    if (w && !w.off && w.start && w.end) out[d] = { start: w.start, end: w.end, _from: 'pattern' };
  }
  return out;
}

  for (const emp of activeEmps) {
    const pat = getPattern(emp.id);
    const faceCell = emp.photo 
      ? `<img src="${emp.photo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;" alt=""/>`
      : `<span style="font-size:1.4rem;">${emp.emoji}</span>`;
    let patSummary = '<span style="color:#bbb;">未登録</span>';
    if (pat && pat.pattern) {
      // 週の合計拘束時間と労働時間を計算
      let weekGross = 0, weekNet = 0, workDays = 0;
      for (const key of WEEKDAY_KEYS) {
        const day = pat.pattern[key];
        if (day && day.start && day.end) {
          const calc = calcLaborMinutes(day.start, day.end);
          weekGross += calc.grossMin;
          weekNet += calc.netMin;
          workDays++;
        }
      }
      patSummary = `週${workDays}日 ／ 実労働 ${formatHMin(weekNet)}／週`;
    }
    const patBtn = pat 
      ? '<button class="nav-btn" data-action="edit-pattern" data-emp-id="' + emp.id + '" style="padding:4px 10px; font-size:0.85rem;">編集</button>'
      : '<button class="nav-btn" data-action="edit-pattern" data-emp-id="' + emp.id + '" style="padding:4px 10px; font-size:0.85rem; background:var(--green); color:white; border-color:var(--green);">＋登録</button>';
    const monthBtn = '<button class="nav-btn" data-action="open-daily-plan" data-emp-id="' + emp.id + '" style="padding:4px 10px; font-size:0.85rem; background:var(--blue-light); color:var(--blue); border-color:var(--blue);">📅 月別計画を開く</button>';
    html += `<tr>
      <td>${emp.id}</td>
      <td style="text-align:center;">${faceCell}</td>
      <td>${emp.name}</td>
      <td>${patSummary}</td>
      <td>${patBtn}</td>
      <td>${monthBtn}</td>
    </tr>`;
  }
  if (activeEmps.length === 0) {
    html += `<tr><td colspan="6" class="empty-message">在籍中の従業員がいません</td></tr>`;
  }
  html += `</tbody></table></div>`;
  return html;
}

// 月別計画画面
function renderDailyPlanMonth() {
  const empId = state._dailyPlanEmpId;
  const emp = state.employees.find(e => e.id === empId);
  if (!emp) { state.screen = 'daily_plan_list'; return renderDailyPlanList(); }
  if (!state._dailyPlanYM) state._dailyPlanYM = currentYM();
  const { year, month } = state._dailyPlanYM;
  // 月選択肢
  const monthOptions = [];
  for (let i = 3; i >= -6; i--) {
    const d = new Date(year, month - 1 - i, 1);
    const y = d.getFullYear(), m = d.getMonth() + 1;
    const sel = (y === year && m === month) ? ' selected' : '';
    monthOptions.push(`<option value="${y}-${m}"${sel}>${y}年${m}月</option>`);
  }
  const dailyPlan = getDailyPlan(empId, year, month);
  const days = (dailyPlan && dailyPlan.days) || {};
  const pattern = getPattern(empId);
  // 月の日数
  const lastDay = new Date(year, month, 0).getDate();
  const firstDow = new Date(year, month - 1, 1).getDay();  // 0=日
  // 月合計
  let monthGross = 0, monthNet = 0, workDays = 0;
  for (let d = 1; d <= lastDay; d++) {
    const dayData = days[d];
    if (dayData && dayData.start && dayData.end) {
      const c = calcLaborMinutes(dayData.start, dayData.end);
      monthGross += c.grossMin; monthNet += c.netMin; workDays++;
    }
  }
  // 当月の月間計画（時給・契約時間）
  const wp = findWorkPlan(empId, year, month);
  const contractHours = wp ? wp.contract_hours : (emp.monthly_contract_hours || 0);
  const netHours = monthNet / 60;
  const diff = contractHours > 0 ? (netHours - contractHours) : 0;
  let diffLabel = '';
  if (contractHours > 0) {
    if (Math.abs(diff) < 0.5) diffLabel = `<span style="color:var(--green);">契約通り</span>`;
    else if (diff > 0) diffLabel = `<span style="color:var(--orange);">+${diff.toFixed(1)}h 超過</span>`;
    else diffLabel = `<span style="color:var(--red);">${diff.toFixed(1)}h 不足</span>`;
  }
  const faceHtml = emp.photo 
    ? `<img src="${emp.photo}" style="width:48px;height:48px;border-radius:50%;object-fit:cover;" alt=""/>`
    : `<span style="font-size:2rem;">${emp.emoji}</span>`;
  let html = `
    <div class="nav-row">
      <button class="nav-btn" data-action="back-daily-plan-list">← 一覧に戻る</button>
    </div>
    <div class="card">
      <h2>🗓️ ${year}年${month}月の勤務計画</h2>
      <div style="background:var(--green-bg); padding:12px 14px; border-radius:8px; margin-bottom:14px; display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
        ${faceHtml}
        <div>
          <div style="font-size:1.1rem; font-weight:bold;">${emp.name}</div>
          <div style="font-size:0.85rem; color:#555;">NO：${emp.id}</div>
        </div>
        <div style="margin-left:auto;">
          <label class="form-label" style="margin:0; display:inline;">対象月：</label>
          <select id="dpm-ym" data-action="change-dpm-ym">${monthOptions.join('')}</select>
        </div>
      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-bottom:14px;">
        <div style="background:#fafafa; border-radius:8px; padding:10px;">
          <div style="font-size:0.8rem; color:#888;">出勤予定</div>
          <div style="font-size:1.4rem; font-weight:bold; color:var(--blue);">${workDays}日</div>
        </div>
        <div style="background:#fafafa; border-radius:8px; padding:10px;">
          <div style="font-size:0.8rem; color:#888;">合計拘束</div>
          <div style="font-size:1.4rem; font-weight:bold;">${formatHMin(monthGross)}</div>
        </div>
        <div style="background:#fafafa; border-radius:8px; padding:10px;">
          <div style="font-size:0.8rem; color:#888;">合計実労働</div>
          <div style="font-size:1.4rem; font-weight:bold; color:var(--green);">${formatHMin(monthNet)}</div>
        </div>
        <div style="background:#fafafa; border-radius:8px; padding:10px;">
          <div style="font-size:0.8rem; color:#888;">契約時間 ${contractHours > 0 ? contractHours + 'h' : '未設定'}</div>
          <div style="font-size:1rem; font-weight:bold;">${diffLabel || '-'}</div>
        </div>
      </div>
      <div style="margin-bottom:14px; display:flex; gap:10px; flex-wrap:wrap;">
        ${pattern 
          ? `<button class="primary-btn" data-action="apply-pattern" style="background:var(--blue);">🔄 標準パターンから${Object.keys(days).length > 0 ? '再' : ''}適用</button>`
          : '<span class="form-hint" style="padding:8px 0;">⚠️ 標準パターン未登録（先にパターンを登録してください）</span>'
        }
        <button class="nav-btn" data-action="clear-all-days" style="color:var(--red); border-color:var(--red);">全てクリア</button>
      </div>
      <table class="calendar-table">
        <thead>
          <tr>
            <th class="wd-sun">日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th class="wd-sat">土</th>
          </tr>
        </thead>
        <tbody>
  `;
  // カレンダーレンダリング
  let dayNum = 1;
  let week = '<tr>';
  for (let i = 0; i < firstDow; i++) week += '<td class="cal-empty"></td>';
  let col = firstDow;
  while (dayNum <= lastDay) {
    const dayData = days[dayNum];
    const isOff = !dayData;
    const isWork = dayData && dayData.start && dayData.end;
    let cellContent = `<div class="cal-day-num">${dayNum}</div>`;
    if (isWork) {
      const c = calcLaborMinutes(dayData.start, dayData.end);
      cellContent += `<div class="cal-time">${dayData.start}<br>〜${dayData.end}</div>`;
      cellContent += `<div class="cal-hours">${formatHMin(c.netMin)}</div>`;
    } else if (Object.keys(days).length > 0 && (dayData === null || dayData === undefined && days[dayNum] !== undefined)) {
      cellContent += `<div class="cal-off">休</div>`;
    } else if (dayData === null) {
      cellContent += `<div class="cal-off">休</div>`;
    }
    const colorClass = (col === 0) ? 'wd-sun-cell' : (col === 6 ? 'wd-sat-cell' : '');
    const cellClass = isWork ? 'cal-cell cal-work' : (dayData === null ? 'cal-cell cal-off-cell' : 'cal-cell cal-blank');
    week += `<td class="${cellClass} ${colorClass}" data-action="edit-day" data-day="${dayNum}">${cellContent}</td>`;
    col++;
    if (col === 7) {
      week += '</tr>';
      html += week;
      week = '<tr>';
      col = 0;
    }
    dayNum++;
  }
  if (col > 0 && col < 7) {
    for (let i = col; i < 7; i++) week += '<td class="cal-empty"></td>';
    week += '</tr>';
    html += week;
  }
  html += `</tbody></table>
      <div class="form-hint" style="margin-top:10px;">
        💡 各日のセルをクリックして始業・終業を入力／休に切替できます。
      </div>
    </div>
  `;
  return html;
}

// ===========================================
// 全員シフト一覧（当日/週/月/指定日）
// ===========================================

function getDayPlan(empId, dateObj) {
  const y = dateObj.getFullYear();
  const m = dateObj.getMonth() + 1;
  const d = dateObj.getDate();
  const dp = state.daily_plans.find(p => p.employee_id === empId && p.year === y && p.month === m);
  if (!dp || !dp.days) return undefined;
  return dp.days[d];  // undefined=未設定 / null=休 / {start,end}=出勤
}

function formatYMD(d) {
  const wd = WEEKDAYS[d.getDay()];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${wd}）`;
}
function isoDateOnly(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseISODate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function addDays(d, n) {
  const nd = new Date(d);
  nd.setDate(nd.getDate() + n);
  return nd;
}

function renderShiftOverview() {
  if (!state._shiftMode) state._shiftMode = 'day';
  if (!state._shiftDate) state._shiftDate = new Date();
  const mode = state._shiftMode;
  const baseDate = state._shiftDate;
  // モード切替タブ
  const tabs = [
    { key: 'day', label: '当日' },
    { key: 'week', label: '1週間' },
    { key: 'month', label: '1か月' },
    { key: 'custom', label: '日付指定' },
  ];
  let tabsHtml = `<div class="shift-tabs">`;
  for (const t of tabs) {
    const active = (t.key === mode) ? ' active' : '';
    tabsHtml += `<button class="shift-tab${active}" data-action="shift-mode" data-mode="${t.key}">${t.label}</button>`;
  }
  tabsHtml += `</div>`;
  let html = `
    <div class="nav-row">
      <button class="nav-btn" data-action="back-admin">← 管理画面へ戻る</button>
    </div>
    <div class="card admin-section">
      <h2>📊 全員シフト一覧</h2>
      ${tabsHtml}
  `;
  if (mode === 'day') {
    html += renderShiftDay(baseDate);
  } else if (mode === 'week') {
    html += renderShiftWeek(baseDate);
  } else if (mode === 'month') {
    html += renderShiftMonth(baseDate);
  } else if (mode === 'custom') {
    html += renderShiftCustom(baseDate);
  }
  html += `</div>`;
  return html;
}

function renderShiftDay(baseDate) {
  const dateStr = isoDateOnly(baseDate);
  const activeEmps = employeesHere();
  // 出勤者のみフィルタ
  const attending = [];
  for (const emp of activeEmps) {
    const day = getDayPlan(emp.id, baseDate);
    if (day && day.start && day.end) {
      const calc = calcLaborMinutes(day.start, day.end);
      attending.push({ emp, day, calc });
    }
  }
  let html = `
    <div class="shift-navbar">
      <button class="nav-btn" data-action="shift-day-prev">← 前日</button>
      <input type="date" id="shift-date-input" value="${dateStr}" data-action="shift-date-change" />
      <div class="shift-date-label">${formatYMD(baseDate)}</div>
      <button class="nav-btn" data-action="shift-day-today">今日</button>
      <button class="nav-btn" data-action="shift-day-next">翌日 →</button>
    </div>
    <div class="shift-summary">
      <span>出勤予定 <strong>${attending.length}名</strong></span>
      <span>合計実労働 <strong>${formatHMin(attending.reduce((s,a)=>s+a.calc.netMin,0))}</strong></span>
    </div>
  `;
  if (attending.length === 0) {
    html += `<div class="empty-message">この日に出勤予定の従業員はいません</div>`;
    return html;
  }
  // 始業時刻順にソート
  attending.sort((a, b) => parseTimeStr(a.day.start) - parseTimeStr(b.day.start));
  html += `<table class="shift-day-table">
    <thead><tr><th>NO</th><th>顔</th><th>名前</th><th>始業</th><th>終業</th><th>拘束</th><th>休憩</th><th>実労働</th></tr></thead><tbody>`;
  for (const { emp, day, calc } of attending) {
    const faceCell = emp.photo 
      ? `<img src="${emp.photo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;" alt=""/>`
      : `<span style="font-size:1.4rem;">${emp.emoji}</span>`;
    html += `<tr>
      <td>${emp.id}</td>
      <td style="text-align:center;">${faceCell}</td>
      <td>${emp.name}</td>
      <td style="font-variant-numeric:tabular-nums;">${day.start}</td>
      <td style="font-variant-numeric:tabular-nums;">${day.end}</td>
      <td>${formatHMin(calc.grossMin)}</td>
      <td>${calc.breakMin > 0 ? calc.breakMin + 'm' : '-'}</td>
      <td style="font-weight:bold; color:var(--green);">${formatHMin(calc.netMin)}</td>
    </tr>`;
  }
  html += `</tbody></table>`;
  return html;
}

function renderShiftWeek(baseDate) {
  // 週の開始（日曜）を計算
  const dow = baseDate.getDay();
  const weekStart = addDays(baseDate, -dow);
  const days = [];
  for (let i = 0; i < 7; i++) days.push(addDays(weekStart, i));
  const activeEmps = employeesHere();
  // 行ごとに各日のプランを集める
  let html = `
    <div class="shift-navbar">
      <button class="nav-btn" data-action="shift-week-prev">← 前週</button>
      <div class="shift-date-label">${weekStart.getFullYear()}年${weekStart.getMonth()+1}月${weekStart.getDate()}日 〜 ${days[6].getMonth()+1}月${days[6].getDate()}日</div>
      <button class="nav-btn" data-action="shift-week-today">今週</button>
      <button class="nav-btn" data-action="shift-week-next">翌週 →</button>
    </div>
    <div class="shift-table-wrap">
    <table class="shift-grid-table">
      <thead>
        <tr>
          <th class="sticky-col">名前</th>
  `;
  for (const d of days) {
    const dow2 = d.getDay();
    const cls = (dow2 === 0) ? 'wd-sun' : (dow2 === 6 ? 'wd-sat' : '');
    html += `<th class="${cls}">${d.getMonth()+1}/${d.getDate()}<br>(${WEEKDAYS[dow2]})</th>`;
  }
  html += `<th>個人合計</th></tr></thead><tbody>`;
  let dayTotals = days.map(() => ({ count: 0, netMin: 0 }));
  for (const emp of activeEmps) {
    const faceCell = emp.photo 
      ? `<img src="${emp.photo}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;" alt=""/>`
      : `${emp.emoji} `;
    let rowNet = 0, rowCount = 0;
    let cells = '';
    days.forEach((d, idx) => {
      const day = getDayPlan(emp.id, d);
      if (day === undefined) {
        cells += `<td class="cell-blank">-</td>`;
      } else if (day === null) {
        cells += `<td class="cell-off">休</td>`;
      } else if (day.start && day.end) {
        const c = calcLaborMinutes(day.start, day.end);
        rowNet += c.netMin; rowCount++;
        dayTotals[idx].netMin += c.netMin; dayTotals[idx].count++;
        cells += `<td class="cell-work"><div class="cw-time">${day.start}<br>〜${day.end}</div><div class="cw-hours">${formatHMin(c.netMin)}</div></td>`;
      } else {
        cells += `<td class="cell-blank">-</td>`;
      }
    });
    html += `<tr><td class="sticky-col">${faceCell}${emp.name}</td>${cells}<td class="row-total">${formatHMin(rowNet)}<br><span style="font-size:0.75rem;color:#888;">(${rowCount}日)</span></td></tr>`;
  }
  // 合計行
  html += `<tr class="totals-row"><td class="sticky-col"><strong>日別合計</strong></td>`;
  let weekTotal = 0;
  for (const t of dayTotals) {
    weekTotal += t.netMin;
    html += `<td><strong>${t.count}名</strong><br><span style="font-size:0.8rem;">${formatHMin(t.netMin)}</span></td>`;
  }
  html += `<td><strong>${formatHMin(weekTotal)}</strong></td></tr>`;
  html += `</tbody></table></div>`;
  return html;
}

function renderShiftMonth(baseDate) {

    </div>
    <div class="shift-table-wrap">
    <table class="shift-month-table">
      <thead>
        <tr>
          <th class="sticky-col">名前</th>
  `;
  for (let d = 1; d <= lastDay; d++) {
    const dateObj = new Date(year, month-1, d);

    const cls = (dow === 0) ? 'wd-sun' : (dow === 6 ? 'wd-sat' : '');
    html += `<th class="month-day-th ${cls}">${d}<br><span style="font-size:0.7rem;">${WEEKDAYS[dow]}</span></th>`;

  for (const emp of activeEmps) {
    let rowNet = 0, rowCount = 0;
    let cells = '';
    for (let d = 1; d <= lastDay; d++) {
      const dateObj = new Date(year, month-1, d);
      const day = getDayPlan(emp.id, dateObj);
      if (day === undefined) {
        cells += `<td class="month-cell cell-blank">-</td>`;
      } else if (day === null) {
        cells += `<td class="month-cell cell-off">休</td>`;
      } else if (day.start && day.end) {
        const c = calcLaborMinutes(day.start, day.end);
        rowNet += c.netMin; rowCount++;
        dayTotals[d].netMin += c.netMin; dayTotals[d].count++;
        const hLabel = (c.netMin % 60 === 0) ? (c.netMin/60) + 'h' : formatHMin(c.netMin);
        cells += `<td class="month-cell cell-work" title="${day.start}-${day.end}">${hLabel}</td>`;
      } else {
        cells += `<td class="month-cell cell-blank">-</td>`;
      }
    }

      ? `<img src="${emp.photo}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;" alt=""/>`
      : `${emp.emoji} `;
    html += `<tr><td class="sticky-col">${faceCell}${emp.name}</td>${cells}<td class="row-total">${formatHMin(rowNet)}<br><span style="font-size:0.7rem; color:#888;">(${rowCount}日)</span></td></tr>`;
  }
  // 合計行
  html += `<tr class="totals-row"><td class="sticky-col"><strong>日別出勤</strong></td>`;
  let monthTotal = 0;
  for (let d = 1; d <= lastDay; d++) {
    monthTotal += dayTotals[d].netMin;
    html += `<td class="month-cell"><strong>${dayTotals[d].count}</strong></td>`;
  }
  html += `<td><strong>${formatHMin(monthTotal)}</strong></td></tr>`;
  html += `</tbody></table></div>
    <div class="form-hint" style="margin-top:10px;">💡 横スクロールで全日確認可。セルにマウスを乗せると始業-終業時刻が表示されます。</div>`;
  return html;
}

// セッションIDから安定した色を生成
function sessionColor(sessionId) {
  if (!sessionId) return null;
  let hash = 0;
  for (let i = 0; i < sessionId.length; i++) {
    hash = (hash * 31 + sessionId.charCodeAt(i)) | 0;
  }
  const palette = [
    { bg: '#fff3e0', border: '#d97847' },
    { bg: '#e8f4ee', border: '#1d9e75' },
    { bg: '#e3f2fd', border: '#2b7bbe' },
    { bg: '#f3e5f5', border: '#9c27b0' },
    { bg: '#fce4ec', border: '#e91e63' },
    { bg: '#fff9c4', border: '#d9b347' },
    { bg: '#e0f2f1', border: '#00897b' },
    { bg: '#efebe9', border: '#795548' },
  ];
  return palette[Math.abs(hash) % palette.length];
}

function pfixBuildISO(dateObj, hhmm) {
  const [hh, mm] = hhmm.split(':').map(Number);
  const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate(), hh, mm, 0, 0);
  return d.toISOString();
}
async function pfixLog(action, empId, dateStr, ptype, before, after) {
  if (!Array.isArray(state.punch_edits)) state.punch_edits = [];
  state.punch_edits.push({
    id: 'PE' + Date.now() + '-' + Math.floor(Math.random() * 1000),
    edited_at: new Date().toISOString(),
    editor: '管理者',
    employee_id: empId,
    date: dateStr,
    action: action,        // 'edit' | 'add' | 'delete'
    punch_type: ptype,     // START | BREAK | END
    before: before || null,
    after: after || null,
  });
  await saveData(STORAGE_KEYS.PUNCH_EDITS, state.punch_edits);
}

function renderPunchLogs() {
  if (!state._logsMode) state._logsMode = 'individual';
  if (!state._logsDate) state._logsDate = new Date();
  if (!state._logsFilter) state._logsFilter = { empIds: null, types: null };  // null=全員/全種別

  const dateStr = isoDateOnly(state._logsDate);
  // 当日打刻を取得（フィルタ適用前）
  const allPunches = state.punches
    .filter(p => isOnDate(p.timestamp, dateStr))
    .sort((a, b) => String(a.timestamp || '').localeCompare(String(b.timestamp || '')));
  // フィルタ
  const filter = state._logsFilter;
  const filteredPunches = allPunches.filter(p => {
    if (filter.empIds && filter.empIds.length > 0 && !filter.empIds.includes(p.employee_id)) return false;
    if (filter.types && filter.types.length > 0 && !filter.types.includes(p.type)) return false;

  const tabs = [

  for (const t of tabs) {

    tabsHtml += `<button class="shift-tab${active}" data-action="logs-mode" data-mode="${t.key}">${t.label}</button>`;

          <div class="filter-label">種別：</div>
          <div class="filter-options">
            <button class="filter-chip${filter.types === null ? ' active' : ''}" data-action="logs-filter-type-all">全種別</button>

    const faceCell = emp.photo

    html += `<div class="emp-group">

        </div>
        <div style="margin-left:auto; font-size:0.85rem; color:#888;">${list.length}件</div>
      </div>
      <div class="emp-group-body">
    `;
    for (const p of list) {
      const pt = PUNCH_TYPES[p.type];
      const work = p.work_item_id ? state.work_items.find(w => w.id === p.work_item_id) : null;
      const sCol = sessionColor(p.session_id);
      const sStyle = sCol 
        ? `background:${sCol.bg};border-left:4px solid ${sCol.border};` 
        : 'border-left:4px solid #e0e0e0;';
      html += `<div class="punch-row" style="${sStyle}">
        <div class="pr-time">${formatTime(p.timestamp)}</div>
        <div class="pr-badge"><span class="badge ${pt.badge}">${pt.icon} ${pt.label}</span></div>
        <div class="pr-work">${work ? work.emoji + ' ' + work.name : ''}</div>
        ${p.session_id ? `<div class="pr-session">🤝</div>` : '<div class="pr-session"></div>'}
      </div>`;
    }
    html += `</div></div>`;
  }
  html += '</div>';
  return html;
}

function renderLogsGantt(punches) {
  // 個人別にイベントを並べる
  const byEmp = {};
  for (const p of punches) {
    if (!byEmp[p.employee_id]) byEmp[p.employee_id] = [];
    byEmp[p.employee_id].push(p);
  }
  const empIds = Object.keys(byEmp).sort();
  if (empIds.length === 0) return `<div class="empty-message">条件に該当する打刻がありません</div>`;
  // 表示時間範囲を計算（最早出勤から、最遅退勤 or 現在時刻）
  let minMin = 24 * 60, maxMin = 0;
  for (const empId of empIds) {
    for (const p of byEmp[empId]) {
      const d = new Date(p.timestamp);
      const m = d.getHours() * 60 + d.getMinutes();
      if (m < minMin) minMin = m;
      if (m > maxMin) maxMin = m;
    }
  }
  // 今日の場合、現在時刻まで含める
  const today = new Date();
  const isToday = isoDateOnly(today) === isoDateOnly(state._logsDate);
  if (isToday) {
    const nowMin = today.getHours() * 60 + today.getMinutes();
    if (nowMin > maxMin) maxMin = nowMin;
  }
  // 余白
  minMin = Math.max(0, Math.floor(minMin / 60) * 60);
  maxMin = Math.min(24 * 60, Math.ceil((maxMin + 30) / 60) * 60);
  const rangeMin = maxMin - minMin;
  if (rangeMin <= 0) return `<div class="empty-message">条件に該当する打刻がありません</div>`;
  // 時刻軸ラベル
  const hours = [];
  for (let m = minMin; m <= maxMin; m += 60) {
    hours.push(m);
  }
  let html = `<div class="gantt-wrap"><div class="gantt-container" style="grid-template-columns: 130px 1fr;">`;
  // ヘッダー
  html += `<div class="gantt-header sticky-col-g">名前</div>`;
  html += `<div class="gantt-header gantt-time-row">`;
  for (const hm of hours) {
    const pct = ((hm - minMin) / rangeMin) * 100;
    html += `<div class="gantt-tick" style="left:${pct}%;">${formatTimeStr(hm)}</div>`;
  }
  html += `</div>`;
  // 各従業員行
  for (const empId of empIds) {
    const emp = state.employees.find(e => e.id === empId);
    if (!emp) continue;
    const list = byEmp[empId].slice().sort((a, b) => String(a.timestamp || '').localeCompare(String(b.timestamp || '')));
    const faceCell = emp.photo 
      ? `<img src="${emp.photo}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;" alt=""/>`
      : `${emp.emoji} `;
    html += `<div class="gantt-name sticky-col-g">${faceCell}${emp.name}</div>`;
    html += `<div class="gantt-row">`;
    // セグメント計算：状態遷移を時間範囲に変換
    let segs = [];
    let currentStart = null;
    let currentType = null;  // 'working' | 'break'
    let currentSession = null;
    let currentWork = null;
    for (const p of list) {
      const t = new Date(p.timestamp);
      const m = t.getHours() * 60 + t.getMinutes();
      if (p.type === 'WORK_START') {
        currentStart = m;
        currentType = 'working';
        currentSession = p.session_id;
        currentWork = p.work_item_id;
      } else if (p.type === 'WORK_END' && currentType === 'working') {
        segs.push({ start: currentStart, end: m, type: 'working', session: currentSession, work: currentWork });
        currentStart = null; currentType = null;
      } else if (p.type === 'BREAK') {
        if (currentType === 'working') {
          segs.push({ start: currentStart, end: m, type: 'working', session: currentSession, work: currentWork });
        }
        currentStart = m; currentType = 'break';
      } else if (p.type === 'END') {
        if (currentType === 'working') {
          segs.push({ start: currentStart, end: m, type: 'working', session: currentSession, work: currentWork });
        } else if (currentType === 'break') {
          segs.push({ start: currentStart, end: m, type: 'break' });
        }
        currentStart = null; currentType = null;
      }
    }
    // 進行中
    if (currentStart !== null && isToday) {
      const nowMin = today.getHours() * 60 + today.getMinutes();
      segs.push({ start: currentStart, end: nowMin, type: currentType, session: currentSession, work: currentWork, ongoing: true });
    }
    // 描画
    for (const seg of segs) {
      const leftPct = ((seg.start - minMin) / rangeMin) * 100;
      const widthPct = ((seg.end - seg.start) / rangeMin) * 100;
      const work = seg.work ? state.work_items.find(w => w.id === seg.work) : null;
      let cls = 'gantt-seg ';
      let bgStyle = '';
      if (seg.type === 'working') {
        const sCol = sessionColor(seg.session);
        if (sCol) {
          cls += 'gantt-work-session';
          bgStyle = `background:${sCol.bg};border-color:${sCol.border};`;
        } else {
          cls += 'gantt-work';
        }
      } else if (seg.type === 'break') {
        cls += 'gantt-break';
      }
      if (seg.ongoing) cls += ' gantt-ongoing';
      const title = `${formatTimeStr(seg.start)}-${formatTimeStr(seg.end)}${work ? ' ' + work.name : ''}${seg.session ? ' 🤝' : ''}`;
      html += `<div class="${cls}" style="left:${leftPct}%; width:${widthPct}%; ${bgStyle}" title="${title}">
        ${work ? work.emoji : (seg.type === 'break' ? '☕' : '')}
        ${seg.session ? '🤝' : ''}
      </div>`;
    }
    // 打刻マーカー
    for (const p of list) {
      if (p.type !== 'START' && p.type !== 'END') continue;
      const t = new Date(p.timestamp);
      const m = t.getHours() * 60 + t.getMinutes();
      const leftPct = ((m - minMin) / rangeMin) * 100;
      const pt = PUNCH_TYPES[p.type];
      const dotCol = p.type === 'START' ? 'var(--green)' : 'var(--red)';
      html += `<div class="gantt-marker" style="left:${leftPct}%; background:${dotCol};" title="${pt.label} ${formatTime(p.timestamp)}"></div>`;
    }
    // 「今」のライン
    if (isToday) {
      const nowMin = today.getHours() * 60 + today.getMinutes();
      if (nowMin >= minMin && nowMin <= maxMin) {
        const leftPct = ((nowMin - minMin) / rangeMin) * 100;
        html += `<div class="gantt-now-line" style="left:${leftPct}%;"></div>`;
      }
    }
    html += `</div>`;
  }
  html += `</div>
    <div class="gantt-legend" style="margin-top:14px; display:flex; gap:14px; flex-wrap:wrap; font-size:0.85rem;">
      <span><span class="legend-dot" style="background:var(--blue);"></span> 単独作業</span>
      <span><span class="legend-dot" style="background:var(--orange-light); border:1px solid var(--orange);"></span> ペア作業（同色＝同セッション）</span>
      <span><span class="legend-dot" style="background:#f0f0f0; border:1px solid #999;"></span> 休憩</span>
      <span><span class="legend-dot" style="background:var(--green); border-radius:50%;"></span> 出勤</span>
      <span><span class="legend-dot" style="background:var(--red); border-radius:50%;"></span> 退勤</span>
      ${isToday ? '<span><span class="legend-dot" style="background:var(--red); width:3px;"></span> 現在時刻</span>' : ''}
    </div></div>`;
  return html;
}

function renderLogsTimeline(punches) {

// 個人の今月の変更回数を集計（change_history未実装のため現時点は0返却）
// ★【2026-08-24 修正】変更履歴のレコードが持つのは changed_at。timestamp は存在しない。
//   そのため今月の変更回数は、何回変更しても必ず 0回 と出ていた。
function histTime(h) { return (h && (h.changed_at || h.timestamp || h.created_at)) || ''; }

function getPlanChangeCount(empId, range) {
  if (!state.change_history) return 0;
  const now = new Date();
  const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  return state.change_history.filter(h => h.emp_id === empId && isInMonth(histTime(h), ym)).length;
}

// 個人の承認待ち申請件数（change_requests未実装のため現時点は0返却）
function getPendingApprovalCount(empId) {
  // TODO: v0.7 Phase 6で change_requests 連動
  if (!state.change_requests) return 0;
  return state.change_requests.filter(r => r.emp_id === empId && r.status === 'pending').length;
}

// 個人の直近変更内容（change_history未実装のため現時点は null 返却）
function getLastPlanChange(empId) {
  // TODO: v0.7 Phase 6で change_history 連動
  if (!state.change_history) return null;
  const list = state.change_history.filter(h => h.emp_id === empId);
  if (list.length === 0) return null;
  // ★【2026-08-24 修正・今回の原因】ここは h.timestamp を読んでいたが、
  //   変更履歴が持つのは changed_at。timestamp は undefined になる。
  //   履歴が2件以上ある人を選ぶと undefined.localeCompare で必ず落ち、
  //   「変更したい項目を選んでください」の画面が出ないまま無反応になっていた。
  //   （履歴が1件だと sort の比較が呼ばれないので落ちない。だから
  //     前から使っている人だけで起き、新しく登録した人では起きなかった）
  return list.slice().sort((a, b) => histTime(b).localeCompare(histTime(a)))[0];
}

// 一意なID生成
function genId(prefix) {
  return `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;
}

// ISO形式の現在時刻
function nowISO() {
  return new Date().toISOString();
}

// 申請データを追加
async function addChangeRequest(req) {
  const fullReq = {
    request_id: genId('REQ'),
    status: 'pending',
    requested_by: 'admin',
    requested_at: nowISO(),
    approved_by: null,
    approved_at: null,
    ...req
  };
  state.change_requests.push(fullReq);
  await saveData(STORAGE_KEYS.CHANGE_REQUESTS, state.change_requests);
  return fullReq;
}

// 履歴データを追加
async function addChangeHistory(hist) {
  const fullHist = {
    history_id: genId('HIS'),
    changed_by: 'admin',
    changed_at: nowISO(),
    ...hist
  };
  state.change_history.push(fullHist);
  await saveData(STORAGE_KEYS.CHANGE_HISTORY, state.change_history);
  return fullHist;
}

// 本人通知を追加
async function addEmployeeNotification(empId, payload) {
  const notif = {
    notif_id: genId('NTF'),
    emp_id: empId,
    created_at: nowISO(),
    read: false,
    read_at: null,
    ...payload
  };
  state.employee_notifications.push(notif);
  await saveData(STORAGE_KEYS.EMPLOYEE_NOTIFICATIONS, state.employee_notifications);

}

// 勤務計画（日別）の特定日を更新
async function updateDailyPlanCell(empId, year, month, day, newDayData) {
  let plan = state.daily_plans.find(dp => dp.employee_id === empId && dp.year === year && dp.month === month);
  if (!plan) {
    plan = { employee_id: empId, year, month, days: {} };
    state.daily_plans.push(plan);
  }
  if (!plan.days) plan.days = {};
  plan.days[day] = newDayData;
  await saveData(STORAGE_KEYS.DAILY_PLANS, state.daily_plans);
}

// 日付フォーマット YYYY-MM-DD
function fmtDate(year, month, day) {
  return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

// "09:00〜17:00" → {start:"09:00", end:"17:00"}
function parseTimeRange(timeStr) {
  if (!timeStr) return null;
  const [s, e] = timeStr.split('〜');
  return { start: s || '', end: e || '' };
}

// 勤務日変更の申告/即変更処理
async function processPendingDayChanges(empId, pendings, reason, mode, requestedBy) {
  let processedCount = 0;
  for (const p of pendings) {
    const targetDate = fmtDate(p.year, p.month, p.day);
    if (mode === 'request') {
      await addChangeRequest({
        emp_id: empId,
        type: 'day_change',
        target_date: targetDate,
        from_state: p.from,
        to_state: p.to,
        from_time: p.fromTime ? parseTimeRange(p.fromTime) : null,
        to_time: p.toTime ? parseTimeRange(p.toTime) : null,
        reason_category: reason.category,
        reason_note: reason.note,
        requested_by: requestedBy || 'admin',
      });
    } else {
      // 即変更：勤務計画更新 + 履歴記録 + 本人通知
      let newDayData;
      if (p.to === 'work') {
        const toRange = p.toTime ? parseTimeRange(p.toTime) : null;
        newDayData = toRange && toRange.start ? toRange : { start: '09:00', end: '17:00' };
      } else {
        newDayData = null;
      }
      await updateDailyPlanCell(empId, p.year, p.month, p.day, newDayData);
      const hist = await addChangeHistory({
        emp_id: empId,
        type: 'day_change',
        target_date: targetDate,
        from_state: p.from,
        to_state: p.to,
        from_time: p.fromTime ? parseTimeRange(p.fromTime) : null,
        to_time: p.toTime ? parseTimeRange(p.toTime) : null,
        reason_category: reason.category,
        reason_note: reason.note,
        change_type: 'admin',
        request_id: null,
      });
      const fromTxt = p.from === 'work' ? `出勤日(${p.fromTime || ''})` : '休日';
      const toTxt = p.to === 'work' ? `出勤日${p.toTime ? '(' + p.toTime + ')' : ''}` : '休日';
      await addEmployeeNotification(empId, {
        type: 'day_change_admin',
        target_date: targetDate,
        message: `${targetDate} の勤務日が変更されました：${fromTxt} → ${toTxt}`,
        related_history_id: hist.history_id,
      });
    }
    processedCount++;
  }
  return processedCount;
}

// 勤務時間変更の申告/即変更処理
async function processPendingTimeChanges(empId, pendings, reason, mode, requestedBy) {
  let processedCount = 0;
  for (const p of pendings) {
    const targetDate = fmtDate(p.year, p.month, p.day);
    if (mode === 'request') {
      await addChangeRequest({
        emp_id: empId,
        type: 'time_change',
        target_date: targetDate,
        from_state: 'work',
        to_state: 'work',
        from_time: p.from,
        to_time: p.to,
        reason_category: reason.category,
        reason_note: reason.note,
        requested_by: requestedBy || 'admin',
      });
    } else {
      await updateDailyPlanCell(empId, p.year, p.month, p.day, { start: p.to.start, end: p.to.end });
      const hist = await addChangeHistory({
        emp_id: empId,
        type: 'time_change',
        target_date: targetDate,
        from_state: 'work',
        to_state: 'work',
        from_time: p.from,
        to_time: p.to,
        reason_category: reason.category,
        reason_note: reason.note,
        change_type: 'admin',
        request_id: null,
      });
      await addEmployeeNotification(empId, {
        type: 'time_change_admin',
        target_date: targetDate,
        message: `${targetDate} の勤務時間が変更されました：${p.from.start}〜${p.from.end} → ${p.to.start}〜${p.to.end}`,
        related_history_id: hist.history_id,
      });
    }
    processedCount++;
  }
  return processedCount;
}

// 該当日が申請中かどうか（change_requests未実装のため現時点はfalse）
function isDayRequested(empId, year, month, day) {
  if (!state.change_requests) return false;
  const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  return state.change_requests.some(r =>
    r.emp_id === empId && r.status === 'pending' && r.target_date === dateStr
  );
}

// 該当日が承認済み変更かどうか（change_history未実装のため現時点はfalse）
function isDayApprovedChange(empId, year, month, day) {
  if (!state.change_history) return false;
  const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  return state.change_history.some(h =>
    h.emp_id === empId && h.target_date === dateStr
  );
}
