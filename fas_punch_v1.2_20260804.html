      </table>

      <div class="cal-legend">
        <div class="cal-legend-item"><span class="cal-legend-swatch" style="background:#e8f4ee;"></span>出勤日（変更可）</div>
        <div class="cal-legend-item"><span class="cal-legend-swatch" style="background:#f5f5f5;"></span>休日（変更不可・🔄勤務日変更へ）</div>
        <div class="cal-legend-item"><span class="cal-legend-swatch" style="background:var(--blue-light); border-color:var(--blue);"></span>編集中</div>
        <div class="cal-legend-item"><span class="cal-legend-swatch" style="background:var(--purple-light); border-color:var(--purple);"></span>変更予定</div>
      </div>
  `;

  // 時刻編集パネル（編集中の日があれば表示）
  if (state._editingDay && state._editingYM &&
      state._editingYM.year === year && state._editingYM.month === month) {
    const editDay = state._editingDay;
    const origData = days[editDay];
    if (origData && origData.start && origData.end) {
      const editNew = state._editingNewTime || { start: origData.start, end: origData.end };
      // 実労働時間計算
      const c = calcLaborMinutes(editNew.start, editNew.end);
      const dt = new Date(year, month - 1, editDay);
      const wd = ['日','月','火','水','木','金','土'][dt.getDay()];
      html += `
        <div class="time-edit-panel">
          <h3>📝 ${month}/${editDay}(${wd}) の時刻を編集</h3>
          <div class="time-edit-row">
            <label>出勤：</label>
            <div class="original">${origData.start}</div>
            <span class="arrow">→</span>
            <input type="time" value="${editNew.start}" data-action="ptc-change-start-time" />
          </div>
          <div class="time-edit-row">
            <label>退勤：</label>
            <div class="original">${origData.end}</div>
            <span class="arrow">→</span>
            <input type="time" value="${editNew.end}" data-action="ptc-change-end-time" />
            <span class="calculated">実労働 ${formatHMin(c.netMin)}</span>
          </div>
          <div class="time-edit-buttons">
            <button class="btn-cancel" data-action="ptc-cancel-edit">キャンセル</button>
            <button class="btn-add" data-action="ptc-add-pending">💾 変更予定に追加</button>
          </div>
        </div>
      `;
    }
  } else {
    html += `<div class="time-edit-empty">💡 上のカレンダーから時刻を変更したい日（出勤日）をタップしてください</div>`;
  }

  // 選択中変更リスト
  const thisMonthPending = state._pendingTimeChanges.filter(p => p.year === year && p.month === month);
  const allPending = state._pendingTimeChanges;
  html += `<div class="pending-list">`;
  html += `<h3>📋 選択中の変更（${allPending.length}件）</h3>`;
  if (allPending.length === 0) {
    html += `<div class="pending-list-empty">時刻を変更したい日を選んで編集 → 「💾 変更予定に追加」してください</div>`;
  } else {
    allPending.sort((a, b) => (a.year - b.year) || (a.month - b.month) || (a.day - b.day)).forEach(p => {
      const dt = new Date(p.year, p.month - 1, p.day);
      const wd = ['日','月','火','水','木','金','土'][dt.getDay()];
      const cFrom = calcLaborMinutes(p.from.start, p.from.end);
      const cTo = calcLaborMinutes(p.to.start, p.to.end);
      const diffMin = cTo.netMin - cFrom.netMin;
      const diffLabel = diffMin === 0 ? '' :
        (diffMin > 0 ? `<span style="color:var(--orange);">+${formatHMin(diffMin)}</span>` : `<span style="color:var(--red);">${formatHMin(diffMin)}</span>`);
      html += `
        <div class="pending-row">
          <div class="date">${p.month}/${p.day}(${wd})</div>
          <div class="change-summary">
            ⏰ ${p.from.start}〜${p.from.end} (${formatHMin(cFrom.netMin)})
            <span class="change-arrow-inline">→</span>
            ${p.to.start}〜${p.to.end} (${formatHMin(cTo.netMin)}) ${diffLabel}
          </div>
          <button class="remove-btn" data-action="ptc-remove-pending" data-day="${p.day}" data-year="${p.year}" data-month="${p.month}">✕ 取消</button>
        </div>
      `;
    });
  }
  html += `</div>`;

  // 理由
  const r = state._planChangeReason;
  html += `
    <div class="reason-section">
      <h3>📝 変更理由</h3>
      <div class="reason-row">
        <label>カテゴリ：</label>
        <select data-action="ptc-change-reason-category">
          <option ${r.category === '本人都合' ? 'selected' : ''}>本人都合</option>
          <option ${r.category === '会社都合' ? 'selected' : ''}>会社都合</option>
          <option ${r.category === '体調不良' ? 'selected' : ''}>体調不良</option>
          <option ${r.category === '行事・冠婚葬祭' ? 'selected' : ''}>行事・冠婚葬祭</option>
          <option ${r.category === 'その他' ? 'selected' : ''}>その他</option>
        </select>
      </div>
      <div class="reason-row">
        <label>メモ：</label>
        <input type="text" placeholder="例：早朝便対応のため早出シフト" value="${(r.note || '').replace(/"/g, '&quot;')}" data-action="ptc-change-reason-note" />
      </div>
    </div>
  `;

  // 変更方式（originに応じた固定表示・切替不可）
  const mode = state._planChangeMode;
  const modeBoxStyle = mode === 'request'
    ? 'background:var(--blue-light); border-left:4px solid var(--blue); padding:12px 16px; border-radius:8px;'
    : 'background:var(--orange-light); border-left:4px solid var(--orange); padding:12px 16px; border-radius:8px;';
  const modeIcon = mode === 'request' ? '📤' : '⚡';
  const modeLabel = mode === 'request' ? '本人申告として登録' : '即変更（管理者権限）';
  const modeDesc = mode === 'request' ? '管理者承認後に反映されます' : '即時に勤務計画に反映され、本人通知が作成されます';
  html += `
    <div class="mode-section">
      <h3>⚙️ 変更方式</h3>
      <div style="${modeBoxStyle}">
        <div style="font-weight:bold; font-size:1.05rem;">${modeIcon} ${modeLabel}</div>
        <div style="font-size:0.85rem; color:#666; margin-top:4px;">${modeDesc}</div>
      </div>
    </div>
  `;

  // 実行ボタン
  const totalPending = allPending.length;
  const submitLabel = mode === 'request' ? `📤 申告する（${totalPending}件）` : `⚡ 即変更する（${totalPending}件）`;
  const submitClass = mode === 'request' ? 'submit-btn-apply' : 'submit-btn-immediate';
  const disabled = totalPending === 0 ? 'disabled' : '';
  html += `
    <div class="submit-section">
      <button class="submit-btn-cancel" data-action="ptc-clear-all" ${disabled}>全てクリア</button>
      <button class="${submitClass}" data-action="ptc-submit" ${disabled}>${submitLabel}</button>
    </div>
    </div>
  `;
  return html;
}

// 申請カード単体のHTML生成
function renderRequestCard(req) {
  // 【2026-08-16 v2.1】早出・延長の申告は中身が違うので、先に別で描く。
  // 既存の勤務計画変更（day_change / time_change）は from_time / to_time を持つが、
  // 申告は minutes を持つ。同じ描き方をすると落ちる。
  if (req.type === 'early' || req.type === 'overtime') return renderDeclareRequestCard(req);
  const isDay = req.type === 'day_change';
  const typeClass = isDay ? 'day-type' : 'time-type';
  const badgeClass = isDay ? 'day' : 'time';
  const badgeIcon = isDay ? '🔄 勤務日変更' : '⏰ 勤務時間変更';

  // 対象日表示（YYYY/MM/DD (曜)）
  const [y, m, d] = req.target_date.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const wd = ['日','月','火','水','木','金','土'][dt.getDay()];
  const targetDateStr = `${y}/${String(m).padStart(2,'0')}/${String(d).padStart(2,'0')} (${wd})`;

  // 申請日時表示
  const requestedAt = new Date(req.requested_at);
  const reqDateStr = `${requestedAt.getMonth() + 1}/${requestedAt.getDate()} ${String(requestedAt.getHours()).padStart(2,'0')}:${String(requestedAt.getMinutes()).padStart(2,'0')}`;

  // 変更内容表示
  let changeText = '';
  if (isDay) {
    const fromTxt = req.from_state === 'work'
      ? `⬜ 出勤日 ${req.from_time ? `(${req.from_time.start}〜${req.from_time.end})` : ''}`
      : '▫️ 休日';
    const toTxt = req.to_state === 'work'
      ? `⬜ 出勤日 ${req.to_time && req.to_time.start ? `(${req.to_time.start}〜${req.to_time.end})` : '(標準パターン)'}`
      : '▫️ 休日';
    changeText = `${fromTxt} <span class="arrow">→</span> ${toTxt}`;
  } else {
    // 時刻変更：実労働時間差分も表示
    const fc = calcLaborMinutes(req.from_time.start, req.from_time.end);
    const tc = calcLaborMinutes(req.to_time.start, req.to_time.end);
    const diff = tc.netMin - fc.netMin;
    let diffLabel = '';
    if (diff !== 0) {
      const cls = diff > 0 ? 'plus' : 'minus';
      const sign = diff > 0 ? '+' : '';
      diffLabel = `<span class="diff ${cls}">実労働 ${sign}${formatHMin(diff)}</span>`;
    }
    changeText = `⏰ ${req.from_time.start}〜${req.from_time.end} (${formatHMin(fc.netMin)}) <span class="arrow">→</span> ${req.to_time.start}〜${req.to_time.end} (${formatHMin(tc.netMin)})${diffLabel}`;
  }

  // 理由カテゴリのクラス名（特殊文字を除去）
  const catClass = 'cat-' + (req.reason_category || '').replace(/[・]/g, '');

  return `
    <div class="req-card ${typeClass}">
      <div class="req-card-header">
        <span class="req-type-badge ${badgeClass}">${badgeIcon}</span>
        <span class="req-target-date">${targetDateStr}</span>
        <span class="req-time">申請：${reqDateStr}</span>
      </div>
      <div class="req-change">${changeText}</div>
      <div class="req-reason">
        <span class="reason-cat ${catClass}">${req.reason_category || ''}</span>
        <span class="reason-note">${req.reason_note || '（メモなし）'}</span>
      </div>
      <div class="req-actions">
        <button class="btn-reject" data-action="reject-request" data-request-id="${req.request_id}">❌ 却下</button>
        <button class="btn-approve" data-action="approve-request" data-request-id="${req.request_id}">✅ 承認する</button>
      </div>
    </div>
  `;
}

// 申請を承認する処理
async function approveChangeRequest(requestId) {
  const req = state.change_requests.find(r => r.request_id === requestId);
  if (!req || req.status !== 'pending') return null;

  // ステータス更新
  req.status = 'approved';
  req.approved_by = 'admin';
  req.approved_at = nowISO();

  // 履歴追加
  const hist = await addChangeHistory({
    emp_id: req.emp_id,
    type: req.type,
    target_date: req.target_date,
    from_state: req.from_state,
    to_state: req.to_state,
    from_time: req.from_time,
    to_time: req.to_time,
    reason_category: req.reason_category,
    reason_note: req.reason_note,
    change_type: 'request',
    request_id: req.request_id,
  });

  // 勤務計画更新
  const [y, m, d] = req.target_date.split('-').map(Number);
  let newDayData;
  if (req.type === 'day_change') {
    if (req.to_state === 'work') {
      newDayData = (req.to_time && req.to_time.start)
        ? { start: req.to_time.start, end: req.to_time.end }
        : { start: '09:00', end: '17:00' };
    } else {
      newDayData = null; // 休日
    }
  } else {
    // time_change
    newDayData = { start: req.to_time.start, end: req.to_time.end };
  }
  await updateDailyPlanCell(req.emp_id, y, m, d, newDayData);

  // 本人通知（承認）
  const msg = formatChangeMessage(req);
  await addEmployeeNotification(req.emp_id, {
    type: req.type + '_approved',
    target_date: req.target_date,
    message: `✅ ${req.target_date} の変更申請が承認されました：${msg}`,
    related_history_id: hist.history_id,
  });

  // 永続化
  await saveData(STORAGE_KEYS.CHANGE_REQUESTS, state.change_requests);
  return hist;
}

// 申請を却下する処理
async function rejectChangeRequest(requestId, rejectReason) {
  const req = state.change_requests.find(r => r.request_id === requestId);
  if (!req || req.status !== 'pending') return null;

  req.status = 'rejected';
  req.approved_by = 'admin';
  req.approved_at = nowISO();
  req.reject_reason = rejectReason || '';

  // 履歴に却下記録（change_type: 'rejected'）
  await addChangeHistory({
    emp_id: req.emp_id,
    type: req.type,
    target_date: req.target_date,
    from_state: req.from_state,
    to_state: req.to_state,
    from_time: req.from_time,
    to_time: req.to_time,
    reason_category: req.reason_category,
    reason_note: req.reason_note,
    change_type: 'rejected',
    request_id: req.request_id,
    reject_reason: rejectReason || '',
  });

  // 本人通知（却下）
  const msg = formatChangeMessage(req);
  const rrSuffix = rejectReason ? ` / 却下理由：${rejectReason}` : '';
  await addEmployeeNotification(req.emp_id, {
    type: req.type + '_rejected',
    target_date: req.target_date,
    message: `❌ ${req.target_date} の変更申請が却下されました：${msg}${rrSuffix}`,
  });

  await saveData(STORAGE_KEYS.CHANGE_REQUESTS, state.change_requests);
  return true;
}

// 変更内容を文字列にまとめる（通知メッセージ用）
function formatChangeMessage(req) {
  if (req.type === 'day_change') {
    const fromTxt = req.from_state === 'work'
      ? `出勤(${req.from_time ? req.from_time.start + '〜' + req.from_time.end : ''})`
      : '休日';
    const toTxt = req.to_state === 'work'
      ? `出勤${req.to_time && req.to_time.start ? '(' + req.to_time.start + '〜' + req.to_time.end + ')' : ''}`
      : '休日';
    return `${fromTxt} → ${toTxt}`;
  } else {
    return `${req.from_time.start}〜${req.from_time.end} → ${req.to_time.start}〜${req.to_time.end}`;
  }
}

// 承認待ち件数（全体）を取得
function getTotalPendingCount() {
  if (!state.change_requests) return 0;
  return state.change_requests.filter(r => r.status === 'pending').length;
}

function getUnreadNotificationCount(empId) {

// 通知を既読にする
async function markNotificationAsRead(notifId) {
  const notif = state.employee_notifications.find(n => n.notif_id === notifId);
  if (!notif) return;
  notif.read = true;
  notif.read_at = nowISO();
  await saveData(STORAGE_KEYS.EMPLOYEE_NOTIFICATIONS, state.employee_notifications);
}

// 通知タイプから表示用ラベル＆アイコン＆色を取得
function getNotifTypeMeta(type) {
  if (type && type.endsWith('_approved')) {
    return { icon: '✅', label: '変更申請が承認されました', cls: 'approved' };
  }
  if (type && type.endsWith('_rejected')) {
    return { icon: '❌', label: '変更申請が却下されました', cls: 'rejected' };
  }
  if (type && type.endsWith('_admin')) {
    if (type.startsWith('day_')) {
      return { icon: '⚡', label: '勤務日が変更されました', cls: 'admin' };
    }
    return { icon: '⚡', label: '勤務時間が変更されました', cls: 'admin' };
  }
  return { icon: '📩', label: 'お知らせ', cls: 'admin' };
}

// 通知メッセージから「日付・変更内容」を抽出して整形（messageは元の長い文字列）
function formatNotifBody(notif) {
  // messageに既に整形済みの文字列が入っているのでそれを使用
  // 例: "✅ 2026-05-27 の変更申請が承認されました：出勤(09:00〜17:00) → 休日"
  // ヘッダー部分はタイプアイコンで表示済みなので、本文は対象日と変更内容だけ抽出
  const msg = notif.message || '';
  // "：" 以降を抽出（変更内容部分）
  const colonIdx = msg.indexOf('：');
  const changeText = colonIdx >= 0 ? msg.substring(colonIdx + 1).trim() : msg;
  const targetDate = notif.target_date || '';
  return { targetDate, changeText };
}

// 初期フィルター（今月）
function defaultHistoryFilter() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const firstDay = `${y}-${String(m).padStart(2,'0')}-01`;
  const lastDay = new Date(y, m, 0).getDate();
  const lastDayStr = `${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  return {
    from: firstDay,
    to: lastDayStr,
    emp_id: '', // ''=全員
    type_day: true,
    type_time: true,
    mode_approved: true,
    mode_admin: true,
    mode_rejected: true,
  };
}

// 履歴をフィルタリング
function filterChangeHistory(hist, filter) {
  return hist.filter(h => {
    // 期間
    if (filter.from && h.target_date < filter.from) return false;
    if (filter.to && h.target_date > filter.to) return false;
    // 個人
    if (filter.emp_id && h.emp_id !== filter.emp_id) return false;
    // タイプ
    if (h.type === 'day_change' && !filter.type_day) return false;
    if (h.type === 'time_change' && !filter.type_time) return false;
    // 種別
    if (h.change_type === 'request' && !filter.mode_approved) return false;
    if (h.change_type === 'admin' && !filter.mode_admin) return false;
    if (h.change_type === 'rejected' && !filter.mode_rejected) return false;
    return true;
  });
}

// 変更内容を表示用テキストに変換
function formatHistoryChangeText(h) {
  if (h.type === 'day_change') {
    const fromTxt = h.from_state === 'work'
      ? `出勤(${h.from_time ? h.from_time.start + '〜' + h.from_time.end : ''})`
      : '休日';
    const toTxt = h.to_state === 'work'
      ? `出勤${h.to_time && h.to_time.start ? '(' + h.to_time.start + '〜' + h.to_time.end + ')' : '(標準)'}`
      : '休日';
    return `${fromTxt} <span class="arrow">→</span> ${toTxt}`;
  } else {
    // time_change
    const fc = h.from_time ? calcLaborMinutes(h.from_time.start, h.from_time.end) : null;
    const tc = h.to_time ? calcLaborMinutes(h.to_time.start, h.to_time.end) : null;
    const fromStr = h.from_time ? `${h.from_time.start}〜${h.from_time.end}${fc ? ' (' + formatHMin(fc.netMin) + ')' : ''}` : '-';
    const toStr = h.to_time ? `${h.to_time.start}〜${h.to_time.end}${tc ? ' (' + formatHMin(tc.netMin) + ')' : ''}` : '-';
    return `${fromStr} <span class="arrow">→</span> ${toStr}`;
  }
}

// 履歴をCSV形式に変換
function historyToCSV(historyList) {
  const headers = [
    '変更日時', '従業員名', '種別', '変更タイプ', '対象日',
    '変更前', '変更後', '理由カテゴリ', '理由メモ',
    '申請者', '承認者', '申請日時', '承認日時', '却下理由'
  ];
  const rows = [headers];
  historyList.forEach(h => {
    const emp = state.employees.find(e => e.id === h.emp_id);
    const empName = emp ? emp.name : h.emp_id;
    const modeLabel = h.change_type === 'request' ? '承認済み'
                    : h.change_type === 'admin' ? '即変更'
                    : h.change_type === 'rejected' ? '却下'
                    : h.change_type;
    const typeLabel = h.type === 'day_change' ? '勤務日変更' : '勤務時間変更';
    const fromStr = h.type === 'day_change'
      ? (h.from_state === 'work' ? `出勤(${h.from_time ? h.from_time.start + '-' + h.from_time.end : ''})` : '休日')
      : (h.from_time ? `${h.from_time.start}-${h.from_time.end}` : '');
    const toStr = h.type === 'day_change'
      ? (h.to_state === 'work' ? `出勤${h.to_time && h.to_time.start ? '(' + h.to_time.start + '-' + h.to_time.end + ')' : '(標準)'}` : '休日')
      : (h.to_time ? `${h.to_time.start}-${h.to_time.end}` : '');
    // 申請情報（change_requestsから取得）
    let requestedBy = '', approvedBy = '', requestedAt = '', approvedAt = '';
    if (h.request_id) {
      const req = state.change_requests.find(r => r.request_id === h.request_id);
      if (req) {
        requestedBy = req.requested_by || '';
        approvedBy = req.approved_by || '';
        requestedAt = req.requested_at || '';
        approvedAt = req.approved_at || '';
      }
    } else {
      // 即変更：申請者=即変更者、承認者=同じ
      requestedBy = h.changed_by || '';
      approvedBy = h.changed_by || '';
      approvedAt = h.changed_at || '';
    }
    rows.push([
      h.changed_at || '',
      empName,
      modeLabel,
      typeLabel,
      h.target_date || '',
      fromStr,
      toStr,
      h.reason_category || '',
      h.reason_note || '',
      requestedBy,
      approvedBy,
      requestedAt,
      approvedAt,
      h.reject_reason || ''
    ]);
  });
  // CSVエスケープ：ダブルクオート囲み、内部のクオートは2重化
  return rows.map(row =>
    row.map(cell => {
      const s = String(cell == null ? '' : cell);
      if (s.includes(',') || s.includes('"') || s.includes('\n')) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }).join(',')
  ).join('\r\n');
}

// CSVファイルをダウンロード
function downloadHistoryCSV(historyList) {
  const csv = historyToCSV(historyList);
  // UTF-8 BOM付き（Excel対応）
  const bom = '\uFEFF';
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const now = new Date();
  const ymd = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  a.href = url;
  a.download = `変更履歴_${ymd}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// 現在の所得年度（getCurrentIncomeYearCycle().incomeYear と同等）
function currentIncomeYear() {
  return getCurrentIncomeYearCycle().incomeYear;
}

// 個人の現在の年度計画を取得（なければ null）
function findLaborPlan(empId, incomeYear) {
  if (!state.labor_plan) state.labor_plan = [];
  return state.labor_plan.find(p => p.emp_id === empId && p.income_year === incomeYear) || null;
}

// 計画から年間総枠時間を算出（扶養内：所得÷時給、扶養外：直接入力）
function calcAnnualCapHours(plan, hourlyRate) {
  if (!plan) return 0;
  if (plan.fuyo_type === 'inside') {
    if (!hourlyRate || hourlyRate <= 0) return 0;
    return Math.floor(plan.income_target / hourlyRate);
  } else {
    return plan.annual_cap_hours || 0;
  }
}

// 「年内所得対象期間」の月度リストを返す（12ヶ月分）
function getIncomeYearMonths() {
  const s = getPayrollSettings();
  const incomeYear = currentIncomeYear();
  const startMonth = s.income_year_start_month;
  const endMonth = s.income_year_end_month;
  const spansYear = startMonth > endMonth;
  const months = [];
  // 開始月度〜終了月度を12ヶ月分列挙
  let y = spansYear ? incomeYear - 1 : incomeYear;
  let m = startMonth;
  for (let i = 0; i < 12; i++) {
    months.push({ year: y, month: m, key: `${y}-${String(m).padStart(2,'0')}` });
    m++;
    if (m > 12) { m = 1; y++; }
    if (months.length > 12) break;
  }
  return months;
}

          <div style="flex:1;">
            <div style="font-weight:bold; font-size:1.02rem;">${emp.name}</div>
            <div style="font-size:0.78rem; color:#666;">時給 ¥${(emp.hourly_rate || 0).toLocaleString()} ／ ${emp.location || '-'}</div>
          </div>
        </div>
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;">
          ${fuyoBadge}
          ${planBadge}
          ${rateAlertBadge}
        </div>
        ${plan ? `
          <div style="font-size:0.85rem; color:#666; margin-top:6px;">
            ${plan.fuyo_type === 'inside'
              ? `目標：¥${plan.income_target.toLocaleString()} ／ 総枠：${s.capH}h`

// 個人別計画 編集画面
function renderLaborPlanEdit() {
  const empId = state._laborPlanEmpId;
  const emp = state.employees.find(e => e.id === empId);
  if (!emp) return `<div class="card"><p>個人が見つかりません</p></div>`;
  const incomeYear = currentIncomeYear();
  const incomeYearCycle = getCurrentIncomeYearCycle();
  // 既存計画 or 新規作成のドラフト
  const existing = findLaborPlan(empId, incomeYear);
  const fuyo = emp.fuyo_type || 'inside';
  // バッファ（編集中の値）
  if (!state._laborPlanBuf) {
    state._laborPlanBuf = existing
      ? { ...existing, monthly_plans: { ...(existing.monthly_plans || {}) } }
      : {
          emp_id: empId,
          income_year: incomeYear,
          fuyo_type: fuyo,
          income_target: fuyo === 'inside' ? 1300000 : 0,
          annual_cap_hours: fuyo === 'outside' ? 1800 : 0,
          monthly_plans: {},
        };
  }
  const buf = state._laborPlanBuf;
  const capH = calcAnnualCapHours(buf, emp.hourly_rate);
  const months = getIncomeYearMonths();
  // 月別計画の合計
  let monthlyTotal = 0;
  for (const m of months) {
    monthlyTotal += parseInt(buf.monthly_plans[m.key] || 0, 10);
  }
  const remaining = capH - monthlyTotal;
  const fuyoBadge = fuyo === 'inside'
    ? '<span style="background:var(--green-bg); color:var(--green); padding:3px 10px; border-radius:10px; font-size:0.85rem; font-weight:bold;">扶養範囲内</span>'
    : '<span style="background:var(--orange-light); color:var(--orange); padding:3px 10px; border-radius:10px; font-size:0.85rem; font-weight:bold;">扶養範囲外</span>';
  // 法定上限（参考表示）
  const legal = state.app_settings?.legal_limits || DEFAULT_APP_SETTINGS.legal_limits;
  let html = `
    <div class="nav-row">
      <button class="nav-btn" data-action="back-labor-plan-index">← 個人選択へ戻る</button>
    </div>
    <div class="card">
      <h2>📋 ${emp.name} さんの労働時間計画</h2>
      <div style="background:#fafafa; padding:14px 16px; border-radius:8px; margin-bottom:14px;">
        <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:center;">
          <div style="font-size:2rem;">${emp.emoji || '👤'}</div>
          <div style="flex:1; min-width:200px;">
            <div style="font-weight:bold; font-size:1.1rem;">${emp.name}</div>
            <div style="font-size:0.85rem; color:#666;">
              対象年度：${incomeYearCycle.label}（${incomeYearCycle.startStr} 〜 ${incomeYearCycle.endStr}）<br>
              時給：¥${(emp.hourly_rate || 0).toLocaleString()} ／ 拠点：${emp.location || '-'}
            </div>
          </div>
          <div>${fuyoBadge}</div>
        </div>
      </div>
  `;
  if (fuyo === 'inside') {
    // 扶養内：目標所得入力＋年間総枠の自動算出
    // 時給変動の検出（計画保存時の時給 vs 現在時給）
    const snapRate = existing?.snapshot_hourly_rate;
    const currentRate = emp.hourly_rate || 0;
    const rateChanged = snapRate && snapRate !== currentRate;
    let rateChangeAlert = '';
    if (rateChanged) {
      const oldCapH = Math.floor((buf.income_target || 0) / snapRate);
      const newCapH = Math.floor((buf.income_target || 0) / currentRate);
      const diff = newCapH - oldCapH;
      const diffSign = diff >= 0 ? '+' : '';
      const diffColor = diff < 0 ? 'var(--red)' : 'var(--green)';
      rateChangeAlert = `
        <div style="background:#fff3e0; border-left:4px solid var(--orange); padding:14px 16px; border-radius:8px; margin:14px 0;">
          <div style="font-weight:bold; color:var(--orange); margin-bottom:6px;">⚠️ 時給が変動しています</div>
          <div style="font-size:0.9rem; color:#555;">
            計画保存時の時給：¥${snapRate.toLocaleString()}<br>
            現在の時給：¥${currentRate.toLocaleString()}<br>
            年間総枠の加減：<strong style="color:${diffColor}; font-size:1.05rem;">${diffSign}${diff}h</strong>（${oldCapH}h → ${newCapH}h）
          </div>
          <div style="font-size:0.82rem; color:#666; margin-top:6px;">
            💡 時給が上がった場合、同じ目標所得でも使える時間が減ります。月別計画の見直しを検討してください。<br>
            💡 計画を保存し直すと、現在時給がスナップショットに反映されます。
          </div>
        </div>
      `;
    }
    html += `
      <div class="emp-form">
        ${rateChangeAlert}
        <div class="form-row">
          <label class="form-label">💰 目標所得（年内累計）</label>
          <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
            <select data-action="labor-plan-target-preset" style="min-width:160px;">
              <option value="">プリセット選択...</option>
              <option value="1230000">123万円（税の壁）</option>
              <option value="1300000">130万円（社保扶養の壁）</option>
              <option value="1500000">150万円（配偶者特別控除）</option>
              <option value="custom">カスタム入力</option>
            </select>
            <input type="number" id="labor-plan-target" value="${buf.income_target || 0}" min="0" max="3000000" step="10000" style="width:140px;" data-action="labor-plan-target-input" />
            <span style="font-size:0.9rem;">円</span>
          </div>
          <div class="form-hint">扶養範囲内に収めたい目標年収。これを時給で割って年間総枠を算出します</div>
        </div>

        <div style="background:var(--green-bg); padding:14px 16px; border-radius:8px; margin:14px 0; border-left:4px solid var(--green);">
          <div style="font-size:0.85rem; color:#666; margin-bottom:6px;">📊 自動算出された年間総枠</div>
          <div style="font-size:1.5rem; font-weight:bold; color:var(--green);">
            ¥${(buf.income_target || 0).toLocaleString()} ÷ ¥${(emp.hourly_rate || 0).toLocaleString()} = <strong>${capH}h</strong>
          </div>
          <div style="font-size:0.85rem; color:#666; margin-top:4px;">
            月平均 ≒ ${Math.round(capH / 12)}h／月度
          </div>
        </div>
      </div>
    `;
  } else {
    // 扶養外：年間総枠時間を直接入力＋法定上限の参考表示
    html += `
      <div class="emp-form">
        <div class="form-row">
          <label class="form-label">⏱️ 年間総枠時間（計画上限）</label>
          <div style="display:flex; gap:10px; align-items:center;">
            <input type="number" id="labor-plan-cap" value="${buf.annual_cap_hours || 0}" min="0" max="2500" step="10" style="width:120px;" data-action="labor-plan-cap-input" />
            <span style="font-size:0.9rem;">時間</span>
          </div>
          <div class="form-hint">自社の人件費予算や健康管理上の上限。月平均 ≒ ${Math.round((buf.annual_cap_hours || 0) / 12)}h／月度</div>
        </div>

        <div style="background:var(--orange-light); padding:14px 16px; border-radius:8px; margin:14px 0; border-left:4px solid var(--orange);">
          <div style="font-size:0.85rem; color:#666; margin-bottom:6px;">📊 計画上限の参考情報</div>
          <div style="font-size:1.1rem; margin-bottom:4px;">
            年間人件費見込み：<strong>¥${((buf.annual_cap_hours || 0) * (emp.hourly_rate || 0)).toLocaleString()}</strong>
          </div>
          <div style="font-size:0.85rem; color:#666;">
            ⚖️ 法定上限（36協定・全社共通）：月の時間外 ${legal.overtime_monthly}h ／ 年の時間外 ${legal.overtime_annual}h<br>
            ${legal.use_special_clause ? `特別条項：月${legal.special_monthly}h未満 ／ 年${legal.special_annual}h` : '（特別条項：未使用）'}<br>
            繁忙期に計画を超える稼働が必要な時は、この範囲内で残業可能
          </div>
        </div>
      </div>
    `;
  }
  // 月別計画テーブル
  html += `
      <h3 style="margin-top:18px; border-bottom:2px solid var(--green-light); padding-bottom:6px;">📅 月別計画</h3>
      <div class="form-hint" style="margin-bottom:10px;">
        💡 ${incomeYearCycle.label} の月度ごとに計画時間を入力してください。<br>
        💡 月別合計が年間総枠と一致するよう調整しましょう。
      </div>
      <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:0.9rem;">
          <thead>
            <tr style="background:#eaeaea;">
              <th style="padding:8px; text-align:left;">月度</th>
              <th style="padding:8px; text-align:left;">計画時間</th>
              <th style="padding:8px; text-align:left;">月平均比</th>
            </tr>
          </thead>
          <tbody>
  `;
  const avgPerMonth = capH > 0 ? capH / 12 : 0;
  for (const m of months) {
    const planH = parseInt(buf.monthly_plans[m.key] || 0, 10);
    const ratio = avgPerMonth > 0 ? Math.round(planH / avgPerMonth * 100) : 0;
    const ratioColor = ratio > 130 ? 'var(--red)' : ratio > 110 ? 'var(--orange)' : ratio < 70 ? '#999' : 'var(--green)';
    html += `
      <tr>
        <td style="padding:8px; border-bottom:1px solid #eee;">${m.year}年${m.month}月度</td>
        <td style="padding:8px; border-bottom:1px solid #eee;">
          <input type="number" min="0" max="300" step="5" value="${planH}" style="width:80px;" data-action="labor-plan-month-input" data-key="${m.key}" />
          <span style="font-size:0.85rem; color:#666;"> h</span>
        </td>
        <td style="padding:8px; border-bottom:1px solid #eee;">
          <span style="color:${ratioColor}; font-weight:bold;">${ratio}%</span>
        </td>
      </tr>
    `;
  }
  // 合計行
  const totalColor = monthlyTotal > capH ? 'var(--red)' : monthlyTotal < capH * 0.9 ? 'var(--orange)' : 'var(--green)';
  html += `
          </tbody>
          <tfoot>
            <tr style="background:#fafafa; font-weight:bold;">
              <td style="padding:10px;">月別合計</td>
              <td style="padding:10px; color:${totalColor};">${monthlyTotal}h</td>
              <td style="padding:10px;">
                ${capH > 0 ? `年間総枠 ${capH}h ／ 残り <strong style="color:${remaining < 0 ? 'var(--red)' : 'var(--green)'};">${remaining >= 0 ? '+' : ''}${remaining}h</strong>` : '年間総枠 未設定'}
              </td>
            </tr>
          </tfoot>
        </table>
      </div>

      <div class="form-actions" style="margin-top:20px;">
        <button class="primary-btn" data-action="save-labor-plan" style="background:var(--green);">💾 計画を保存</button>
        ${existing ? `<button class="nav-btn" data-action="delete-labor-plan" style="color:var(--red); border-color:var(--red);">🗑️ この計画を削除</button>` : ''}
      </div>
    </div>
  `;
  return html;
}

        <button class="nav-btn" data-action="go-daily-plan" style="background:var(--green-bg); color:var(--green); border-color:var(--green); font-weight:bold;">🗓️ 日別計画作成</button>
        <button class="nav-btn" data-action="go-plan-change" style="background:var(--orange-light); color:var(--orange); border-color:var(--orange); font-weight:bold;">⚡ 即変更(管理者)</button>
        <button class="nav-btn" data-action="go-change-history" style="background:#fafafa; color:#555; border-color:#999; font-weight:bold;">📜 全変更履歴</button>
        <button class="nav-btn" data-action="go-labor-plan" style="background:var(--green-bg); color:var(--green); border-color:var(--green); font-weight:bold;">📋 労働時間計画</button>
        <button class="nav-btn" data-action="go-shift-overview" style="background:#fff3e0; color:var(--orange); border-color:var(--orange); font-weight:bold;">📊 シフト一覧</button>
        <button class="nav-btn" data-action="go-punch-logs" style="background:#f3e5f5; color:#7b1fa2; border-color:#7b1fa2; font-weight:bold;">📋 打刻ログ詳細</button>
        <button class="nav-btn" data-action="go-punch-fix" style="background:#fff3e0; color:#e65100; border-color:#e65100; font-weight:bold;">🛠 打刻もれ修正</button>
        <button class="nav-btn" data-action="go-productivity" style="background:#e8eaf6; color:#3f51b5; border-color:#3f51b5; font-weight:bold;">📈 人時売上・人時生産性</button>
        <button class="nav-btn" data-action="go-spec-prices" style="background:#e0f7fa; color:#00838f; border-color:#00838f; font-weight:bold;">📏 規格別の単価</button>
        <button class="nav-btn" data-action="go-work-adjust" style="background:#fff8e1; color:#b87b00; border-color:#d9b347; font-weight:bold;">🕐 早出・延長の認定${(function(){const n=pendingDeclarations().length; return n>0?` <span style="background:var(--orange); color:#fff; border-radius:8px; padding:0 6px;">${n}</span>`:'';})()}</button>
        <button class="nav-btn" data-action="go-ajisai-prices" style="background:#fff8e1; color:#d9b347; border-color:#d9b347; font-weight:bold;">🏷 確定単価</button>
        <button class="nav-btn" data-action="go-tasks-master" style="background:#e0f2f1; color:#00897b; border-color:#00897b; font-weight:bold;">⚙️ 作業・品目マスタ</button>
        <button class="nav-btn" data-action="go-app-settings" style="background:#fafafa; color:#555; border-color:#999; font-weight:bold;">🔧 設定</button>
        <button class="nav-btn" data-action="go-reports" style="background:#ffebee; color:#c62828; border-color:#c62828; font-weight:bold;">📊 集計レポート</button>

          <input type="checkbox" id="show-retired" data-action="toggle-retired" ${state._showRetired ? 'checked' : ''} /> 退職者も表示
        </label>
      </div>
      <table><thead><tr><th>NO</th><th>顔</th><th>名前</th><th>月契約時間</th><th>拠点</th><th>状態</th><th>操作</th></tr></thead><tbody>
  `;
  const showAll = state._showRetired;
  const filteredEmps = employeesHere({ withRetired: showAll });
  for (const e of filteredEmps) {
    const st = e.status || 'active';
    const stLabel = st === 'active' ? '<span style="color:#1d9e75;">●在籍</span>' : '<span style="color:#888;">○退職</span>';
    const faceCell = e.photo 
      ? `<img src="${e.photo}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;" alt="" />`
      : `<span style="font-size:1.6rem;">${e.emoji}</span>`;
    const ch = e.monthly_contract_hours ? `${e.monthly_contract_hours}h` : '-';
    html += `<tr>
      <td>${e.id}</td>
      <td style="text-align:center;">${faceCell}</td>
      <td>${e.name}</td>
      <td>${ch}</td>
      <td>${e.location}</td>
      <td>${stLabel}</td>
      <td><button class="nav-btn" data-action="edit-employee" data-id="${e.id}" style="padding:4px 10px; font-size:0.85rem;">編集</button></td>
    </tr>`;
  }
  if (filteredEmps.length === 0) {
    html += `<tr><td colspan="7" class="empty-message">該当する従業員がいません</td></tr>`;
  }
  html += `</tbody></table>
    </div>
    <div class="card admin-section"><h2>📊 本日の個人別集計（${today}）</h2>
      <table><thead><tr><th>名前</th><th>労働時間</th><th>休憩時間</th><th>月契約</th></tr></thead><tbody>
  `;
  for (const s of summary) {
    const faceMini = s.photo 
      ? `<img src="${s.photo}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;" alt=""/>`
      : `${s.emoji} `;
    const ch = s.monthly_contract_hours ? `${s.monthly_contract_hours}h` : '-';
    html += `<tr><td>${faceMini}${s.name}</td><td>${formatMinutes(s.workMinutes)}</td><td>${formatMinutes(s.breakMinutes)}</td><td>${ch}</td></tr>`;
  }
  html += `</tbody></table></div>`;
  // 進行中セッション
  html += `<div class="card admin-section"><h2>🤝 進行中セッション（${state.active_sessions.filter(s => !s.ended_at).length}件）</h2>`;
  const activeS = state.active_sessions.filter(s => !s.ended_at);
  if (activeS.length === 0) {
    html += `<div class="empty-message">進行中のセッションはありません</div>`;
  } else {
    html += `<table><thead><tr><th>ID</th><th>作業</th><th>開始</th><th>メンバー</th></tr></thead><tbody>`;
    for (const s of activeS) {
      const w = state.work_items.find(x => x.id === s.work_item_id);
      const names = s.members.map(mid => {
        const e = state.employees.find(x => x.id === mid);
        return e ? e.name : mid;
      }).join('・');
      html += `<tr><td>${s.id.substring(0, 10)}…</td><td>${w ? w.emoji + w.name : ''}</td><td>${formatTime(s.started_at)}</td><td>${names}</td></tr>`;
    }
    html += `</tbody></table>`;
  }
  html += `</div>`;
  // 打刻ログ
  html += `<div class="card admin-section"><h2>📋 本日の打刻ログ（${todayLogs.length}件）</h2>`;
  if (todayLogs.length === 0) {
    html += `<div class="empty-message">本日の打刻はまだありません</div>`;
  } else {
    html += `<table><thead><tr><th>時刻</th><th>氏名</th><th>種別</th><th>作業</th><th>セッション</th></tr></thead><tbody>`;
    for (const log of todayLogs) {
      const emp = state.employees.find(e => e.id === log.employee_id);
      const work = log.work_item_id ? state.work_items.find(w => w.id === log.work_item_id) : null;
      const pt = PUNCH_TYPES[log.type];
      html += `<tr>
        <td>${formatTime(log.timestamp)}</td>
        <td>${emp ? emp.name : log.employee_id}</td>
        <td><span class="badge ${pt.badge}">${pt.label}</span></td>
        <td>${work ? `${work.emoji} ${work.name}` : '-'}</td>
        <td>${log.session_id ? '🤝' + log.session_id.substring(0, 8) : '単独'}</td>
      </tr>`;
    }
    html += `</tbody></table>`;
  }
  html += `</div>`;
  return html;
}

function attachHandlers() {
  document.querySelectorAll('[data-action]').forEach(el => {
    let evt = 'click';
    if (el.tagName === 'SELECT') evt = 'change';
    else if (el.tagName === 'INPUT' && (el.type === 'date' || el.type === 'number' || el.type === 'time')) evt = 'change';
    el.addEventListener(evt, handleClick);
  });
  // 写真アップロード input
  const photoInput = document.getElementById('ef-photo-file');
  if (photoInput) {
    photoInput.addEventListener('change', handlePhotoUpload);
  }
  // 日別編集のプレビュー
  const dayStart = document.getElementById('day-start');
  const dayEnd = document.getElementById('day-end');
  if (dayStart && dayEnd) {
    const updatePreview = () => {
      const s = dayStart.value, e = dayEnd.value;
      const preview = document.getElementById('day-calc-preview');
      if (!preview) return;
      if (!s || !e) { preview.textContent = '時刻を入力すると拘束・休憩・実労働が表示されます'; return; }
      if (parseTimeStr(s) >= parseTimeStr(e)) { preview.innerHTML = '<span style="color:var(--red);">終業は始業より後の時刻にしてください</span>'; return; }
      const c = calcLaborMinutes(s, e);
      preview.innerHTML = `拘束 <strong>${formatHMin(c.grossMin)}</strong> ／ 休憩 <strong>${c.breakMin > 0 ? c.breakMin + '分' : 'なし'}</strong> ／ 実労働 <strong style="color:var(--green);">${formatHMin(c.netMin)}</strong>`;
    };
    dayStart.addEventListener('input', updatePreview);
    dayEnd.addEventListener('input', updatePreview);
    updatePreview();  // 初期表示
  }
}

function handlePhotoUpload(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    alert('画像ファイルを選択してください');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      // 短辺で正方形にクロップ → 256×256に縮小 → JPEG圧縮
      const canvas = document.createElement('canvas');
      const maxSize = 256;
      const minSide = Math.min(img.width, img.height);
      const sx = (img.width - minSide) / 2;
      const sy = (img.height - minSide) / 2;
      canvas.width = maxSize;
      canvas.height = maxSize;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, maxSize, maxSize);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      // 保存
      document.getElementById('ef-photo').value = dataUrl;
      // プレビュー更新
      const preview = document.getElementById('photo-preview');
      if (preview) preview.innerHTML = `<img src="${dataUrl}" alt="顔写真" />`;
      // 削除ボタンを動的に追加（再renderはしない、入力中の他フィールドを保持するため）
      const controls = document.querySelector('.photo-controls');
      if (controls && !controls.querySelector('[data-action="remove-photo"]')) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'nav-btn';
        btn.dataset.action = 'remove-photo';
        btn.textContent = '写真を削除';
        btn.addEventListener('click', handleClick);
        controls.insertBefore(btn, controls.querySelector('.form-hint'));
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function handleClick(e) {
  const a = e.currentTarget.dataset.action;
  const id = e.currentTarget.dataset.id;
  const type = e.currentTarget.dataset.type;
  const pendingId = e.currentTarget.dataset.pendingId;

  if (a === 'select-employee') {
    state.current_employee_id = id;
    state.screen = 'personal';
    render();
  } else if (a === 'back-home') {
    state.screen = 'home';
    state.current_employee_id = null;
    state._selectedMembers = [];
    state._adminUnlocked = false;   // 共用端末なので、打刻画面に戻ったら管理画面は閉じる
    state._pinBuf = ''; state._pinError = '';
    render();
  } else if (a === 'back-personal') {
    state.screen = 'personal';
    state._selectedMembers = [];
    render();
  } else if (a === 'back-work-select') {
    state.screen = 'work_select';
    state._selectedMembers = [];
    render();
  } else if (a === 'go-admin') {
    if (!state._adminUnlocked) {
      state._pinBuf = ''; state._pinError = '';
      state.screen = 'admin_lock';
      render();
      return;
    }
    state.screen = 'admin';
    render();
  } else if (a === 'punch') {
    // セッションメンバーの場合、session_id付き打刻
    const st = getEmployeeStatus(state.current_employee_id);
    const sessionId = st.session_id || null;
    if (type === 'WORK_END' || type === 'BREAK' || type === 'END') {
      await punch(type, null, sessionId);
      await checkSessionEnding();
    } else {
      await punch(type, null, null);
    }
    // 【2026-08-16 v2.1】退勤したら、その場で早出・延長を聞く。
    // 予定どおりの日は何も出さない。「今はしない」を選べば、あとから自分の画面で出せる。
    if (type === 'END') {
      const f = findDeclarable(state.current_employee_id, new Date());
      if (f) {
        const canE = f.early_min > 0 && canDeclare(state.current_employee_id, f.date, 'early');
        const canO = f.overtime_min > 0 && canDeclare(state.current_employee_id, f.date, 'overtime');
        if (canE || canO) {
          state._declTarget = { ...f, canEarly: canE, canOvertime: canO };
          state._declReason = {};
          state.screen = 'ot_declare';
          render();
          return;
        }
      }
    }
    render();
  } else if (a === 'check-update-now') {
    await checkForUpdateNow();
  } else if (a === 'go-spec-prices') {
    state.screen = 'spec_prices';
    render();
  } else if (a === 'rebuild-spec-prices') {
    const w = currentAvgWage();
    if (!w) { alert('月間勤務計画に時給が入っていません。先に時給を入れてください。'); return; }
    const seed = buildSpecPrices(w);
    if (!confirm(`いまの平均時給 ${w.toLocaleString()}円 で、規格別の単価 ${seed.prices.length}件 を作り直します。\n\n★手で直した値も上書きされます。よろしいですか？`)) return;
    const keep = state.work_prices.filter(p => !(p.task_id === SPEC_TASK_ID && p.spec_id));
    state.work_prices = keep.concat(seed.prices);
    await saveData(STORAGE_KEYS.WORK_PRICES, state.work_prices);
    state._pricesBuf = null;
    render();
    setTimeout(() => alert(`単価を作り直しました（${seed.prices.length}件・時給${w.toLocaleString()}円）`), 100);
  } else if (a === 'go-productivity') {
    state._prodKind = state._prodKind || 'month';
    state._prodView = state._prodView || 'all';
    state._prodAnchor = todayStr();
    state.screen = 'productivity';
    render();
  } else if (a === 'prod-view') {
    state._prodView = e.currentTarget.dataset.view;
    render();
  } else if (a === 'prod-kind') {
    state._prodKind = e.currentTarget.dataset.kind;
    render();
  } else if (a === 'prod-today') {
    state._prodAnchor = todayStr();
    render();
  } else if (a === 'prod-prev' || a === 'prod-next') {
    const s = (a === 'prod-next') ? 1 : -1;
    if (state._prodKind === 'day') state._prodAnchor = dateStrAdd(state._prodAnchor, s);
    else if (state._prodKind === 'week') state._prodAnchor = dateStrAdd(weekStartOf(state._prodAnchor), s * 7);
    else {
      const [y, m] = state._prodAnchor.split('-').map(Number);
      state._prodAnchor = isoDateOnly(new Date(y, m - 1 + s, 1));
    }
    render();
  } else if (a === 'go-work-adjust') {
    state._adjDate = todayStr();
    state.screen = 'work_adjust';
    render();
  } else if (a === 'adj-date-prev' || a === 'adj-date-next') {
    const [yy, mm, dd] = state._adjDate.split('-').map(Number);
    const nd = new Date(yy, mm - 1, dd + (a === 'adj-date-next' ? 1 : -1));
    state._adjDate = isoDateOnly(nd);
    render();
  } else if (a === 'adj-date-set') {
    if (e.currentTarget.value) { state._adjDate = e.currentTarget.value; render(); }
  } else if (a === 'adj-input') {
    // 入力＝承認。その場で認定に書き込む
    const empId = e.currentTarget.dataset.empId;
    const field = e.currentTarget.dataset.field;
    const val = Math.max(0, parseInt(e.currentTarget.value, 10) || 0);
    await applyAdjustment(empId, state._adjDate, { [field]: val }, 'admin');
    render();
  } else if (a === 'go-ot-declare') {
    state._declReason = {};
    state.screen = 'ot_declare_list';
    render();
  } else if (a === 'decl-reason') {
    // 理由の選択を覚えておく（日付＋区分ごと）
    state._declReason = state._declReason || {};
    state._declReason[e.currentTarget.dataset.date + '__' + e.currentTarget.dataset.kind] = e.currentTarget.value;
  } else if (a === 'decl-submit') {
    const d = e.currentTarget.dataset;
    const key = d.date + '__' + d.kind;
    const cat = (state._declReason || {})[key] || '';
    if (!cat) { alert('理由を選んでください'); return; }
    const label = d.kind === 'early' ? '早出' : '延長';
    if (!confirm(`${d.date} の ${label} ${d.min}分 を申告します。\n理由：${cat}\n\nよろしいですか？`)) return;
    const r = await submitDeclaration(state.current_employee_id, d.date, d.kind, d.min, { category: cat }, 'self');
    if (!r) { alert('この日はすでに申告済みか、締められています'); render(); return; }
    alert(`${label} ${d.min}分 を申告しました。\n管理者が承認すると賃金に反映されます。`);
    if (state.screen === 'ot_declare') {
      // その場で聞いている最中。まだ残りがあれば続けて出せるようにする
      const f = findDeclarable(state.current_employee_id, new Date(d.date + 'T12:00:00'));
      const canE = f && f.early_min > 0 && canDeclare(state.current_employee_id, d.date, 'early');
      const canO = f && f.overtime_min > 0 && canDeclare(state.current_employee_id, d.date, 'overtime');
      if (f && (canE || canO)) { state._declTarget = { ...f, canEarly: canE, canOvertime: canO }; }
      else { state._declTarget = null; state.screen = 'personal'; }
    }
    render();
  } else if (a === 'decl-skip') {
    state._declTarget = null;
    state.screen = 'personal';
    render();
  } else if (a === 'goto-work-select') {
    state.screen = 'work_select';
    state._selectedMembers = [];
    render();
  } else if (a === 'start-solo') {
    await startSoloWork(id);
  } else if (a === 'goto-pair-select') {
    state.current_work_item_id = id;
    state._selectedMembers = [];
    state.screen = 'pair_select';
    render();
  } else if (a === 'toggle-pair-member') {
    state._selectedMembers = state._selectedMembers || [];
    if (state._selectedMembers.includes(id)) {
      state._selectedMembers = state._selectedMembers.filter(x => x !== id);
    } else {
      state._selectedMembers.push(id);
    }
    render();
  } else if (a === 'submit-pair-proposal') {
    if (state._selectedMembers.length === 0) { alert('1人以上選んでください'); return; }
    if (state.current_pending_session_id) {
      // 応答モード（既存提案への応答 or 不一致からの再選択）
      await respondToPairProposal(state.current_pending_session_id, state._selectedMembers);
      state.current_pending_session_id = null;
    } else {
      // 新規提案
      await startPairProposal(state.current_work_item_id, state._selectedMembers);
    }
    state._selectedMembers = [];
  } else if (a === 'cancel-pending') {
    if (confirm('提案をキャンセルしますか？')) {
      await cancelPairProposal(pendingId);
      state.screen = 'personal';
      render();
    }
  } else if (a === 'goto-pending-wait') {
    state.current_pending_session_id = pendingId;
    state.screen = 'pending_wait';
    render();
  } else if (a === 'goto-pair-respond') {
    const pending = state.pending_sessions.find(p => p.id === pendingId);
    if (pending) {
      state.current_pending_session_id = pending.id;
      state.screen = 'pair_respond';
      render();
    }
  } else if (a === 'accept-pair') {
    await respondToPairProposal(pendingId, 'accept');
    state.current_pending_session_id = null;
    state.screen = 'personal';
    render();
  } else if (a === 'reject-pair') {
    await respondToPairProposal(pendingId, 'reject');
    state.current_pending_session_id = null;
    // 不参加 → 作業選択画面へ戻る（社長指示）
    state.screen = 'work_select';
    state._selectedMembers = [];
    render();
  } else if (a === 'restart-pair-select') {
    state.current_pending_session_id = pendingId;
    const pending = state.pending_sessions.find(p => p.id === pendingId);
    if (pending) {
      state.current_work_item_id = pending.work_item_id;
      state._selectedMembers = [];
      state.screen = 'pair_select';
      render();
    }

      ...state.app_settings,
      global_allocation_rate: ratePct / 100,
      global_allocation_rate_updated_at: new Date().toISOString(),

  } else if (a === 'punch-solo-start') {
    // 単独で作業開始：作業内容を指定せず即座にWORK_START打刻
    await punch('WORK_START', null, null);
    render();
  } else if (a === 'goto-work-register') {
    // 作業終了：登録画面に遷移
    state._registerBuf = null;
    state._registerEnteredAt = null;
    state.screen = 'work_register';
    render();

    state.screen = 'personal';
    render();
  } else if (a === 'cancel-work-register') {
    state._registerBuf = null;
    state._registerEnteredAt = null;
    state.screen = 'personal';
