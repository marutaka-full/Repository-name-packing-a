// 個人の指定日の労働サマリーを計算
// =========================================================
// 【2026-08-16 v2.1】新勤怠 — ファス v1.6/v1.7 から移植
//
// 丸めルール
//   算定開始 ＝ max(実出勤, 予定始業 − 認めた早出)
//   算定終了 ＝ min(実退勤, 予定終業 + max(5分, 認めた残業))
//
// 5分ルール（社長確定）
//   終業時間超え5分までは打刻どおり賃金を発生させる。
//   それ以上の延長は申告・承認が要る。6分でも5分は必ずつく（逆転しない）。
//   早出は申告・承認のみ。
//
// 認めるやり方は二通り（社長確定 2026-08-16）
//   ① スタッフからの申告 → 管理者が承認
//   ② 管理者が直接打ち込む（入力＝承認）
//
// 算入しなかった時間は捨てずに unpaid_early_min / unpaid_overtime_min に残し、
// 管理画面で一覧できるようにする。あとから認めて遡ることもできる。
// =========================================================
const OVERTIME_GRACE_MIN = 5;  // 無条件で認める残業（分）

// その日の予定始業・終業を返す。無ければ null。
// 日別勤務計画が最優先、無ければ曜日別の標準パターン。
function getPlannedTimes(empId, dateObj) {
  const y = dateObj.getFullYear(), m = dateObj.getMonth() + 1, d = dateObj.getDate();
  const dp = (state.daily_plans || []).find(x => x.employee_id === empId && x.year === y && x.month === m);
  if (dp && dp.days && dp.days[d]) {
    const day = dp.days[d];
    if (day.off) return null;                       // 休みの日は丸めない
    if (day.start && day.end) return { start: day.start, end: day.end, from: 'daily' };
  }
  const pt = (state.work_patterns || []).find(x => x.employee_id === empId);
  if (pt && pt.pattern) {
    const key = ['sun','mon','tue','wed','thu','fri','sat'][dateObj.getDay()];
    const w = pt.pattern[key];
    if (w && !w.off && w.start && w.end) return { start: w.start, end: w.end, from: 'pattern' };
  }
  return null;
}

// 半休・全休を予定時刻に反映する。
// 午前半休なら昼から、午後半休なら昼まで。全休の日は予定なし扱い。
function getPlannedTimesWithLeave(empId, dateObj) {
  const base = getPlannedTimes(empId, dateObj);
  if (!base) return null;
  const lv = getLeave(empId, isoDateOnly(dateObj));
  if (!lv) return base;
  if (lv.unit === 'full') return null;                 // 丸一日休み。丸めない
  const s0 = parseTimeStr(base.start), e0 = parseTimeStr(base.end);
  const mid = Math.round((s0 + e0) / 2);
  if (lv.unit === 'am') return { start: formatTimeStr(mid), end: base.end, from: base.from, half: 'am' };
  if (lv.unit === 'pm') return { start: base.start, end: formatTimeStr(mid), from: base.from, half: 'pm' };
  return base;
}

// その日に認定された早出・延長（分）。管理者が個別入力する。
function getAdjustment(empId, dateStr) {
  const a = (state.work_adjustments || []).find(x => x.employee_id === empId && x.date === dateStr);
  return {
    early_min: a ? (Number(a.early_min) || 0) : 0,
    overtime_min: a ? (Number(a.overtime_min) || 0) : 0,
    note: a ? (a.note || '') : '',
    exists: !!a,
  };
}

// =========================================================
// 【2026-08-11 追加】休暇・有給残日数・36協定・月締め
//
// 休暇の区分
//   yuukyu   有給      … 残日数から引く。1.0日 or 0.5日（午前/午後）
//   kekkin   欠勤      … 無給
//   chikoku  遅刻      … 打刻から自動で分かるので記録は任意
//   soutai   早退      … 同上
//   tokkyu   特別休暇  … 有給扱い/無給扱いを選べる（慶弔・産休育休など）
//   furikae  振替休日  … 事前に休日と入れ替える
//   daikyuu  代休      … 休日出勤の事後に取る
//
// 半休を取った日は、予定の勤務時間を半分にずらす。
//   午前半休 → 予定始業を後ろへ（昼から出勤）
//   午後半休 → 予定終業を前へ（昼で退勤）
// これで丸めルールがそのまま働く。
// =========================================================
const LEAVE_TYPES = [
  { id: 'yuukyu',  name: '有給',     paid: true,  useBalance: true,  color: '#2e7d32' },
  { id: 'kekkin',  name: '欠勤',     paid: false, useBalance: false, color: '#c62828' },
  { id: 'chikoku', name: '遅刻',     paid: false, useBalance: false, color: '#f9a825' },
  { id: 'soutai',  name: '早退',     paid: false, useBalance: false, color: '#f9a825' },
  { id: 'tokkyu',  name: '特別休暇', paid: true,  useBalance: false, color: '#1565c0' },
  { id: 'furikae', name: '振替休日', paid: true,  useBalance: false, color: '#7b1fa2' },
  { id: 'daikyuu', name: '代休',     paid: true,  useBalance: false, color: '#7b1fa2' },
];
const LEAVE_UNITS = [
  { id: 'full', name: '1日',       days: 1.0 },
  { id: 'am',   name: '午前半休',  days: 0.5 },
  { id: 'pm',   name: '午後半休',  days: 0.5 },
];
function leaveTypeOf(id) { return LEAVE_TYPES.find(t => t.id === id) || null; }

// その日の休暇（無ければ null）
function getLeave(empId, dateStr) {
  return (state.leaves || []).find(l => l.employee_id === empId && l.date === dateStr) || null;
}

// 有給の残日数。付与から消化を引く。
// 付与は管理者が手で入れる（有効期限も手入力。空なら期限なし扱い）。
function getPaidLeaveBalance(empId, asOfDate) {
  const asOf = asOfDate ? isoDateOnly(asOfDate) : todayStr();
  let granted = 0;
  for (const g of (state.leave_grants || [])) {
    if (g.employee_id !== empId) continue;
    if (g.granted_on && g.granted_on > asOf) continue;         // まだ付与日が来ていない
    if (g.expires_on && g.expires_on < asOf) continue;          // 期限切れは数えない
    granted += Number(g.days) || 0;
  }
  let used = 0;
  for (const l of (state.leaves || [])) {
    if (l.employee_id !== empId || l.type !== 'yuukyu') continue;
    if (l.date > asOf) continue;
    used += Number(l.days) || 0;
  }
  return { granted, used, balance: Math.round((granted - used) * 10) / 10 };
}

// 期限切れが近い付与（60日以内）を拾う
function getExpiringGrants(empId, withinDays) {
  // 日付の基準は todayStr() に統一する（new Date() と混ぜると食い違いのもとになる）
  const todayS = todayStr();
  const [ty, tm, td] = todayS.split('-').map(Number);
  const limit = new Date(ty, tm - 1, td + (withinDays || 60));
  const limitStr = isoDateOnly(limit);
  return (state.leave_grants || []).filter(g =>
    g.employee_id === empId && g.expires_on && g.expires_on >= todayS && g.expires_on <= limitStr);
}

// ---- 月締め ----
function isMonthClosed(ym) {
  const c = (state.month_closes || []).find(x => x.ym === ym);
  return !!(c && c.closed);
}
function isDateClosed(dateStr) {
  if (!dateStr) return false;
  return isMonthClosed(dateStr.slice(0, 7));
}

// ---- 36協定 ----
// 時間外＝予定の実労働を超えた分。所定内は数えない。
function calcOvertimeStats(empId, year, month) {
  let monthMin = 0, yearMin = 0;
  for (let m = 1; m <= 12; m++) {
    const last = new Date(year, m, 0).getDate();
    let mm = 0;
    for (let d = 1; d <= last; d++) {
      const dt = new Date(year, m - 1, d);
      const sum = calcDayLaborSummary(empId, dt);
      if (!sum || !sum.has_plan) continue;
      const planNet = calcLaborMinutes(sum.planned_start, sum.planned_end);
      const planMin = planNet ? planNet.netMin : 0;
      const over = Math.max(0, sum.netMin - planMin);
      mm += over;
    }
    yearMin += mm;
    if (m === month) monthMin = mm;
  }
  // 既存の設定（v0.7 で入っている法定上限）をそのまま使う
  const lim = (state.app_settings && state.app_settings.legal_limits) || {};
  const monthLimit = (lim.overtime_monthly || 45) * 60;
  const yearLimit = (lim.overtime_annual || 360) * 60;
  const level = v => v.min >= v.limit ? 'over' : (v.min >= v.limit * 0.8 ? 'warn' : 'ok');
  const mo = { min: monthMin, limit: monthLimit }, yr = { min: yearMin, limit: yearLimit };
  return { monthMin, yearMin, monthLimit, yearLimit,
           monthLevel: level(mo), yearLevel: level(yr) };
}

function calcDayLaborSummary(employeeId, dateObj) {
  const dateStr = isoDateOnly(dateObj);
  const punches = state.punches
    .filter(p => p.employee_id === employeeId && isOnDate(p.timestamp, dateStr))
    .sort((a, b) => String(a.timestamp || '').localeCompare(String(b.timestamp || '')));
  if (punches.length === 0) return null;
  const start = punches.find(p => p.type === 'START');
  const end = [...punches].reverse().find(p => p.type === 'END');
  if (!start) return null;
  // 休憩時間集計
  let breakMin = 0;
  let lastBreakStart = null;
  for (const p of punches) {
    if (p.type === 'BREAK') {
      if (!lastBreakStart) lastBreakStart = new Date(p.timestamp);
    } else if (lastBreakStart && p.type !== 'BREAK') {
      breakMin += Math.floor((new Date(p.timestamp) - lastBreakStart) / 60000);
      lastBreakStart = null;
    }
  }
  // 進行中の休憩（最後のBREAKが終わっていない・今日の場合）
  if (lastBreakStart) {
    const today = new Date();
    const isToday = isoDateOnly(today) === dateStr;
    if (isToday) {
      breakMin += Math.floor((today - lastBreakStart) / 60000);
    }
  }
  // 拘束時間
  const startTime = new Date(start.timestamp);
  let endTime;
  if (end) {
    endTime = new Date(end.timestamp);
  } else {
    // 退勤未打刻：今日なら現在時刻、過去日なら最後の打刻時刻
    const today = new Date();
    const isToday = isoDateOnly(today) === dateStr;
    endTime = isToday ? today : new Date(punches[punches.length - 1].timestamp);
  }
  // 【2026-08-16 v2.1】予定始業を起点にする丸めルールを適用する
  const planned = getPlannedTimesWithLeave(employeeId, dateObj);
  const adj = getAdjustment(employeeId, dateStr);
  let calcStartT = startTime.getTime();
  let calcEndT = endTime.getTime();
  let unpaidEarlyMin = 0, unpaidOvertimeMin = 0;
  let plannedStartStr = '', plannedEndStr = '';
  if (planned) {
    plannedStartStr = planned.start; plannedEndStr = planned.end;
    const base = new Date(startTime); base.setHours(0, 0, 0, 0);
    const pStart = base.getTime() + parseTimeStr(planned.start) * 60000;
    const pEnd   = base.getTime() + parseTimeStr(planned.end)   * 60000;
    const allowOT = Math.max(OVERTIME_GRACE_MIN, adj.overtime_min);
    calcStartT = Math.max(startTime.getTime(), pStart - adj.early_min * 60000);
    calcEndT   = Math.min(endTime.getTime(),   pEnd   + allowOT      * 60000);
    if (calcEndT < calcStartT) calcEndT = calcStartT;
    unpaidEarlyMin    = Math.max(0, Math.round((calcStartT - startTime.getTime()) / 60000));
    unpaidOvertimeMin = Math.max(0, Math.round((endTime.getTime() - calcEndT) / 60000));
  }
  const grossMin = Math.max(0, Math.floor((calcEndT - calcStartT) / 60000));
  const netMin = Math.max(0, grossMin - breakMin);
  // 時給取得
  const year = dateObj.getFullYear();
  const month = dateObj.getMonth() + 1;
  const plan = state.work_plans.find(wp => wp.employee_id === employeeId && wp.year === year && wp.month === month);
  const hourlyRate = plan ? (plan.hourly_rate || 0) : 0;
  const netHours = netMin / 60;
  const dailyWage = Math.round(netHours * hourlyRate);
  return {
    start_time: start.timestamp,
    end_time: end ? end.timestamp : null,
    is_ongoing: !end,
    grossMin, netMin, breakMin,
    hourlyRate, dailyWage,
    // 【2026-08-16 v2.1】丸めの内訳
    calc_start: new Date(calcStartT).toISOString(),
    calc_end: new Date(calcEndT).toISOString(),
    planned_start: plannedStartStr,
    planned_end: plannedEndStr,
    has_plan: !!planned,
    unpaid_early_min: unpaidEarlyMin,
    unpaid_overtime_min: unpaidOvertimeMin,
    approved_early_min: adj.early_min,
    approved_overtime_min: adj.overtime_min,
    leave: getLeave(employeeId, dateStr),
    is_closed: isDateClosed(dateStr),
    // 休憩の打刻もれ。実績の休憩は打刻から数えるので、押し忘れると実労働が過大になる。
    // 法定で必要な休憩（拘束6h超で45分、8h45m超で60分）と比べて足りない分を出す。
    break_shortage_min: (function () {
      const need = calcLaborMinutes('00:00', formatTimeStr(Math.max(0, grossMin))).breakMin;
      return Math.max(0, need - breakMin);
    })(),
  };
}


// =========================================================
// 【2026-08-16 v2.1】早出・延長の申告と承認
//
// 認めるやり方は二通り（社長確定）
//   ① スタッフからの申告 → 管理者が承認    requested_by:'self'
//   ② 管理者が直接打ち込む（入力＝承認）    requested_by:'admin'
//
// 申告の出しどころも二通り
//   ① 退勤打刻のとき、その場で聞く
//   ② あとから自分の画面で出す
//   ★同じ日を二重に出せないようにする（申告済み・承認済みの日は除く）
//
// 申告は既存の change_requests に乗せる。type を 'overtime' / 'early' にする。
// 承認画面も通知バナーも履歴も、勤務計画変更と同じ仕組みがそのまま働く。
// 承認されると work_adjustments に反映され、丸めルールが効くようになる。
// =========================================================
const OT_REASONS = ['出荷対応', '入荷対応', '人員不足', '機械トラブル', '繁忙', 'その他'];

// その日の申告（未承認・承認済みを問わず）を拾う
function getDeclaration(empId, dateStr, kind) {
  return (state.change_requests || []).find(r =>
    r.emp_id === empId && r.target_date === dateStr &&
    r.type === kind && r.status !== 'rejected') || null;
}

// もう出せるか（二重申告を防ぐ）
function canDeclare(empId, dateStr, kind) {
  if (isDateClosed(dateStr)) return false;          // 締めた月は出せない
  if (getDeclaration(empId, dateStr, kind)) return false;
  const adj = getAdjustment(empId, dateStr);
  if (kind === 'early' && adj.early_min > 0) return false;      // 管理者がもう入れている
  if (kind === 'overtime' && adj.overtime_min > 0) return false;
  return true;
}

// その日に「申告できる分」があるか調べる。
//
// ★申告する分数は「延長の総量」で持つ。5分を引いた残りではない。
//   認定（work_adjustments）が総量を受け取る作りなので、そこに揃える。
//   管理者が直接入れるときも同じ意味になり、二つのやり方で食い違わない。
//
//   例）予定17:00 に対して 17:25 退勤
//       延長の総量 25分。うち5分は申告なしでつく。残り20分を認めてもらうために
//       「25分」を申告する。承認されると 17:25 まで全部つく。
//
// 戻り値：{ early_min, overtime_min, grace_min, need_min, sum } / 予定が無い日は null
function findDeclarable(empId, dateObj) {
  const dateStr = isoDateOnly(dateObj);
  const sum = calcDayLaborSummary(empId, dateObj);
  if (!sum || !sum.has_plan || !sum.start_time) return null;

  const base = new Date(sum.start_time); base.setHours(0, 0, 0, 0);
  const pStart = base.getTime() + parseTimeStr(sum.planned_start) * 60000;
  const pEnd   = base.getTime() + parseTimeStr(sum.planned_end)   * 60000;
  const aStart = new Date(sum.start_time).getTime();
  const aEnd   = sum.end_time ? new Date(sum.end_time).getTime() : null;

  // 早出は猶予なし。予定始業より早く出た分がそのまま総量。
  const early = Math.max(0, Math.round((pStart - aStart) / 60000));
  // 延長は予定終業を超えた分の総量。5分の猶予は引かない。
  const over  = aEnd === null ? 0 : Math.max(0, Math.round((aEnd - pEnd) / 60000));

  // 5分以内の延長は申告しなくてよい（放っておいても賃金がつく）
  const overNeedsDeclare = over > OVERTIME_GRACE_MIN;
  if (early <= 0 && !overNeedsDeclare) return null;

  return {
    date: dateStr,
    early_min: early,
    overtime_min: overNeedsDeclare ? over : 0,
    grace_min: Math.min(OVERTIME_GRACE_MIN, over),   // 申告しなくてもつく分
    unpaid_early_min: sum.unpaid_early_min,
    unpaid_overtime_min: sum.unpaid_overtime_min,
    sum,
  };
}

// 直近◯日で、まだ申告していない日を拾う
function listDeclarable(empId, days) {
  const out = [];
  const t = todayStr();
  const [ty, tm, td] = t.split('-').map(Number);
  for (let i = 0; i < (days || 14); i++) {
    const d = new Date(ty, tm - 1, td - i);
    const f = findDeclarable(empId, d);
    if (!f) continue;
    const canE = f.early_min > 0 && canDeclare(empId, f.date, 'early');
    const canO = f.overtime_min > 0 && canDeclare(empId, f.date, 'overtime');
    if (!canE && !canO) continue;
    out.push({ ...f, canEarly: canE, canOvertime: canO, dateObj: d });
  }
  return out;
}

// 申告を出す（スタッフ本人／管理者どちらでも）
async function submitDeclaration(empId, dateStr, kind, minutes, reason, requestedBy) {
  const min = Math.max(0, Math.round(Number(minutes) || 0));
  if (min <= 0) return null;
  if (!canDeclare(empId, dateStr, kind)) return null;
  const sum = calcDayLaborSummary(empId, new Date(dateStr + 'T12:00:00'));
  return await addChangeRequest({
    emp_id: empId,
    type: kind,                                   // 'early' or 'overtime'
    target_date: dateStr,
    minutes: min,
    // 根拠として、そのときの打刻と予定を残しておく
    actual_start: sum ? sum.start_time : null,
    actual_end: sum ? sum.end_time : null,
    planned_start: sum ? sum.planned_start : '',
    planned_end: sum ? sum.planned_end : '',
    reason_category: (reason && reason.category) || '',
    reason_note: (reason && reason.note) || '',
    requested_by: requestedBy || 'self',
  });
}

// 認定を書き込む。承認したときと、管理者が直接入れたときの両方から呼ぶ。
async function applyAdjustment(empId, dateStr, patch, source) {
  if (!state.work_adjustments) state.work_adjustments = [];
  let a = state.work_adjustments.find(x => x.employee_id === empId && x.date === dateStr);
  if (!a) {
    a = { employee_id: empId, date: dateStr, early_min: 0, overtime_min: 0, note: '' };
    state.work_adjustments.push(a);
  }
  if (patch.early_min !== undefined) a.early_min = Math.max(0, Number(patch.early_min) || 0);
  if (patch.overtime_min !== undefined) a.overtime_min = Math.max(0, Number(patch.overtime_min) || 0);
  if (patch.note !== undefined) a.note = patch.note;
  a.source = source || 'admin';
  a.updated_at = nowISO();
  // 両方0になったら行ごと消す（空の行を残さない）
  if (a.early_min === 0 && a.overtime_min === 0 && !a.note) {
    state.work_adjustments = state.work_adjustments.filter(x => x !== a);
  }
  await saveData(STORAGE_KEYS.WORK_ADJUSTMENTS, state.work_adjustments);
  return a;
}

// 申告を承認する
async function approveDeclaration(requestId) {
  const req = (state.change_requests || []).find(r => r.request_id === requestId);
  if (!req || req.status !== 'pending') return null;
  if (req.type !== 'early' && req.type !== 'overtime') return null;
  req.status = 'approved';
  req.approved_by = 'admin';
  req.approved_at = nowISO();
  await saveData(STORAGE_KEYS.CHANGE_REQUESTS, state.change_requests);
  await applyAdjustment(req.emp_id, req.target_date,
    req.type === 'early' ? { early_min: req.minutes } : { overtime_min: req.minutes },
    'request');
  await addChangeHistory({
    emp_id: req.emp_id, type: req.type, target_date: req.target_date,
    minutes: req.minutes,
    reason_category: req.reason_category, reason_note: req.reason_note,
    change_type: 'request', request_id: req.request_id,
  });
  await addEmployeeNotification(req.emp_id, {
    kind: 'approved',
    title: (req.type === 'early' ? '早出' : '延長') + ' ' + req.minutes + '分が承認されました',
    body: req.target_date + ' の申告が認められました。賃金に反映されます。',
  });
  return req;
}

// 申告を却下する
async function rejectDeclaration(requestId, note) {
  const req = (state.change_requests || []).find(r => r.request_id === requestId);
  if (!req || req.status !== 'pending') return null;
  req.status = 'rejected';
  req.approved_by = 'admin';
  req.approved_at = nowISO();
  req.reject_note = note || '';
  await saveData(STORAGE_KEYS.CHANGE_REQUESTS, state.change_requests);
  await addEmployeeNotification(req.emp_id, {
    kind: 'rejected',
    title: (req.type === 'early' ? '早出' : '延長') + ' の申告が認められませんでした',
    body: req.target_date + (note ? '：' + note : ''),
  });
  return req;
}

// 承認待ちの早出・延長（管理者画面用）
function pendingDeclarations() {
  return (state.change_requests || []).filter(r =>
    r.status === 'pending' && (r.type === 'early' || r.type === 'overtime'));
}

// =========================================================
// 【2026-08-16 v2.2】味采には規格（サイズ・入数）がない
//
// 規格はファス v1.7 で入れた仕組み。味采にはまだ無い。
// 品目別の集計は、規格があれば分けて出し、無ければ品目だけでまとめる。
// 将来 味采にも規格を入れたとき、そのまま動く。
// =========================================================
function specsOf(productId) {
  const p = state.work_products.find(x => x.id === productId);
  return (p && Array.isArray(p.specs)) ? p.specs : [];
}
function specLabel(productId, specId) {
  if (!specId) return '';
  const sp = specsOf(productId).find(x => x.id === specId);
  return sp ? sp.label : specId;
}

// 想定の稼働率。パッキングAI と同じ考え方（1時間ぶっ通しでは作業できない）
const PLAN_UTIL = 0.75;

// =========================================================
// 【2026-08-16 v2.2】人時生産性（社長確定）
//
//   人時売上   ＝ 売上（出来高・作業賃） ÷ 総労働時間
//   人時生産性 ＝ 粗利                   ÷ 総労働時間
//
//   この2つは実時給ぶんだけ違う。必ず次の関係が成り立つ。
//     人時売上 − 実時給 ＝ 人時生産性
//   （実時給 ＝ 人件費 ÷ 総労働時間）
//
// ★センターの概念（社長確定 2026-08-16）
//     売上 ＝ 出来高（作業賃）
//     原価 ＝ 人件費          ← 青果の仕入はセンターの原価ではない
//     粗利 ＝ 売上 − 原価
//     原価率 ＝ 人件費 ÷ 出来高   … 100%を超えたら赤字
//     粗利率 ＝ 粗利 ÷ 出来高
//
//   総労働時間 … 打刻から出る実労働（拘束 − 休憩）の合計。
//                 準備・清掃・待ち時間も入る。給料が出ている時間はすべて分母。
//                 ★ペア作業かどうかは関係ない。打刻は一人ずつ出るため。
//   人件費     … その総労働時間 × 実時給（月間勤務計画の時給）
//   出来高     … 作業記録の 数量 × 作業賃単価
//   粗利       ＝ 出来高 − 人件費
//
// 包材費は売上にも費用にも入れない。センターが立て替えて請求する形で
// 同額が相殺されるため。記録には残してあるので、必要になれば出せる。
//
// 期間は 日・週・月。対象は 全体・個人。
// 週は月曜はじまり（thisWeekStartStr と同じ考え方）。
// =========================================================

// 日付をまたぐ計算は必ず日本時間の日付文字列で行う（UTCと混ぜない）
function dateStrAdd(dateStr, days) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return isoDateOnly(new Date(y, m - 1, d + days));
}
// その日が属する週の月曜
function weekStartOf(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  const back = (dt.getDay() + 6) % 7;      // 月=0, 日=6
  return isoDateOnly(new Date(y, m - 1, d - back));
}
// 期間の日付を並べる
function daysBetween(fromStr, toStr) {
  const out = [];
  let cur = fromStr;
  let guard = 0;
  while (cur <= toStr && guard++ < 400) { out.push(cur); cur = dateStrAdd(cur, 1); }
  return out;
}
// 期間の始まり・終わりを出す
//   kind: 'day' | 'week' | 'month'
function periodRange(kind, anchorStr) {
  if (kind === 'day') return { from: anchorStr, to: anchorStr, label: anchorStr };
  if (kind === 'week') {
    const s = weekStartOf(anchorStr), e = dateStrAdd(s, 6);
    return { from: s, to: e, label: `${s} 〜 ${e}` };
  }
  const [y, m] = anchorStr.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  const s = `${y}-${String(m).padStart(2,'0')}-01`;
  const e = `${y}-${String(m).padStart(2,'0')}-${String(last).padStart(2,'0')}`;
  return { from: s, to: e, label: `${y}年${m}月` };
}

// ---- 人時生産性の本体 ----
// empId を渡すとその人だけ、null なら全体
function calcLaborProductivity(kind, anchorStr, empId) {
  const { from, to, label } = periodRange(kind, anchorStr);
  const emps = empId
    ? state.employees.filter(e => e.id === empId)
    : employeesHere();

  // ── 分母と人件費：打刻から出す（総労働時間）
  let totalNetMin = 0, totalWage = 0, workDays = 0;
  const byEmp = {};
  for (const emp of emps) {
    let mn = 0, wg = 0, dd = 0;
    for (const ds of daysBetween(from, to)) {
      const [y, m, d] = ds.split('-').map(Number);
      const sum = calcDayLaborSummary(emp.id, new Date(y, m - 1, d));
      if (!sum) continue;
      mn += sum.netMin; wg += sum.dailyWage; dd++;
    }
    if (mn === 0 && dd === 0) continue;
    byEmp[emp.id] = { emp, netMin: mn, wage: wg, days: dd, revenue: 0, quantity: 0, records: 0 };
    totalNetMin += mn; totalWage += wg; workDays += dd;
  }

  // ── 分子の出来高：作業記録から出す
  //    ペア作業は、かかった時間の比で各人に配る（全体の合計は変わらない）
  let totalRevenue = 0, totalRecords = 0, unpriced = 0;
  for (const r of state.work_records) {
    if (!r.work_started_at) continue;
    const ds = localDateStr(r.work_started_at);
    if (ds < from || ds > to) continue;
    const parts = splitRecordByMember(r);
    let counted = false;
    for (const p of parts) {
      if (empId && p.employee_id !== empId) continue;
      if (byEmp[p.employee_id]) {
        byEmp[p.employee_id].revenue += p.revenue;
        byEmp[p.employee_id].quantity += p.quantity;
        byEmp[p.employee_id].records += 1;
      }
      totalRevenue += p.revenue;
      counted = true;
    }
    if (counted) {
      totalRecords++;
      if (!r.unit_price || r.unit_price === 0) unpriced++;
    }
  }

  const hours = totalNetMin / 60;
  const profit = totalRevenue - totalWage;
  const rows = Object.values(byEmp).map(x => {
    const h = x.netMin / 60;
    const pf = x.revenue - x.wage;
    return { ...x, hours: h, profit: pf,
             perHour: h > 0 ? pf / h : 0,
             revPerHour: h > 0 ? x.revenue / h : 0,
             realRate: h > 0 ? x.wage / h : 0,
             costRate: x.revenue > 0 ? x.wage / x.revenue * 100 : null,
             profitRate: x.revenue > 0 ? pf / x.revenue * 100 : null };
  }).sort((a, b) => b.perHour - a.perHour);

  return {
    kind, from, to, label,
    totalNetMin, hours,
    totalWage, totalRevenue, profit,
    perHour: hours > 0 ? profit / hours : 0,          // ★人時生産性
    revPerHour: hours > 0 ? totalRevenue / hours : 0, // 1人時あたりの出来高
    realRate: hours > 0 ? totalWage / hours : 0,      // 実時給（平均）
    // ★センターの概念：原価＝人件費
    costRate: totalRevenue > 0 ? totalWage / totalRevenue * 100 : null,   // 原価率(%)
    profitRate: totalRevenue > 0 ? profit / totalRevenue * 100 : null,    // 粗利率(%)
    workDays, totalRecords, unpriced,
    rows,
  };
}

// =========================================================
// 【2026-08-16 v2.2】品目別の人時売上・人時生産性
//
// ★分母が全体とは違うことに注意
//   全体・個人 … 打刻から出る総労働時間（準備・清掃・待ち時間を含む）
//   品目別     … 作業記録の人時（その品目に費やした時間だけ）
//
//   打刻は「出勤〜退勤」で品目に紐づいていない。品目に紐づくのは作業記録だけ。
//   そのため準備・清掃・待ち時間は品目に割り振れず、
//   品目別の合計は全体の総労働時間より必ず小さくなる。
//   その差は「品目に割り振れない時間」として隠さずに出す。
//
//   人時売上   ＝ 売上 ÷ その品目の人時
//   人時生産性 ＝ 粗利 ÷ その品目の人時
//   粗利       ＝ 売上 − 人件費（関わった人それぞれの時給で計算）
// =========================================================
function calcProductivityByProduct(kind, anchorStr, empId) {
  const { from, to, label } = periodRange(kind, anchorStr);
  const byKey = {};
  let recRevenue = 0, recWage = 0, recMinutes = 0, recCount = 0, unpriced = 0;

  for (const r of state.work_records) {
    if (!r.work_started_at) continue;
    const ds = localDateStr(r.work_started_at);
    if (ds < from || ds > to) continue;
    const parts = splitRecordByMember(r);
    const pid = r.main_product_id || '';
    const sid = r.main_spec_id || '';
    const key = pid + '__' + sid;
    for (const p of parts) {
      if (empId && p.employee_id !== empId) continue;
      if (!byKey[key]) {
        const prod = state.work_products.find(x => x.id === pid);
        byKey[key] = {
          product_id: pid, spec_id: sid,
          name: prod ? `${prod.emoji || ''} ${prod.name}` : (pid || '（品目なし）'),
          specLabel: sid ? specLabel(pid, sid) : '',
          minutes: 0, revenue: 0, wage: 0, quantity: 0, records: 0,
          unit: r.unit || '',
        };
      }
      const b = byKey[key];
      b.minutes += p.minutes;
      b.revenue += p.revenue;
      b.wage += p.laborCost;
      b.quantity += p.quantity;
      recMinutes += p.minutes;
      recRevenue += p.revenue;
      recWage += p.laborCost;
    }
    if (parts.length > 0 && (!empId || parts.some(p => p.employee_id === empId))) {
      byKey[pid + '__' + sid].records += 1;
      recCount++;
      if (!r.unit_price || r.unit_price === 0) unpriced++;
    }
  }

  const rows = Object.values(byKey).map(b => {
    const h = b.minutes / 60;
    const profit = b.revenue - b.wage;
    return { ...b, hours: h, profit,
      revPerHour: h > 0 ? b.revenue / h : 0,
      perHour:    h > 0 ? profit / h : 0,
      realRate:   h > 0 ? b.wage / h : 0,
      costRate:   b.revenue > 0 ? b.wage / b.revenue * 100 : null,
      qtyPerHour: h > 0 ? b.quantity / h : 0 };
  }).sort((x, y) => y.perHour - x.perHour);

  // ★全体（打刻ベース）と突き合わせて、割り振れない時間を出す
  const whole = calcLaborProductivity(kind, anchorStr, empId);
  const unassignedMin = Math.max(0, whole.totalNetMin - recMinutes);
  const unassignedWage = Math.max(0, whole.totalWage - recWage);

  return {
    kind, from, to, label, rows,
    recMinutes, recHours: recMinutes / 60, recRevenue, recWage,
    recProfit: recRevenue - recWage, recCount, unpriced,
    wholeNetMin: whole.totalNetMin, wholeHours: whole.hours, wholeWage: whole.totalWage,
    unassignedMin, unassignedHours: unassignedMin / 60, unassignedWage,
    assignRate: whole.totalNetMin > 0 ? recMinutes / whole.totalNetMin * 100 : null,
    whole,
  };
}


// =========================================================
// 【2026-08-16 v2.2】稼働率
//
// 総労働時間（打刻）を3つに分ける
//   ① 出来高作業（正味） … 袋詰めなど、稼いでいる時間
//                          作業記録の人時 − その中に含まれる全体寄与
//   ② 全体寄与           … 始業準備・清掃・入荷対応など
//                          作業記録の sub_tasks に内数で入っている
//   ③ 記録のない時間     … 打刻はあるが作業記録がない時間
//
//   ①＋②＋③ ＝ 総労働時間（必ず一致する）
//
// 出す率は2つ（社長確定 2026-08-16）
//   稼働率     ＝ ① ÷ 総労働時間     … パッキングAIの想定0.75と比べられる
//   記録率     ＝（①＋②）÷ 総労働時間 … 何をしていたか分かる時間の割合
//
// ★なぜ①だけを稼働率と呼ぶか
//   作業賃は「時給 × 秒 ÷ 3600 ÷ 0.75」で決めている。
//   この0.75は「1時間のうち45分は正味の作業ができる」という前提。
//   実績の①がこれを下回ると、作業賃が構造的に足りなくなる。
//
// ★sub_tasks は内数
//   作業記録の時間の「中に含まれていた」間接作業として入力する。
//   足し算ではなく引き算で扱う。二重に数えないこと。
// =========================================================
function calcUtilization(kind, anchorStr, empId) {
  const { from, to, label } = periodRange(kind, anchorStr);
  const whole = calcLaborProductivity(kind, anchorStr, empId);

  let recMin = 0;          // 作業記録の人時（全体寄与を含む）
  let subMin = 0;          // うち全体寄与（内数）
  const byGlobal = {};     // 全体寄与の内訳
  let recCount = 0;

  for (const r of state.work_records) {
    if (!r.work_started_at) continue;
    const ds = localDateStr(r.work_started_at);
    if (ds < from || ds > to) continue;
    const parts = splitRecordByMember(r);
    const mine = empId ? parts.filter(p => p.employee_id === empId) : parts;
    if (mine.length === 0) continue;
    const minutes = mine.reduce((s, p) => s + p.minutes, 0);
    recMin += minutes;
    recCount++;
    // 全体寄与は記録全体に対する分数。関わった人の時間比で分ける。
    const totalAll = parts.reduce((s, p) => s + p.minutes, 0);
    const share = totalAll > 0 ? minutes / totalAll : 1;
    for (const stk of (r.sub_tasks || [])) {
      const mn = (Number(stk.duration_min) || 0) * share;
      if (mn <= 0) continue;
      subMin += mn;
      if (!byGlobal[stk.task_id]) {
        const t = state.work_tasks.find(x => x.id === stk.task_id);
        byGlobal[stk.task_id] = { task_id: stk.task_id,
          name: t ? `${t.icon || ''} ${t.name}` : stk.task_id, minutes: 0 };
      }
      byGlobal[stk.task_id].minutes += mn;
    }
  }

  // 全体寄与が記録時間を超えることはないはずだが、入力ミスに備えて頭を押さえる
  if (subMin > recMin) subMin = recMin;
  const netWorkMin = Math.max(0, recMin - subMin);          // ① 出来高作業（正味）
  const totalMin = whole.totalNetMin;                        // 総労働時間
  const unrecordedMin = Math.max(0, totalMin - recMin);      // ③ 記録なし

  const pct = v => totalMin > 0 ? v / totalMin * 100 : null;
  const planned = PLAN_UTIL * 100;                            // 想定 75%
  const util = pct(netWorkMin);

  return {
    kind, from, to, label,
    totalMin, totalHours: totalMin / 60,
    netWorkMin, netWorkHours: netWorkMin / 60,
    subMin, subHours: subMin / 60,
    unrecordedMin, unrecordedHours: unrecordedMin / 60,
    recMin, recHours: recMin / 60, recCount,
    utilRate: util,                                          // 稼働率（①）
    recordRate: pct(recMin),                                 // 記録率（①＋②）
    subRate: pct(subMin),
    unrecordedRate: pct(unrecordedMin),
    plannedRate: planned,
    gap: util === null ? null : util - planned,              // 想定との差
    globals: Object.values(byGlobal).sort((x, y) => y.minutes - x.minutes),
    whole,
  };
}

  return (n < 0 ? '▲' : '') + Math.abs(n).toLocaleString() + '円';
}

  return 'var(--red)';
}

    html += `<div style="margin-top:12px; padding:10px 12px; background:#fff8e1; border-radius:6px; font-size:0.9rem;">
      いちばん上 <strong>${top.emp.name}</strong> ${fmtYen(top.perHour)} ／
      いちばん下 <strong>${bot.emp.name}</strong> ${fmtYen(bot.perHour)}
      <br><span style="color:#666;">差 ${fmtYen(top.perHour - bot.perHour)}／人時。
      速い人のやり方をそろえると、全体が上がります。</span></div>`;
  }
  html += `</div>`;
  return html;
}

// 出荷単価計算：仕入れ＋作業賃＋包材費＋値入率 → 出荷単価
function renderReportShip() {
  // 状態初期化
  if (!state._shipBuf) {
    state._shipBuf = {
      task_id: '',
      product_id: '',
      purchase_qty: '',     // 仕入れ量
      purchase_unit: 'kg',  // 仕入れ単位
      purchase_amount: '',  // 仕入れ額
      output_qty: '',       // 出来上がり数
      remain_qty: '',       // 残り量
      markup_rate: '30',    // 値入率（対原価マークアップ、初期30%）
    };
  }
  const buf = state._shipBuf;
  const parentTasks = state.work_tasks.filter(t => t.type === 'parent');
  const products = state.work_products;
  
  // 選択された作業・品目
  const task = buf.task_id ? state.work_tasks.find(t => t.id === buf.task_id) : null;
  const product = buf.product_id ? state.work_products.find(p => p.id === buf.product_id) : null;
  
  // 単位作業賃・単位包材費（マスタから）
  const price = findWorkPrice(buf.task_id, buf.product_id, buf.spec_id);
  const material = findWorkMaterial(buf.task_id, buf.product_id, buf.spec_id);
  const unitLaborCharge = price ? price.unit_price : 0;
  const unitMaterialCost = material ? material.material_cost : 0;
  
  // 入力値を数値化
  const purchaseQty = parseFloat(buf.purchase_qty) || 0;
  const purchaseAmount = parseFloat(buf.purchase_amount) || 0;
  const outputQty = parseFloat(buf.output_qty) || 0;
  const remainQty = parseFloat(buf.remain_qty) || 0;
  const markupRate = parseFloat(buf.markup_rate) || 0;
  
  // 計算
  const purchasePerUnit = purchaseQty > 0 ? purchaseAmount / purchaseQty : 0;     // 仕入れ単価（円/kg等）
  const usedQty = purchaseQty - remainQty;                                         // 使用量
  const yieldRate = purchaseQty > 0 ? (usedQty / purchaseQty * 100) : 0;            // 歩留まり
  // 1個あたり使用量。kg仕入れのときだけgに換算し、それ以外は仕入単位のまま表示する
  const perOutputRaw = outputQty > 0 ? (usedQty / outputQty) : 0;
  const qtyPerOutput = buf.purchase_unit === 'kg' ? perOutputRaw * 1000 : (buf.purchase_unit === 'g' ? perOutputRaw : perOutputRaw);
  const qtyPerOutputUnit = buf.purchase_unit === 'kg' ? 'g' : buf.purchase_unit;
  // 残り量は「次回に使える在庫」として扱う（社長確認 2026-08-04）。
  // したがって原料費に乗せるのは、仕入額の全額ではなく実際に使った分だけ。
  const usedAmount = purchaseQty > 0 ? purchaseAmount * (usedQty / purchaseQty) : 0;  // 使った分の原料費
  const remainAmount = purchaseAmount - usedAmount;                                    // 在庫として残る金額
  const materialCostPerOutput = outputQty > 0 ? (usedAmount / outputQty) : 0;          // 1個あたり原料費
  const subtotal = materialCostPerOutput + unitLaborCharge + unitMaterialCost;     // 1個あたり原価合計
  const profit = subtotal * (markupRate / 100);                                    // 1個あたり利益
  const shipPrice = subtotal + profit;                                             // 1個あたり出荷単価
  
  // 全体集計
  const totalLabor = unitLaborCharge * outputQty;
  const totalMaterial = unitMaterialCost * outputQty;
  const totalCost = usedAmount + totalLabor + totalMaterial;
  const totalRevenue = shipPrice * outputQty;
  const totalProfit = totalRevenue - totalCost;
  
  let html = `<div style="margin-bottom:14px; padding:10px 14px; background:#e8f4ee; border-radius:8px; font-size:0.9rem;">
    💹 仕入れ・作業賃・包材費・値入率から出荷単価を計算します。<br>
    <span style="font-size:0.85rem; color:#555;">この計算で算出された価格を、店舗・取引先への出荷単価の根拠にできます。</span>
  </div>`;
  
  // 入力フォーム
  html += `<div class="card" style="padding:16px;">
    <h3 style="margin-top:0;">🥬 商品の選択</h3>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <div>
        <label class="form-label">作業</label>
        <select id="ship-task" data-action="ship-task-change">
          <option value="">-- 選択 --</option>`;
  html += `<optgroup label="🟨 手作業">`;
  for (const t of parentTasks.filter(t => t.category === '手作業')) {
    html += `<option value="${t.id}" ${t.id === buf.task_id ? 'selected' : ''}>${t.icon} ${t.name}（${t.unit}単位）</option>`;
  }
  html += `</optgroup><optgroup label="🤖 マシン作業">`;
  for (const t of parentTasks.filter(t => t.category === 'マシン作業')) {
    html += `<option value="${t.id}" ${t.id === buf.task_id ? 'selected' : ''}>${t.icon} ${t.name}（${t.unit}単位）</option>`;
  }
  html += `</optgroup></select>
      </div>
      <div>
        <label class="form-label">品目</label>
        <select id="ship-product" data-action="ship-product-change">
          <option value="">-- 選択 --</option>`;
  for (const p of products) {
    html += `<option value="${p.id}" ${p.id === buf.product_id ? 'selected' : ''}>${p.emoji} ${p.name}</option>`;
  }
  html += `</select>
      </div>
    </div>
    ${task && product ? `<div style="margin-top:10px; padding:8px 12px; background:var(--green-bg); border-radius:6px; font-size:0.88rem;">
      ✅ <strong>${task.icon} ${task.name} × ${product.emoji} ${product.name}</strong>（${task.unit}単位）<br>

      📦 単位包材費：<strong>${unitMaterialCost > 0 ? unitMaterialCost+'円/'+task.unit : '<span style="color:var(--orange);">未設定</span>'}</strong>

// 本日の課金：商品（作業×品目）別の作業賃＋包材費の集計
function renderReportCharge() {
  const baseDate = state._reportDate;
  const dateStr = isoDateOnly(baseDate);
  const records = state.work_records
    .filter(r => isOnDate(r.work_started_at, dateStr))
    .sort((a, b) => String(a.work_started_at || '').localeCompare(String(b.work_started_at || '')));
  
  // 日付ナビ
  let html = `
    <div class="shift-navbar">
      <button class="nav-btn" data-action="report-day-prev">← 前日</button>
      <input type="date" id="report-date-input" value="${dateStr}" data-action="report-date-change" />
      <div class="shift-date-label">${formatYMD(baseDate)}</div>
      <button class="nav-btn" data-action="report-day-today">今日</button>
      <button class="nav-btn" data-action="report-day-next">翌日 →</button>
    </div>
  `;
  
  if (records.length === 0) {
    html += `<div class="empty-message" style="padding:30px;">この日の作業記録はありません</div>`;
    return html;
  }
  
  // 商品（作業×品目）別に集計
  const byKey = {};
  for (const r of records) {
    const key = `${r.main_task_id}__${r.main_product_id}__${r.main_spec_id || ''}`;
    if (!byKey[key]) {
      byKey[key] = {
        task_id: r.main_task_id, product_id: r.main_product_id,
        spec_id: r.main_spec_id || '',
        unit: r.unit,
        quantity: 0,
        totalLaborCost: 0,
        records: [],
      };
    }
    const cost = calcRecordCost(r);
    byKey[key].quantity += r.quantity || 0;
    byKey[key].totalLaborCost += cost.laborCost;
    byKey[key].records.push(r);
  }
  // 各商品の課金計算
  const items = Object.values(byKey).map(a => {
    const mat = findWorkMaterial(a.task_id, a.product_id, a.spec_id);
    const materialUnit = mat ? (mat.material_cost || 0) : 0;
    const totalMaterialCost = materialUnit * a.quantity;
    const totalCharge = a.totalLaborCost + totalMaterialCost;
    const laborUnit = a.quantity > 0 ? Math.round(a.totalLaborCost / a.quantity * 10) / 10 : 0;
    const chargeUnit = a.quantity > 0 ? Math.round(totalCharge / a.quantity * 10) / 10 : 0;
    return { ...a, materialUnit, totalMaterialCost, totalCharge, laborUnit, chargeUnit };
  }).sort((a, b) => b.totalCharge - a.totalCharge);
  
  // 統計サマリー
  const totalLabor = items.reduce((s, x) => s + x.totalLaborCost, 0);
  const totalMaterial = items.reduce((s, x) => s + x.totalMaterialCost, 0);
  const totalCharge = totalLabor + totalMaterial;
  const totalQty = items.reduce((s, x) => s + x.quantity, 0);
  
  html += `
    <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-bottom:14px;">
      <div style="background:#fafafa; border-radius:8px; padding:10px;">
        <div style="font-size:0.8rem; color:#888;">商品種類</div>
        <div style="font-size:1.3rem; font-weight:bold; color:var(--blue);">${items.length}種</div>
      </div>
      <div style="background:#fafafa; border-radius:8px; padding:10px;">
        <div style="font-size:0.8rem; color:#888;">総生産数量</div>
        <div style="font-size:1.3rem; font-weight:bold;">${totalQty.toLocaleString()}</div>
      </div>
      <div style="background:#fff3e0; border-radius:8px; padding:10px;">
        <div style="font-size:0.8rem; color:#888;">💰 作業賃合計</div>
        <div style="font-size:1.3rem; font-weight:bold; color:var(--orange);">${totalLabor.toLocaleString()}円</div>
      </div>
      <div style="background:#e3f2fd; border-radius:8px; padding:10px;">
        <div style="font-size:0.8rem; color:#888;">📦 包材費合計</div>
        <div style="font-size:1.3rem; font-weight:bold; color:var(--blue);">${totalMaterial.toLocaleString()}円</div>
      </div>
      <div style="background:#fff8e1; border-radius:8px; padding:10px; border:2px solid #d9b347;">
        <div style="font-size:0.8rem; color:#888;">💴 本日の課金合計</div>
        <div style="font-size:1.4rem; font-weight:bold; color:#d9b347;">${totalCharge.toLocaleString()}円</div>
      </div>
    </div>
  `;
  
  // 商品別の課金一覧
  html += `<table class="shift-day-table" style="font-size:0.9rem;">
    <thead><tr>
      <th>作業</th><th>品目</th>
      <th style="text-align:right;">数量</th>
      <th style="text-align:right; background:#fff3e0;">💰単位作業賃</th>
      <th style="text-align:right; background:#e3f2fd;">📦単位包材費</th>
      <th style="text-align:right; background:#fff8e1;">💴単位課金<br><span style="font-size:0.75rem; font-weight:normal;">(作業賃+包材)</span></th>
      <th style="text-align:right; background:#fff3e0;">作業賃合計</th>
      <th style="text-align:right; background:#e3f2fd;">包材費合計</th>
      <th style="text-align:right; background:#fff8e1;">課金合計</th>
    </tr></thead><tbody>`;
  for (const a of items) {
    const task = state.work_tasks.find(t => t.id === a.task_id);
    const product = state.work_products.find(p => p.id === a.product_id);
    const matLabel = a.materialUnit > 0 ? `${a.materialUnit}円` : '<span style="color:var(--orange);">未設定</span>';
    html += `<tr>
      <td><strong>${task ? `${task.icon} ${task.name}` : a.task_id}</strong></td>
      <td>${product ? `${product.emoji} ${product.name}` : a.product_id}</td>
      <td style="text-align:right; font-weight:bold;">${a.quantity.toLocaleString()}${a.unit||''}</td>
      <td style="text-align:right; color:var(--orange);">${a.laborUnit}円</td>
      <td style="text-align:right; color:var(--blue);">${matLabel}</td>
      <td style="text-align:right; font-weight:bold; color:#d9b347; font-size:1.05rem;">${a.chargeUnit}円</td>
      <td style="text-align:right; color:var(--orange);">${a.totalLaborCost.toLocaleString()}円</td>
      <td style="text-align:right; color:var(--blue);">${a.totalMaterialCost.toLocaleString()}円</td>
      <td style="text-align:right; font-weight:bold; color:#d9b347;">${a.totalCharge.toLocaleString()}円</td>
    </tr>`;
  }
  html += `</tbody>
  <tfoot><tr style="background:#fff8e0; font-weight:bold;">
    <td colspan="6" style="text-align:right;">合計</td>
    <td style="text-align:right; color:var(--orange);">${totalLabor.toLocaleString()}円</td>
    <td style="text-align:right; color:var(--blue);">${totalMaterial.toLocaleString()}円</td>
    <td style="text-align:right; color:#d9b347;">${totalCharge.toLocaleString()}円</td>
  </tr></tfoot></table>
  
  <div style="margin-top:14px; padding:12px 14px; background:#fff8e1; border-radius:8px; font-size:0.88rem;">
    <div style="font-weight:bold; margin-bottom:6px;">💴 本日の課金とは</div>
    <div style="line-height:1.7;">
      📌 各商品（作業×品目）にかかった <strong>作業賃（人件費）</strong>＋<strong>包材費</strong> の合計です。<br>
      📌 <strong>単位課金</strong>＝この商品 1個 を作るのにかかったコスト（後で出荷単価のベースに使えます）<br>
      💡 包材費マスタは <button class="nav-btn" data-action="go-materials-master" style="padding:3px 10px; font-size:0.85rem; background:#fff; color:var(--blue); border-color:var(--blue);">📦 包材費マスタ</button> で設定<br>
      🔜 <strong>次のステップ</strong>：仕入れ量・仕入れ額・出来数・利益率を入力すると<strong>店舗への出荷単価</strong>が自動算出される機能を追加予定
    </div>
  </div>`;
  return html;
}

function renderReportVolume() {
  const baseDate = state._reportDate;
  const dateStr = isoDateOnly(baseDate);

  const records = state.work_records
    .filter(r => isOnDate(r.work_started_at, dateStr))
    .sort((a, b) => String(a.work_started_at || '').localeCompare(String(b.work_started_at || '')));
  
  // 日付ナビ
  let html = `
    <div class="shift-navbar">
      <button class="nav-btn" data-action="report-day-prev">← 前日</button>

  const totalLaborCost = records.reduce((s, r) => s + calcRecordCost(r).laborCost, 0);

      <div style="background:#e8f4ee; border-radius:8px; padding:10px;">
        <div style="font-size:0.8rem; color:#888;">📦 出来高</div>

      <div style="background:${totalProfit >= 0 ? '#e8f5e9' : '#ffebee'}; border-radius:8px; padding:10px; border:2px solid ${profitColor};">

      </div>
      ${unpricedCount > 0 ? `<div style="background:#fff3e0; border-radius:8px; padding:10px;">
        <div style="font-size:0.8rem; color:#888;">⚠️ 単価未設定</div>

      </div>` : ''}

    { key: 'employee', label: '👤 個人別' },

  </div>`;

// 個人の指定月の労働サマリーを計算（日次集計の積み上げ）
function calcMonthlyLaborSummary(employeeId, year, month) {
  const lastDay = new Date(year, month, 0).getDate();
  let workDays = 0;
  let totalNetMin = 0;
  let totalBreakMin = 0;
  let totalGrossMin = 0;
  let totalWage = 0;
  let hourlyRate = 0;
  const dailyDetails = [];
  for (let day = 1; day <= lastDay; day++) {
    const date = new Date(year, month - 1, day);
    const sum = calcDayLaborSummary(employeeId, date);
    if (sum) {
      workDays++;
      totalNetMin += sum.netMin;
      totalGrossMin += sum.grossMin;
      totalBreakMin += sum.breakMin;
      totalWage += sum.dailyWage;
      hourlyRate = sum.hourlyRate;
      dailyDetails.push({ day, date, ...sum });
    }
  }
  return { workDays, totalNetMin, totalBreakMin, totalGrossMin, totalWage, hourlyRate, dailyDetails };
}

// 個人の指定月の出来高サマリーを計算（work_records から集計）
function calcMonthlyVolumeSum(employeeId, year, month) {
  const lastDay = new Date(year, month, 0).getDate();
  const startStr = `${year}-${String(month).padStart(2,'0')}-01`;
  const endStr = `${year}-${String(month).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  const records = state.work_records.filter(r => 
    r.employee_id === employeeId && 
    r.work_started_at && 
    localDateStr(r.work_started_at) >= startStr && 
    localDateStr(r.work_started_at) <= endStr
  );
  let totalRevenue = 0;
  let recordCount = records.length;
  let unpricedCount = 0;
  for (const r of records) {
    const rev = (r.unit_price || 0) * (r.quantity || 0);
    totalRevenue += rev;
    if (!r.unit_price || r.unit_price === 0) unpricedCount++;
  }
  return { totalRevenue, recordCount, unpricedCount };
}

// 作業記録ごとの作業時間（分）と按分人件費を計算
// =========================================================
// 【2026-08-16 v2.2】ペア作業の人時を正しく数える
//
// ★v1.7までの不具合
//   ここが (終了 − 開始) しか見ておらず、1人分の時間しか数えていなかった。
//   2人で90分なら投入人時は180分だが、90分として計算していた。
//   → 人件費が半分、速度が倍に見え、ペアでやった日ほど成績が良く見えていた。
//   延べ人時は v1.6 から members / total_person_minutes に記録済みだったが、
//   集計側が使っていなかった。
//
// 直し方
//   members がある記録は、1人ずつの在席時間 × その人の時給 を足し上げる。
//   members が無い古い記録は、これまでどおり1人分として扱う（壊さない）。
// =========================================================

// 指定の年月における、その人の時給
function hourlyRateOf(empId, year, month) {
  const plan = state.work_plans.find(wp =>
    wp.employee_id === empId && wp.year === year && wp.month === month);
  return plan ? (plan.hourly_rate || 0) : 0;
}

// 記録に関わった人ごとの内訳を返す
//   [{ employee_id, minutes, hourlyRate, laborCost }]
function recordMembers(record) {
  if (!record.work_started_at) return [];
  const startT = new Date(record.work_started_at);
  const y = startT.getFullYear(), m = startT.getMonth() + 1;
  const mem = Array.isArray(record.members) ? record.members.filter(x => x && x.employee_id) : [];
  if (mem.length > 0) {
    return mem.map(x => {
      const minutes = Math.max(0, Math.round(Number(x.minutes) || 0));
      const rate = hourlyRateOf(x.employee_id, y, m);
      return { employee_id: x.employee_id, minutes, hourlyRate: rate,
               laborCost: Math.round(minutes / 60 * rate) };
    });
  }
  // 古い記録（members が無い）：登録した本人が1人でやったものとして扱う
  if (!record.work_ended_at) return [];
  const minutes = Math.max(0, Math.floor((new Date(record.work_ended_at) - startT) / 60000));
  const rate = hourlyRateOf(record.employee_id, y, m);
  return [{ employee_id: record.employee_id, minutes, hourlyRate: rate,
            laborCost: Math.round(minutes / 60 * rate) }];
}

function calcRecordCost(record) {
  const mem = recordMembers(record);
  if (mem.length === 0) return { minutes: 0, laborCost: 0, hourlyRate: 0, personMinutes: 0, memberCount: 0 };
  // ★minutes は「延べ人時（分）」。1人分ではない
  const personMinutes = mem.reduce((s, x) => s + x.minutes, 0);
  const laborCost = mem.reduce((s, x) => s + x.laborCost, 0);
  // 参考：経過時間（1人分）。速度の表示などで使う場面がある
  const elapsed = (record.work_started_at && record.work_ended_at)
    ? Math.max(0, Math.floor((new Date(record.work_ended_at) - new Date(record.work_started_at)) / 60000)) : 0;
  const avgRate = personMinutes > 0 ? Math.round(laborCost / (personMinutes / 60)) : 0;
  return { minutes: personMinutes, laborCost, hourlyRate: avgRate,
           personMinutes, elapsedMinutes: elapsed, memberCount: mem.length, members: mem };
}

// =========================================================
// 【2026-08-16 v2.2】ペア作業の出来高を、かかった時間の比で各人に配る
//
// ★v1.7までの不具合
//   出来高は「登録した人」に全部ついていた。相方は0だった。
//   個人別に見ると、働いたのに何もしていない人になっていた。
//
// 配り方（社長確定 2026-08-16）
//   かかった時間の比で割る。途中参加・途中抜けもそのまま反映される。
//   粗利を労働時間で割る式なので、時間比で配れば
//   同じ速さで働いた人は同じ人時生産性になる。
// =========================================================
function splitRecordByMember(record) {
  const mem = recordMembers(record);
  const total = mem.reduce((s, x) => s + x.minutes, 0);
  const revenue = (record.unit_price || 0) * (record.quantity || 0);
  const qty = record.quantity || 0;
  const material = (record.material_cost || 0) * qty;
  return mem.map(x => {
    const share = total > 0 ? x.minutes / total : (mem.length ? 1 / mem.length : 0);
    return {
      employee_id: x.employee_id,
      minutes: x.minutes,
      hourlyRate: x.hourlyRate,
      laborCost: x.laborCost,
      share,
      revenue: revenue * share,          // 出来高（作業賃の売上）
      quantity: qty * share,
      materialCost: material * share,
      profit: revenue * share - x.laborCost,   // 粗利 ＝ 出来高 − 人件費
    };
  });
}
